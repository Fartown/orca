<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca 以任务为主 · 桌面原型</title>
    <style>
      /* Orca dark-theme tokens copied from src/renderer/src/assets/main.css (fork/integration @ cd5b6fca41).
   Tailwind palette values used by Orca are inlined so the prototype needs no build step. */
      @font-face {
        font-family: 'Geist';
        src: url('assets/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
      }
      :root {
        --font-sans:
          'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        --font-mono: 'SF Mono', ui-monospace, Menlo, Monaco, monospace;
        --radius: 0.625rem;
        --background: #0a0a0a;
        --editor-surface: #1e1e1e;
        --foreground: #fafafa;
        --card: #171717;
        --card-foreground: #fafafa;
        --popover: #171717;
        --popover-foreground: #fafafa;
        --primary: #e5e5e5;
        --primary-foreground: #171717;
        --secondary: #262626;
        --secondary-foreground: #fafafa;
        --muted: #262626;
        --muted-foreground: #a1a1a1;
        --accent: #404040;
        --accent-foreground: #fafafa;
        --border: rgb(255 255 255 / 0.07);
        --input: rgb(255 255 255 / 0.15);
        --ring: #737373;
        --destructive: #ff6568;
        --status-success: #86efac;
        --status-warning: #eab308;
        --callout-note: #4493f8;
        --callout-important: #ab7df8;
        --ai-action-accent: #a78bfa; /* violet-400 */
        --agent-working: #eab308; /* yellow-500 */
        --agent-question: #f97316; /* orange-500 */
        --agent-question-text: #fdba74; /* orange-300 */
        --agent-unverifiable: #f59e0b; /* amber-500 */
        --workspace-status-done: #c7a594;
        --workspace-status-review: #16a34a;
        --workspace-status-progress: #d4a300;
        --worktree-sidebar: #2a2a2a;
        --worktree-sidebar-accent: #353535;
        --sidebar: #171717;
        --sidebar-accent: #262626;
        --git-added: #81b88b;
        --git-modified: #e2c08d;
        --git-deleted: #c74e39;
        --diff-added-ground: color-mix(in srgb, #81b88b 16%, transparent);
        --diff-removed-ground: color-mix(in srgb, #c74e39 18%, transparent);
        /* STYLEGUIDE type scale: 10 / 11 / 12 / 13 / 14 px */
        --text-3xs: 10px;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 14px;
        /* STYLEGUIDE: at most three shadow tiers */
        --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 12px rgb(0 0 0 / 0.35);
        --shadow-lg: 0 16px 48px rgb(0 0 0 / 0.5);
        /* Keyboard-selected row recipe (jump palette) */
        --row-selected: color-mix(in srgb, var(--foreground) 8%, transparent);
      }
    </style>
    <style>
      /* Task-first desktop prototype. Base rules come from the v4 prototype; the task-first additions are at the end.
   Tokens come from assets/tokens.css only. */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #000;
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        outline: none;
      }
      button {
        cursor: pointer;
      }
      b,
      strong {
        font-weight: 600;
      }
      .ic {
        flex: none;
        display: inline-block;
        vertical-align: middle;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .fill {
        flex: 1 1 auto;
        min-width: 0;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .c-mute {
        color: var(--muted-foreground);
      }
      .c-fg {
        color: var(--foreground);
      }
      .c-q {
        color: var(--agent-question);
      }
      .c-ok {
        color: var(--status-success);
      }
      .c-unv {
        color: var(--agent-unverifiable);
      }
      .c-warn {
        color: var(--status-warning);
      }
      .c-err {
        color: var(--destructive);
      }
      .c-mg {
        color: var(--callout-important);
      }
      .add {
        color: var(--git-added);
      }
      .del {
        color: var(--git-deleted);
      }
      .nowrap {
        white-space: nowrap;
      }
      .ell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      /* ---------- Screen switcher + stage ---------- */
      .switcher {
        position: fixed;
        inset: 0 0 auto 0;
        height: 44px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 12px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }
      .switcher .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-right: 10px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .switcher .brand a {
        color: var(--muted-foreground);
        text-decoration: none;
      }
      .switcher .brand a:hover {
        color: var(--foreground);
      }
      .switcher .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        text-decoration: none;
        white-space: nowrap;
      }
      .switcher .tab span {
        font-family: var(--font-mono);
        font-size: var(--text-3xs);
        opacity: 0.7;
      }
      .switcher .tab:hover {
        background: color-mix(in srgb, var(--accent) 40%, transparent);
        color: var(--foreground);
      }
      .switcher .tab.on {
        background: var(--secondary);
        color: var(--foreground);
      }
      .stage {
        position: fixed;
        inset: 44px 0 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .frame {
        width: 1440px;
        height: 900px;
        flex: none;
        transform-origin: center center;
      }
      .screen {
        display: none;
      }
      .screen.on {
        display: block;
      }

      /* ---------- Window ---------- */
      .win {
        position: relative;
        width: 1440px;
        height: 900px;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid rgb(255 255 255 / 0.12);
        background: var(--background);
        box-shadow: var(--shadow-lg);
        display: grid;
        grid-template-columns: 272px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 26px;
      }
      .win.settings {
        grid-template-columns: 280px minmax(0, 1fr);
      }
      .main {
        grid-row: 1;
        grid-column: 2;
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .lights {
        display: flex;
        gap: 8px;
        flex: none;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .lights i:nth-child(2) {
        background: #febc2e;
      }
      .lights i:nth-child(3) {
        background: #28c840;
      }
      .titlebar {
        height: 40px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px 0 12px;
      }

      /* ---------- Status bar ---------- */
      .stbar {
        grid-row: 2;
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 12px;
        border-top: 1px solid var(--border);
        background: var(--sidebar);
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .stbar .sbs {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .meter {
        width: 44px;
        height: 4px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.1);
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        background: var(--muted-foreground);
        border-radius: 999px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
        background: var(--muted-foreground);
      }
      .dot.ok {
        background: var(--status-success);
      }

      /* ---------- Common controls ---------- */
      .icon-btn {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: inline-grid;
        place-items: center;
        color: var(--muted-foreground);
        flex: none;
      }
      .icon-btn:hover,
      .icon-btn.on {
        background: color-mix(in srgb, var(--accent) 60%, transparent);
        color: var(--foreground);
      }
      .icon-btn.sm {
        width: 24px;
        height: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--input);
        background: rgb(255 255 255 / 0.03);
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--foreground);
        white-space: nowrap;
        flex: none;
        box-shadow: var(--shadow-sm);
      }
      .btn:hover {
        background: color-mix(in srgb, var(--accent) 60%, transparent);
      }
      .btn.primary {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: transparent;
      }
      .btn.primary:hover {
        background: var(--foreground);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        color: var(--muted-foreground);
      }
      .btn.ghost:hover {
        color: var(--foreground);
        background: color-mix(in srgb, var(--accent) 60%, transparent);
      }
      .btn.sm {
        height: 24px;
        padding: 0 8px;
        font-size: var(--text-xs);
      }
      .btn.lg {
        height: 32px;
        padding: 0 12px;
        font-size: var(--text-sm);
      }
      kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: rgb(255 255 255 / 0.08);
        font-family: var(--font-sans);
        font-size: var(--text-3xs);
        font-weight: 500;
        color: var(--muted-foreground);
        line-height: 1;
      }
      .btn.primary kbd {
        background: rgb(0 0 0 / 0.08);
        border-color: rgb(0 0 0 / 0.12);
        color: rgb(23 23 23 / 0.7);
      }
      .kbds {
        display: inline-flex;
        gap: 2px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 7px;
        border-radius: 999px;
        font-size: var(--text-3xs);
        font-weight: 600;
        white-space: nowrap;
        flex: none;
        background: rgb(255 255 255 / 0.06);
        color: var(--muted-foreground);
      }
      .pill.q {
        background: color-mix(in srgb, var(--agent-question) 16%, transparent);
        color: var(--agent-question-text);
      }
      .pill.ok {
        background: color-mix(in srgb, var(--status-success) 14%, transparent);
        color: var(--status-success);
      }
      .pill.err {
        background: color-mix(in srgb, var(--destructive) 14%, transparent);
        color: var(--destructive);
      }
      .pill.work {
        background: color-mix(in srgb, var(--agent-working) 14%, transparent);
        color: var(--agent-working);
      }
      .cnt {
        display: inline-flex;
        align-items: center;
        height: 16px;
        padding: 0 6px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.06);
        font-size: var(--text-3xs);
        font-weight: 500;
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .repo {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 18px;
        padding: 0 7px 0 6px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.06);
        font-size: var(--text-2xs);
        font-weight: 600;
        color: var(--foreground);
        white-space: nowrap;
        flex: none;
      }
      .repo i {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        flex: none;
      }
      .hostc {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 18px;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .lbl {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 18px;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .lbl i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted-foreground);
        opacity: 0.7;
      }
      .stname {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 6px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.05);
        font-size: var(--text-3xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .act {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: none;
      }
      .act + .act {
        margin-left: 6px;
      }
      .act-t {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .ast {
        display: inline-grid;
        place-items: center;
        flex: none;
      }
      .spin {
        width: 75%;
        height: 75%;
        border-radius: 50%;
        border: 2px solid var(--agent-working);
        border-top-color: transparent;
        transform: rotate(45deg);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(45deg);
        }
        to {
          transform: rotate(405deg);
        }
      }
      .fdot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--destructive);
      }
      .gdot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--muted-foreground) 45%, transparent);
      }
      .unread {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--foreground);
        flex: none;
        display: inline-block;
      }
      .me-av {
        display: inline-grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--foreground);
        font-size: var(--text-3xs);
        font-weight: 600;
        flex: none;
        line-height: 1;
      }
      .subp {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .prc {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: var(--text-2xs);
        font-weight: 500;
        white-space: nowrap;
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .prc.op {
        color: var(--status-success);
      }
      .prc.dr {
        color: var(--muted-foreground);
      }
      .prc.mg {
        color: var(--callout-important);
      }
      .check {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1.5px solid var(--input);
        flex: none;
        display: inline-grid;
        place-items: center;
      }
      .check.on {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
      .radio {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1.5px solid var(--input);
        flex: none;
        display: inline-grid;
        place-items: center;
      }
      .radio.on {
        border-color: var(--foreground);
      }
      .radio.on::after {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--foreground);
      }
      .toggle {
        width: 28px;
        height: 16px;
        border-radius: 999px;
        background: var(--input);
        position: relative;
        flex: none;
      }
      .toggle::after {
        content: '';
        position: absolute;
        left: 2px;
        top: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--foreground);
      }
      .toggle.on {
        background: var(--primary);
      }
      .toggle.on::after {
        left: 14px;
        background: var(--primary-foreground);
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--input);
        background: rgb(255 255 255 / 0.03);
        font-size: var(--text-sm);
        min-width: 0;
      }
      .field.focus {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px rgb(115 115 115 / 0.25);
      }
      .field .ph {
        color: var(--muted-foreground);
      }
      .field.ro {
        background: rgb(255 255 255 / 0.015);
        border-style: dashed;
        color: rgb(250 250 250 / 0.85);
        font-size: var(--text-xs);
      }
      .area {
        border: 1px solid var(--input);
        border-radius: 6px;
        background: rgb(255 255 255 / 0.03);
        padding: 8px 10px;
        font-size: var(--text-sm);
        line-height: 1.6;
      }
      .sep-v {
        width: 1px;
        height: 20px;
        background: color-mix(in srgb, var(--foreground) 12%, transparent);
        flex: none;
      }
      .hr {
        height: 1px;
        background: var(--border);
      }

      /* ---------- Sidebar ---------- */
      .sb {
        grid-row: 1;
        grid-column: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--worktree-sidebar);
        border-right: 1px solid var(--border);
      }
      .sb-top {
        height: 40px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 14px;
      }
      .sb-top .app {
        font-size: var(--text-sm);
        font-weight: 600;
        color: rgb(250 250 250 / 0.85);
      }
      .sb-nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 2px 8px 6px;
        flex: none;
      }
      .nav-i {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: var(--text-sm);
        font-weight: 500;
        color: rgb(250 250 250 / 0.6);
      }
      .nav-i > .ic {
        color: rgb(250 250 250 / 0.3);
      }
      .nav-i.search {
        background: rgb(250 250 250 / 0.05);
      }
      .nav-i.on {
        background: var(--worktree-sidebar-accent);
        color: var(--foreground);
      }
      .nav-i.on > .ic {
        color: var(--foreground);
      }
      .need {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--agent-question) 20%, transparent);
        color: var(--agent-question-text);
        font-size: var(--text-3xs);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .ws-h {
        display: flex;
        align-items: center;
        height: 30px;
        padding: 0 8px 0 16px;
        flex: none;
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--muted-foreground);
      }
      .ws-h .tools {
        margin-left: auto;
        display: flex;
        gap: 2px;
      }
      .ws-h .icon-btn {
        width: 24px;
        height: 24px;
        position: relative;
      }
      .ws-h .icon-btn .badge {
        position: absolute;
        top: 1px;
        right: 1px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--foreground);
      }
      .ws-h .grouping {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        margin-left: 6px;
        font-weight: 400;
      }
      .sb-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        padding-bottom: 6px;
      }
      .grp {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px 0 14px;
        font-size: var(--text-xs);
        font-weight: 600;
        color: var(--foreground);
        margin-top: 2px;
      }
      .grp .repo-sq {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      .grp .hostc {
        height: 16px;
        font-size: var(--text-3xs);
        padding: 0 6px;
        font-weight: 400;
      }
      .wcard {
        margin: 0 8px 2px;
        padding: 4px 8px 5px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .wcard:hover {
        background: var(--sidebar-accent);
      }
      .wcard.on {
        background: var(--worktree-sidebar-accent);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06);
      }
      .wcard.sel {
        background: color-mix(in srgb, var(--callout-note) 14%, transparent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--callout-note) 50%, transparent);
      }
      .wc-1 {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-size: var(--text-sm);
      }
      .wc-1 .wid {
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .wc-1 .wname {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .wc-2 {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding-left: 20px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .wc-2 .br {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 1 1 auto;
      }
      .wc-2 .acts {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: none;
      }
      .sb-foot {
        height: 36px;
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 8px;
        gap: 2px;
        border-top: 1px solid var(--border);
      }

      /* Task-grouped sidebar (d8) */
      .tgh {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        margin: 2px 8px 0;
        padding: 0 6px;
        border-radius: 6px;
        font-size: var(--text-xs);
        min-width: 0;
      }
      .tgh .tid {
        color: var(--muted-foreground);
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .tgh .ttl {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 1 1 auto;
        font-weight: 600;
      }
      .tgh .ind {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        flex: none;
      }
      .tgh.collapsed .ttl {
        font-weight: 500;
        color: rgb(250 250 250 / 0.75);
      }
      .wcard.full {
        padding: 4px 8px 6px;
        gap: 2px;
        margin-left: 22px;
      }
      .agrow {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        padding-left: 2px;
        height: 18px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .agrow .aid {
        color: var(--foreground);
        flex: none;
      }
      .agrow .ell {
        flex: 1 1 auto;
      }
      .agrow .tm {
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .kind {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: var(--text-3xs);
        color: var(--muted-foreground);
        flex: none;
      }

      /* ---------- Task page ---------- */
      .tp {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 2px 24px 16px;
      }
      .srcbar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        flex: none;
      }
      .srcbar .close {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
      }
      .src {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--foreground) 6%, transparent);
        color: var(--muted-foreground);
        flex: none;
      }
      .src.on {
        border-color: color-mix(in srgb, var(--foreground) 40%, transparent);
        background: color-mix(in srgb, var(--muted) 70%, transparent);
        color: var(--foreground);
        box-shadow: var(--shadow-sm);
      }
      .src-sum {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, var(--foreground) 8%, transparent);
        background: color-mix(in srgb, var(--muted) 35%, transparent);
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .tp-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        margin-top: 12px;
      }
      .views {
        width: 188px;
        flex: none;
        padding: 0 12px 0 0;
        margin-right: 16px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .v-i {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: var(--text-sm);
        color: rgb(250 250 250 / 0.75);
      }
      .v-i > .ic {
        color: var(--muted-foreground);
      }
      .v-i .n {
        margin-left: auto;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
      }
      .v-i .key {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .v-i.on {
        background: color-mix(in srgb, var(--accent) 55%, transparent);
        color: var(--foreground);
      }
      .v-i.v-need .n {
        color: var(--agent-question-text);
        font-weight: 600;
      }
      .v-sep {
        height: 1px;
        background: var(--border);
        margin: 6px 8px;
      }
      .v-sec {
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 8px;
        margin-top: 10px;
        font-size: var(--text-2xs);
        font-weight: 500;
        color: var(--muted-foreground);
      }
      .v-sec .icon-btn {
        margin-left: auto;
        width: 20px;
        height: 20px;
      }
      .content {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        flex: none;
        margin-bottom: 10px;
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 9px 0 8px;
        border-radius: 999px;
        border: 1px solid var(--input);
        background: rgb(255 255 255 / 0.04);
        font-size: var(--text-2xs);
        font-weight: 500;
        white-space: nowrap;
        flex: none;
      }
      .fchip .key {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 7px;
        background: rgb(255 255 255 / 0.04);
        border: 1px solid var(--border);
        flex: none;
      }
      .seg > span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 5px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .seg > span.on {
        background: var(--secondary);
        color: var(--foreground);
        box-shadow: var(--shadow-sm);
      }
      .seg.wide {
        display: flex;
      }
      .seg.wide > span {
        flex: 1 1 0;
        justify-content: center;
        height: 26px;
      }
      .where {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 4px;
        font-size: var(--text-sm);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .where b {
        color: var(--foreground);
        font-weight: 500;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .tbtn b {
        color: var(--foreground);
        font-weight: 500;
      }
      .tbtn:hover {
        background: color-mix(in srgb, var(--accent) 50%, transparent);
      }

      /* List */
      .list {
        flex: 0 1 auto;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .lgrp {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 12px;
        background: rgb(255 255 255 / 0.025);
        border-bottom: 1px solid var(--border);
        font-size: var(--text-sm);
        font-weight: 500;
      }
      .lgrp.collapsed {
        color: var(--muted-foreground);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 37px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        font-size: var(--text-sm);
        min-width: 0;
        cursor: default;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }
      .row.kb {
        background: var(--row-selected);
        box-shadow: inset 2px 0 0 var(--foreground);
      }
      .row .c-id {
        width: 54px;
        flex: none;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
      }
      .row .c-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 0 1 auto;
      }
      .row .c-tags {
        display: inline-flex;
        gap: 6px;
        flex: none;
      }
      .row .c-ws {
        width: 14px;
        flex: none;
        display: inline-grid;
        place-items: center;
      }
      .row .c-act {
        display: inline-flex;
        align-items: center;
        flex: none;
        width: 96px;
      }
      .row .c-pr {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: none;
        width: 58px;
      }
      .row .c-time {
        width: 58px;
        flex: none;
        text-align: right;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .row.sub .c-prio {
        margin-left: 26px;
      }
      .row.sub {
        position: relative;
      }
      .row.sub::before {
        content: '';
        position: absolute;
        left: 20px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: color-mix(in srgb, var(--foreground) 10%, transparent);
      }
      .row.sub.last::before {
        bottom: 50%;
      }
      .row.sub::after {
        content: '';
        position: absolute;
        left: 20px;
        top: 50%;
        width: 10px;
        height: 1px;
        background: color-mix(in srgb, var(--foreground) 10%, transparent);
      }
      .kb-hint {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 30px;
        flex: none;
        margin-top: auto;
        padding: 0 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .kb-hint span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      /* Board */
      .board {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        gap: 8px;
      }
      .col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.02);
      }
      .col.narrow {
        flex: 0 0 38px;
        align-items: center;
        padding: 8px 0;
        gap: 10px;
      }
      .col.narrow .vtext {
        writing-mode: vertical-rl;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        letter-spacing: 0.2em;
      }
      .col-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 4px;
        font-size: var(--text-sm);
        font-weight: 500;
        flex: none;
      }
      .col-h .icon-btn {
        margin-left: auto;
        width: 22px;
        height: 22px;
      }
      .col-h .custom {
        font-size: var(--text-3xs);
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .bcard {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: var(--shadow-sm);
      }
      .bcard.kb {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 35%, transparent);
        background: color-mix(in srgb, var(--foreground) 6%, var(--card));
      }
      .bc-1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .bc-2 {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        font-size: var(--text-sm);
        line-height: 1.4;
      }
      .bc-3 {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-height: 18px;
      }
      .bc-par {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        min-width: 0;
        margin-bottom: -2px;
      }
      .views.rail {
        width: 44px;
        padding: 0 8px 0 0;
        margin-right: 12px;
        align-items: center;
        gap: 2px;
      }
      .rail-i {
        width: 32px;
        height: 28px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
        position: relative;
        flex: none;
      }
      .rail-i.on {
        background: color-mix(in srgb, var(--accent) 55%, transparent);
        color: var(--foreground);
      }
      .rail-b {
        position: absolute;
        top: 0;
        right: 0;
        min-width: 14px;
        height: 14px;
        padding: 0 3px;
        border-radius: 999px;
        background: var(--agent-question);
        color: var(--background);
        font-size: var(--text-3xs);
        font-weight: 600;
        line-height: 14px;
        text-align: center;
      }
      .rail-k {
        font-size: var(--text-3xs);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .rail-sep {
        width: 20px;
        height: 1px;
        background: var(--border);
        margin: 6px 0;
        flex: none;
      }
      .col-empty {
        display: grid;
        place-items: center;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        border: 1px dashed var(--border);
        border-radius: 8px;
        height: 96px;
      }
      .board-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }

      /* ---------- Task detail ---------- */
      .dview {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .dh {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px 0 12px;
        border-bottom: 1px solid var(--border);
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-sm);
        white-space: nowrap;
      }
      .crumb .s {
        color: color-mix(in srgb, var(--foreground) 25%, transparent);
      }
      .updown {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-left: 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .runchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgb(255 255 255 / 0.04);
        font-size: var(--text-2xs);
        white-space: nowrap;
      }
      .runchip .mid {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--muted-foreground);
      }
      .runchip .q {
        color: var(--agent-question-text);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .dbody {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      .dmain {
        flex: 1 1 auto;
        min-width: 0;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .dscroll {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        padding: 18px 40px 10px 40px;
      }
      .dinner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      .dtitle {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
      .ddesc {
        margin-top: 8px;
        color: rgb(250 250 250 / 0.82);
        line-height: 1.65;
      }
      .sec-h {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        margin-bottom: 6px;
        font-size: var(--text-xs);
        font-weight: 600;
        color: var(--muted-foreground);
      }
      .sec-h .opt-t {
        font-weight: 400;
      }
      .crit {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .crit li {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 26px;
        font-size: var(--text-sm);
        color: rgb(250 250 250 / 0.88);
      }
      .subs {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .srow {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 10px;
        border-bottom: 1px solid var(--border);
        font-size: var(--text-sm);
      }
      .srow .c-id {
        width: 58px;
        flex: none;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .srow .c-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .srow .who {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .srow .who b {
        color: var(--foreground);
        font-weight: 500;
      }
      .srow .who .q {
        color: var(--agent-question-text);
      }
      .sub-add {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .sub-add .hint {
        margin-left: auto;
        font-size: var(--text-2xs);
      }
      .tl {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tl-sys {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 22px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .tl-sys b {
        color: rgb(250 250 250 / 0.85);
        font-weight: 500;
      }
      .tl-sys .mono {
        font-size: var(--text-2xs);
        color: rgb(250 250 250 / 0.85);
      }
      .tl-sys .tm {
        margin-left: 2px;
      }
      .tl-item {
        display: flex;
        gap: 10px;
        margin: 6px 0;
      }
      .tl-item .body {
        flex: 1 1 auto;
        min-width: 0;
      }
      .tl-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        height: 18px;
      }
      .tl-meta b {
        color: var(--foreground);
        font-weight: 500;
      }
      .tl-text {
        margin-top: 3px;
        line-height: 1.6;
        color: rgb(250 250 250 / 0.88);
      }
      .composer {
        flex: none;
        margin: 0 40px 14px;
        border: 1px solid var(--input);
        border-radius: 8px;
        background: var(--card);
        max-width: 720px;
        align-self: center;
        width: calc(100% - 80px);
      }
      .cp-in {
        padding: 9px 12px 2px;
        font-size: var(--text-sm);
        color: var(--muted-foreground);
        min-height: 34px;
      }
      .cp-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 6px 8px;
      }

      .side-actions {
        display: flex;
        gap: 8px;
      }
      .side-actions .btn {
        flex: 1 1 0;
        height: 30px;
      }
      .sect {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sect + .sect {
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      .sect-h {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 20px;
        font-size: var(--text-xs);
        font-weight: 600;
        color: var(--muted-foreground);
      }
      .sect-h .icon-btn {
        margin-left: auto;
        width: 20px;
        height: 20px;
      }
      .wsc {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .wsc .w1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-sm);
        min-width: 0;
      }
      .wsc .w1 b {
        font-weight: 500;
      }
      .wsc .w2 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        min-width: 0;
        height: 18px;
      }
      .wsc .w2 .mono {
        color: rgb(250 250 250 / 0.85);
      }
      .ws-btns {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .ws-btns .btn {
        flex: 1 1 0;
      }
      .sess {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        margin: 0 -8px;
        border-radius: 6px;
        min-width: 0;
      }
      .sess:hover {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }
      .sess .s1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        min-width: 0;
        height: 18px;
      }
      .sess .s1 b {
        font-weight: 500;
      }
      .sess .s1 .tg {
        color: var(--muted-foreground);
        font-size: var(--text-2xs);
        white-space: nowrap;
      }
      .sess .s1 .st {
        margin-left: auto;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .sess .s1 .st.q {
        color: var(--agent-question-text);
      }
      .sess .s2 {
        padding-left: 38px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kv2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 22px;
        font-size: var(--text-xs);
      }
      .kv2 span:first-child {
        color: var(--muted-foreground);
      }

      /* ---------- Overlays ---------- */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 0.55);
        z-index: 20;
      }
      .dlg {
        position: absolute;
        z-index: 21;
        background: var(--popover);
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 12px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
      }
      .dlg-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 0 18px;
      }
      .dlg-h h2 {
        font-size: var(--text-base);
        font-weight: 600;
      }
      .dlg-h .icon-btn {
        margin-left: auto;
      }
      .dlg-sub {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 18px 0;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .dlg-b {
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dlg-f {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 12px 18px;
        border-top: 1px solid var(--border);
      }
      .dlg-f .note {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .flabel {
        font-size: var(--text-xs);
        font-weight: 500;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .flabel .muted {
        font-weight: 400;
      }
      .fhelp {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .select {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--input);
        background: rgb(255 255 255 / 0.03);
        font-size: var(--text-sm);
        min-width: 0;
      }
      .select .ic:last-child {
        margin-left: auto;
        color: var(--muted-foreground);
      }
      .select .sm {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .s-row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .opts {
        border: 1px solid var(--input);
        border-radius: 8px;
        overflow: hidden;
      }
      .opt {
        display: flex;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      .opt:last-child {
        border-bottom: 0;
      }
      .opt.on {
        background: color-mix(in srgb, var(--foreground) 6%, transparent);
      }
      .opt .radio {
        margin-top: 2px;
      }
      .opt .t {
        font-size: var(--text-sm);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .opt .d {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        margin-top: 1px;
      }
      .opts.inline {
        display: flex;
      }
      .opts.inline .opt {
        flex: 1 1 0;
        border-bottom: 0;
        border-right: 1px solid var(--border);
      }
      .opts.inline .opt:last-child {
        border-right: 0;
      }
      .callout {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: var(--text-xs);
        line-height: 1.55;
        border: 1px solid var(--border);
        background: rgb(255 255 255 / 0.03);
        color: var(--muted-foreground);
      }
      .callout .ic {
        margin-top: 2px;
      }
      .callout b {
        font-weight: 500;
        color: rgb(250 250 250 / 0.85);
      }
      .hintbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        background: rgb(255 255 255 / 0.03);
        border-top: 1px solid var(--border);
      }
      .popover {
        position: absolute;
        z-index: 30;
        background: var(--popover);
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 10px;
        box-shadow: var(--shadow-md);
      }
      .menu {
        padding: 4px;
        min-width: 220px;
      }
      .mi {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        border-radius: 6px;
        font-size: var(--text-sm);
      }
      .mi .ic {
        color: var(--muted-foreground);
      }
      .mi.on {
        background: var(--row-selected);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 10%, transparent);
      }
      .mi.on .ic {
        color: var(--foreground);
      }
      .mi.danger {
        color: var(--destructive);
      }
      .mi.danger .ic {
        color: var(--destructive);
      }
      .mi kbd {
        margin-left: auto;
      }
      .mi .sub {
        margin-left: auto;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .mlabel {
        padding: 6px 8px 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .msep {
        height: 1px;
        background: var(--border);
        margin: 4px -4px;
      }

      /* Agent quick picker + prompt preview (d5, d6) */
      .agents {
        display: flex;
        gap: 6px;
      }
      .agb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--input);
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .agb.on {
        border-color: color-mix(in srgb, var(--foreground) 45%, transparent);
        background: color-mix(in srgb, var(--foreground) 8%, transparent);
        color: var(--foreground);
      }
      .agb .def {
        font-size: var(--text-3xs);
        color: var(--muted-foreground);
      }
      .prompt {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgb(255 255 255 / 0.02);
        padding: 9px 12px;
        font-size: var(--text-xs);
        line-height: 1.6;
        color: rgb(250 250 250 / 0.82);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .prompt .ph-h {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        margin-bottom: 2px;
      }
      .prompt b {
        color: var(--foreground);
        font-weight: 500;
      }
      .prompt ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .prompt li {
        padding-left: 12px;
        position: relative;
      }
      .prompt li::before {
        content: '·';
        position: absolute;
        left: 3px;
        color: var(--muted-foreground);
      }
      .prompt .sum {
        color: var(--muted-foreground);
      }
      .linked {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 8px 0 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: rgb(255 255 255 / 0.03);
        font-size: var(--text-xs);
      }
      .linked .k {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .adv-h {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--muted-foreground);
      }

      /* ---------- Needs-you (d4) ---------- */
      .inbox {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .ib-h {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 32px;
        margin-bottom: 10px;
        flex: none;
      }
      .ib-h h1 {
        font-size: var(--text-base);
        font-weight: 600;
      }
      .ib-keys {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .ib-keys span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .ib-list {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        flex: none;
      }
      .ib-grp {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 14px;
        background: rgb(255 255 255 / 0.025);
        border-bottom: 1px solid var(--border);
        font-size: var(--text-xs);
        font-weight: 600;
        color: var(--muted-foreground);
      }
      .ib-grp .rule {
        margin-left: auto;
        font-weight: 400;
        font-size: var(--text-2xs);
      }
      .ib-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        min-height: 54px;
      }
      .ib-list > .ib-row:last-child {
        border-bottom: 0;
      }
      .ib-row .icons {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        width: 36px;
      }
      .ib-row .txt {
        flex: 1 1 auto;
        min-width: 0;
      }
      .ib-row .l1 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-sm);
        min-width: 0;
      }
      .ib-row .l1 .tid {
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        flex: none;
      }
      .ib-row .l1 .tt {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .ib-row .l2 {
        margin-top: 2px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ib-row .l2 b {
        color: rgb(250 250 250 / 0.85);
        font-weight: 500;
      }
      .ib-row .l2 code {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        color: var(--foreground);
        background: rgb(255 255 255 / 0.06);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .ib-row .acts {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .ib-row .time {
        width: 58px;
        text-align: right;
        flex: none;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .ib-row.open {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        background: var(--row-selected);
        box-shadow: inset 2px 0 0 var(--foreground);
        padding: 12px 14px 14px;
      }
      .ib-row.open .top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .ib-row.open .detail {
        margin-left: 48px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 760px;
      }
      .rb-src {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        margin-bottom: -6px;
      }
      .rb-q {
        font-size: var(--text-sm);
        line-height: 1.6;
        border-left: 2px solid color-mix(in srgb, var(--agent-question) 55%, transparent);
        padding-left: 10px;
      }
      .rb-sent {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .rb-sent .bubble {
        background: rgb(255 255 255 / 0.05);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: var(--text-sm);
        line-height: 1.5;
      }
      .dstat {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .dstat b {
        color: var(--status-success);
        font-weight: 500;
      }
      .rb-reply {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .rb-reply .field {
        flex: 1 1 auto;
      }
      .ib-foot {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 12px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        line-height: 1.6;
      }
      .ib-foot .ic {
        margin-top: 2px;
      }
      .ib-foot b {
        color: rgb(250 250 250 / 0.8);
        font-weight: 500;
      }
      .snooze {
        width: 200px;
        padding: 4px;
      }
      .snooze .mi {
        height: 28px;
        font-size: var(--text-xs);
      }
      .snooze .mi .sub {
        font-size: var(--text-3xs);
      }

      /* Hover card (d1) */
      .hovercard {
        padding: 10px 12px 11px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hc-h {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-sm);
      }
      .hc-h .muted {
        font-size: var(--text-2xs);
      }
      .hc-l {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        padding-left: 20px;
        margin-top: -3px;
      }
      .hc-ev {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
      }
      .hc-ev b {
        font-weight: 500;
      }
      .hc-note {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        line-height: 1.55;
        padding-left: 20px;
      }

      /* Task picker (d9) */
      .picker {
        padding: 0;
      }
      .pk-search {
        margin: 12px 14px 6px;
      }
      .pk-sec {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 16px;
        font-size: var(--text-2xs);
        font-weight: 500;
        color: var(--muted-foreground);
      }
      .pk-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        margin: 0 6px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: var(--text-sm);
        min-width: 0;
      }
      .pk-row .tid {
        width: 58px;
        flex: none;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .pk-row .tt {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .pk-row .why {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .pk-row.on {
        background: var(--row-selected);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 10%, transparent);
      }
      .pk-row.dis {
        color: color-mix(in srgb, var(--foreground) 40%, transparent);
      }
      .pk-row.dis .ic.st {
        opacity: 0.45;
      }

      /* ---------- Terminal (d8/d9) ---------- */
      .tabs {
        height: 40px;
        flex: none;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
      }
      .wtab {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        border-radius: 8px 8px 0 0;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .wtab.on {
        background: var(--editor-surface);
        color: var(--foreground);
      }
      .tabs .right {
        margin-left: auto;
        align-self: center;
        display: flex;
        gap: 2px;
      }
      .pane-h {
        height: 34px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: var(--editor-surface);
        border-bottom: 1px solid var(--border);
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        position: relative;
      }
      .taskchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 8px 0 7px;
        border-radius: 999px;
        border: 1px solid var(--input);
        background: rgb(255 255 255 / 0.04);
        font-size: var(--text-2xs);
        color: var(--foreground);
        white-space: nowrap;
      }
      .taskchip.open {
        border-color: color-mix(in srgb, var(--foreground) 40%, transparent);
        background: color-mix(in srgb, var(--foreground) 8%, transparent);
      }
      .taskchip.empty {
        border-style: dashed;
        color: var(--muted-foreground);
      }
      .taskchip .tid {
        color: var(--muted-foreground);
      }
      .term {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: var(--background);
        padding: 14px 18px;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        line-height: 1.55;
        color: color-mix(in srgb, var(--foreground) 82%, transparent);
        white-space: pre;
      }
      .term .o {
        color: var(--agent-question);
      }
      .term .g {
        color: var(--git-added);
      }
      .term .r {
        color: var(--git-deleted);
      }
      .term .d {
        color: var(--ring);
      }
      .term .w {
        color: var(--foreground);
      }
      .term .v {
        color: var(--ai-action-accent);
      }
      .term .box {
        color: var(--ring);
      }
      .chip-pop {
        width: 340px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chip-pop .h {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .chip-pop .h .t {
        font-size: var(--text-sm);
        font-weight: 600;
        line-height: 1.4;
      }
      .chip-pop .h .id {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .chip-pop .kvs {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .chip-pop .kv3 {

   ===================================================================== */
