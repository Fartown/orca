name: Sync upstream

# Why: this fork tracks stablyai/orca and carries its own features, listed in
# config/fork-features.jsonc. Every week this job fast-forwards `main` to upstream and
# opens a PR that merges it into the integration branch; the PR checks then run the fork
# feature gate and the architecture policies. Conflicts are never resolved here: the job
# opens an issue naming the conflicting files instead, and a person (or an agent in its
# own worktree) resolves them with `pnpm sync:upstream`.
#
# Credentials: pushes go through the FORK_SYNC_DEPLOY_KEY secret (a write deploy key scoped
# to this repository), because GITHUB_TOKEN may not push commits that touch workflow files
# and upstream changes its workflows all the time. The job verifies the merged tree itself
# (fork feature gate, architecture policies, driver bundle and every registered feature
# check); a green sync is fast-forwarded onto the integration branch, a red one stays on its
# sync branch and opens an issue. GITHUB_TOKEN cannot open pull requests in this fork, so a
# PR for a failed sync is only opened when the optional FORK_SYNC_TOKEN (fine-grained PAT,
# contents + pull requests write on this repo) is configured.

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/stablyai/orca.git
  UPSTREAM_BRANCH: main
  INTEGRATION_BRANCH: fork/integration

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git and the push key
        env:
          DEPLOY_KEY: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
        run: |
          git config user.name "orca-fork-sync"
          git config user.email "orca-fork-sync@users.noreply.github.com"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::FORK_SYNC_DEPLOY_KEY is not set; pushes that include upstream workflow changes will be rejected. See docs/reference/fork-maintenance.md."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/orca_fork_sync
          chmod 600 ~/.ssh/orca_fork_sync
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/orca_fork_sync -o IdentitiesOnly=yes"
          git remote set-url --push origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch origin "$UPSTREAM_BRANCH"

      - name: Fast-forward main to upstream
        run: |
          git fetch . "upstream/$UPSTREAM_BRANCH:$UPSTREAM_BRANCH"
          git push origin "$UPSTREAM_BRANCH:$UPSTREAM_BRANCH"

      - name: Merge upstream into a sync branch
        id: merge
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Integration already contains upstream; nothing to do."
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync/upstream-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git push --force-with-lease origin "$branch"
            echo "state=merged" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/install-node-dependencies
        if: steps.merge.outputs.state == 'merged'
        with:
          native-runtime: node

      # Why in-job: the merged tree is verified here whether or not PR CI runs later.
      # Scratch files live in RUNNER_TEMP: anything written inside the checkout counts as a
      # worktree change for the architecture gate.
      - name: Verify the merged tree
        id: verify
        if: steps.merge.outputs.state == 'merged'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Sync verification"
            echo
            for step in \
              "pnpm run check:fork-features" \
              "pnpm run check:architecture-policies -- --base upstream/$UPSTREAM_BRANCH" \
              "pnpm run build:goal-driver" \
              "node config/scripts/run-fork-feature-checks.mjs"; do
              if $step > "$RUNNER_TEMP/step.log" 2>&1; then
                echo "- ✅ \`$step\`"
              else
                echo "- ❌ \`$step\`"
                echo
                echo '```'
                tail -n 40 "$RUNNER_TEMP/step.log"
                echo '```'
                echo "failed=true" >> "$GITHUB_OUTPUT"
                break
              fi
            done
          } | tee "$RUNNER_TEMP/verify-summary.md"
          cat "$RUNNER_TEMP/verify-summary.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -q '❌' "$RUNNER_TEMP/verify-summary.md"; then exit 1; fi

      # Why fast-forward instead of a PR: GITHUB_TOKEN cannot open pull requests in this fork,
      # and the merged tree was just verified by the same gates a PR would run. A green sync
      # lands; a red one leaves the sync branch in place and opens an issue.
      - name: Land the verified sync
        if: steps.merge.outputs.state == 'merged' && steps.verify.outputs.failed != 'true'
        run: |
          git push origin "HEAD:$INTEGRATION_BRANCH"
          git push origin --delete "${{ steps.merge.outputs.branch }}" || true
          {
            echo "Landed on \`$INTEGRATION_BRANCH\`: $(git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the sync pull request (only with FORK_SYNC_TOKEN)
        if: steps.merge.outputs.state == 'merged' && steps.verify.outputs.failed == 'true' && env.FORK_SYNC_TOKEN != ''
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          title="sync: upstream main $(date -u +%Y-%m-%d) [checks failed]"
          existing=$(gh pr list --base "$INTEGRATION_BRANCH" --head "${{ steps.merge.outputs.branch }}" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for this branch."
            exit 0
          fi
          {
            echo "Merges stablyai/orca main at \`$upstream_sha\` into \`$INTEGRATION_BRANCH\`."
            echo
            cat "$RUNNER_TEMP/verify-summary.md"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Opened by the sync-upstream workflow because a check failed. Fix on this branch, then \`pnpm sync:upstream\` locally or re-run the workflow."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --base "$INTEGRATION_BRANCH" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Report a failed verification
        if: steps.merge.outputs.state == 'merged' && steps.verify.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          {
            echo "Merging stablyai/orca main at \`$upstream_sha\` into \`$INTEGRATION_BRANCH\` merged cleanly but a check failed."
            echo "The merge is on branch \`${{ steps.merge.outputs.branch }}\`."
            echo
            cat "$RUNNER_TEMP/verify-summary.md"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo 'Fix it locally from a clean `'"$INTEGRATION_BRANCH"'` checkout with `pnpm sync:upstream` (resolve, keep every feature in config/fork-features.jsonc, commit, re-run with --push).'
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "Upstream sync checks failed ($(date -u +%Y-%m-%d))" --label sync-upstream --body-file "$RUNNER_TEMP/issue-body.md" \
            || gh issue create --title "Upstream sync checks failed ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/issue-body.md" \
            || echo "::warning::could not open an issue; see the job summary"
          exit 1

      - name: Open a conflict issue
        if: steps.merge.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          {
            echo "Merging stablyai/orca main at \`$upstream_sha\` into \`$INTEGRATION_BRANCH\` conflicts in:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo 'Resolve locally from a clean `'"$INTEGRATION_BRANCH"'` checkout:'
            echo
            echo '```'
            echo 'pnpm sync:upstream          # stops on the same conflicts'
            echo '# resolve, keeping every feature in config/fork-features.jsonc'
            echo 'git add -A && git commit    # commit the merge before the gates run'
            echo 'pnpm sync:upstream --push   # re-runs every gate and feature check, then pushes'
            echo '```'
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "Upstream sync conflict ($(date -u +%Y-%m-%d))" --label sync-upstream --body-file "$RUNNER_TEMP/issue-body.md" \
            || gh issue create --title "Upstream sync conflict ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/issue-body.md"
