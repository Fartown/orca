            return `${navbar({ back: '任务', title: `${h.online ? '<span class="host-dot"></span>' : '<span class="host-dot off"></span>'}${h.name}`, right: soon('plus', '新建工作区') })}
      <div class="scroll">
        ${h.online ? '' : `<div style="margin:6px 16px 0" class="offline-band">${stateDot('unverifiable', 14)}<div><div>${h.name} 未连接 · ${h.lost}</div><div class="s">下面是上次读到的工作区。恢复联系后重读一次，不会自己重连。</div></div></div>`}
        ${body}<div class="pad-bottom"></div></div>`
          }

          // ---------- overlays ----------
          overlayView() {
            let html = ''
            if (this.s.preview) html += this.vPreview(this.s.preview)
            if (this.s.sheet)

                : `<div class="peek-in"><div class="term-in"><span class="d">&gt;</span><input data-k="peek-reply" data-enter="peek-send" placeholder="发给 ${s.agent}，回车发送 · 方向键选菜单" value="${esc(reply)}"><button class="send-btn sm ${reply.trim() ? 'on' : ''}" data-act="peek-send" data-needs="peek-reply" aria-label="发送">${ic('send')}</button></div></div>`
            // 任务和子任务不止一个会话时，会话名是个小下拉，切换后抽屉里换成那个会话。
            const root = this.rootOf(t)

            const swName = (x) =>
              `${x.agent}${x.task !== root.id ? ` · ${esc(this.task(x.task).title.split(/[：:]/)[0].slice(0, 6))}` : ''}`
            const name =

                    .map((x) => {

            return `<div class="sheet tall"><div class="pull" data-act="open-session" data-sid="${s.id}" ${off ? 'data-off="1"' : ''}><div class="grabber"></div><span>${off ? '' : '上拉到全屏'}</span></div>
        <div class="peek-h">${stateDot(info.dot, 16)}<div class="row-main"><div class="t">${name}<span class="stt ${info.cls}">${info.text}</span></div>
          <div class="s task" data-act="open-task" data-id="${t.id}">${ic('list-todo', 's12')}<span class="ell">${esc(t.title)}</span><span class="tid">${t.id}</span></div>
          <div class="s">${ic(s.view === 'chat' ? 'message-square' : 'square-terminal', 's12')}${s.view === 'chat' ? '聊天' : '终端'} · ${w.name} · ${h.name}</div></div>
          <button class="close-x" data-act="close-sheet">${ic('x')}</button></div>
        ${swPop}
        ${off ? `<div style="padding:0 16px 8px;flex:none"><div class="offline-band">${stateDot('unverifiable', 14)}<div><div>${h.name} 未连接 · ${h.lost}</div><div class="s">下面是上次读到的内容（2 小时前），不能输入。恢复联系后只重读一次，不会自己重连。</div></div></div></div>` : ''}
        <div class="sheet-body" style="flex:1" data-stick-bottom>${body}</div>

          vReject(sh) {

          <div class="note-line">${ic('info', 's14')}<span>完成只能由你来定。通过后任务移到完成；会话不受影响，还在跑的会接着跑。</span></div></div>

          vStartSheet(sh) {

          // ======================================================================
          render() {
            if (!this.el) return
            const vp = this.el.querySelector('.viewport')

            if (sc && this.lastRoute) this.scrollMem[this.routeKey(this.lastRoute)] = sc.scrollTop
            const sb = ov.querySelector('.sheet-body')
            const sheetTop =
              sb && this.lastSheet === (this.s.sheet && this.s.sheet.name) ? sb.scrollTop : 0
            const a = document.activeElement
            let focus =
              a && this.el.contains(a) && a.dataset.k
                ? { k: a.dataset.k, s: a.selectionStart, e: a.selectionEnd }
                : null
            if (this.s.focus) {
              focus = { k: this.s.focus, end: true }
              this.s.focus = null
            }
            vp.innerHTML = this.view()
            ov.innerHTML = this.overlayView()
            vp.querySelectorAll('.cb-field textarea, textarea.f-desc').forEach(autosize)
            this.el
              .querySelector('.statusbar')
              .classList.toggle('on-card', this.s.route.name === 'session')
            const sc2 = vp.querySelector('.scroll')
            const mem = this.scrollMem[this.routeKey(this.s.route)]
            if (sc2 && mem) sc2.scrollTop = mem
            if (sc2 && this.s.scrollBottom) {
              sc2.scrollTop = sc2.scrollHeight
              this.s.scrollBottom = false
            }
            if (sc2 && this.s.scrollTo) {
              const a = sc2.querySelector(`[data-anchor="${this.s.scrollTo}"]`)
              if (a) sc2.scrollTop = offsetWithin(a, sc2) - 8
              this.s.scrollTo = null
            }
            const sb2 = ov.querySelector('.sheet-body')
            if (sb2 && sb2.hasAttribute('data-stick-bottom')) sb2.scrollTop = sb2.scrollHeight
            else if (sb2 && sheetTop) sb2.scrollTop = sheetTop
            this.lastRoute = this.s.route
            this.lastSheet = this.s.sheet && this.s.sheet.name
            if (focus) {
              const el = this.el.querySelector(`[data-k="${focus.k}"]`)
              if (el) {
                el.focus({ preventScroll: true })
                const pos = focus.end ? el.value.length : focus.s
                try {
                  el.setSelectionRange(pos, focus.end ? pos : focus.e)
                } catch (_) {
                  /* inputs without selection */
                }
              }
            }
          }
          tick() {
            let full = false
            for (const c of Object.values(this.cards)) {
              if (c.undone || c.historical || c.kind === 'noproj') continue
              const t = this.task(c.task)
              c.age++
              if (c.undoLeft > 0) {
                c.undoLeft--
                if (c.undoLeft === 0) full = true
                else {
                  this.el.querySelectorAll(`[data-cd="${c.key}"]`).forEach((n) => {
                    n.textContent = c.undoLeft
                  })
                  this.el.querySelectorAll(`[data-cdbar="${c.key}"]`).forEach((n) => {
                    n.style.width = `${c.undoLeft * 10}%`
                  })
                }
              }
              if (t && t.pendingTitle && c.age >= 3) {
                t.title = t.pendingTitle
                t.pendingTitle = null
                t.freshTitle = true
                full = true
              } else if (t && t.freshTitle && c.age >= 8) {
                t.freshTitle = false
                full = true
              }
            }
            if (full) this.render()
          }
          form(fk) {
            return fk === 'sheet' ? this.s.sheet.form : this.s.form
          }
          refreshForm(fk) {
            if (fk === 'new') {
              const sum = this.formSummary(this.s.form)
              const btn = this.el.querySelector('[data-sum="btn"]')
              if (btn) {
                btn.disabled = !sum.ok
                btn.innerHTML = `${ic(sum.label === '创建' ? 'check' : 'play')}${sum.label}`
              }
              const hint = this.el.querySelector('[data-sum="hint"] span')
              if (hint) hint.textContent = sum.hint
            }
          }

          onInput(el, ev) {
            const k = el.dataset.k
            const v = el.value
            const needs = () =>
              this.el.querySelectorAll(`[data-needs="${k}"]`).forEach((b) => {
                b.disabled = !v.trim()
                b.classList.toggle('on', !!v.trim())
              })
            if (k.startsWith('comp-')) {
              const comp = el.dataset.comp
              const pos = el.selectionStart || v.length
              if (!ev.isComposing && v[pos - 1] === '@') {
                this.s.comp[comp].text = v.slice(0, pos - 1) + v.slice(pos)
                this.s.sheet = { name: 'mention', comp, q: '', tab: 'all' }
                this.s.focus = 'mention-q'
                this.render()
                return
              }
              this.s.comp[comp].text = v
              autosize(el)
              const send = this.el.querySelector(`.cb-send[data-comp="${comp}"]`)
              if (send) send.classList.toggle('on', !!v.trim())
              if (comp === 'home' && !ev.isComposing) {
                const hint = this.hint('home')
                let box = this.el.querySelector('.cb-hint')
                if (hint && !box) {
                  this.el
                    .querySelector('.composer')
                    .insertAdjacentHTML('afterend', '<div class="cb-hint"></div>')
                  box = this.el.querySelector('.cb-hint')
                }
                if (box) {
                  if (hint) box.innerHTML = hint
                  else box.remove()
                }
              }
              return
            }
            if (k === 'mention-q') {
              this.s.sheet.q = v
              const list = this.el.querySelector('[data-mlist]')
              if (list) list.innerHTML = this.mentionRows(this.s.sheet)
              return
            }
            if (k === 'peek-reply') {
              this.s.sheet.reply = v
              needs()
              return
            }
            if (k === 'sess-reply') {
              this.s.sessReply = v
              needs()
              return
            }
            if (k === 'reject-text') {
              this.s.sheet.text = v
              needs()
              return
            }
            if (k.startsWith('cmt-')) {
              this.s.ui.comment[k.slice(4)] = v
              needs()
              return
            }
            if (k.startsWith('pp-title-')) {
              const msg = this.conv(this.s.convId).msgs[+el.dataset.mi]
              msg.proposal.items.find((i) => i.key === el.dataset.key).title = v
              return
            }
            const fk = el.dataset.form
            if (!fk) return
            const f = this.form(fk)
            if (k === `${fk}-q`) {
              f.q = v
              const list = this.el.querySelector(`[data-wslist="${fk}"]`)
              if (list) list.innerHTML = this.vWsList(f, fk)
              return
            }
            if (k === 'f-title') f.title = v
            if (k === 'f-desc') {
              f.desc = v
              autosize(el)
            }
            if (k === `${fk}-ws`) f.wsName = v
            if (k === `${fk}-prompt`) f.prompt = v
            this.refreshForm(fk)
          }

          act(name, el) {
            const id = el.dataset.id
            const fk = el.dataset.form
            // Any other tap closes the session switcher in the quick-view sheet.
            if (name !== 'peek-sw' && this.s.sheet && this.s.sheet.sw) this.s.sheet.sw = false
            switch (name) {
              case 'noop':
                return
              case 'soon':
                this.toast('原型没做这一页', 'info')
                break
              case 'soon-msg':
                this.s.sheet = null
                this.toast(el.dataset.msg || '原型没做这一步', 'info')
                break
              case 'more-open':
                this.s.sheet = { name: 'more', tid: id }
                break
              case 'status-open':
                this.s.sheet = { name: 'status', tid: id }
                break
              case 'status-set': {
                const t = this.task(id)
                const to = el.dataset.v
                this.s.sheet = null
                if (t.status === to) break
                t.timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html: `状态 ${STATUS_NAME[t.status]} → <b>${STATUS_NAME[to]}</b>（手动改的）`
                })
                t.status = to
                t.updated = '刚刚'
                break
              }
              case 'ws-open':
                this.s.sheet = { name: 'ws', tid: id }
                break
              case 'sys-toggle':
                this.s.ui.sysOpen[id] = !this.s.ui.sysOpen[id]
                break
              case 'scroll-accept':
                this.s.scrollTo = 'accept'
                break
              case 'back':
                this.back()
                break
              case 'open-task':
                this.go({ name: 'task', id })
                break
              case 'open-tasks':
                this.go({ name: 'tasks' })
                break
              case 'tseg':
                this.s.tseg = el.dataset.v
                break
              case 'open-host':
                this.go({ name: 'host', id })
                break
              case 'open-chat':
                this.go({ name: 'chat' })
                this.s.scrollBottom = true
                break
              case 'open-session':
                this.go({ name: 'session', sid: el.dataset.sid })
                break
              case 'open-conv':
                this.s.convId = id
                if (this.s.route.name === 'chat') this.s.sheet = null
                else this.go({ name: 'chat' })
                this.s.scrollBottom = true
                break
              case 'new-conv':
                this.s.convId = 'c-now'
                this.convs['c-now'] =
                  this.convs['c-now'] && this.convs['c-now'].msgs.length
                    ? this.convs['c-now']
                    : { id: 'c-now', msgs: [] }
                this.s.focus = 'comp-chat'
                break
              case 'history':
                this.s.sheet = { name: 'history' }
                break
              case 'fold-done':
                this.s.foldDone = !this.s.foldDone
                break
              case 'close-sheet':
                this.s.sheet = null
                break
              case 'close-preview':
                this.s.preview = null
                break
              case 'mention':
                this.s.sheet = { name: 'mention', comp: el.dataset.comp, q: '', tab: 'all' }
                this.s.focus = 'mention-q'
                break
              case 'm-tab':
                this.s.sheet.tab = el.dataset.v
                break
              case 'pick': {
                const comp = this.s.sheet.comp
                this.s.comp[comp].chips.push({ type: el.dataset.type, id })
                this.s.sheet = null
                this.s.focus = `comp-${comp}`
                break
              }
              case 'chip-x':
                this.s.comp[el.dataset.comp].chips.splice(+el.dataset.i, 1)
                break
              case 'send':
                this.send(el.dataset.comp || 'home')
                return
              case 'undo':
                this.undo(el.dataset.key)
                return
              case 'proj-ok':
                this.projOk(el.dataset.key)
                break
              case 'proj-cancel':
                this.projCancel(el.dataset.key)
                break
              case 'disp-x':
                this.s.dispatched = this.s.dispatched.filter((k) => k !== el.dataset.key)
                break
              case 'snooze':
                this.task(id).snoozed = true
                this.toast('1 小时后再提醒', 'clock')
                break
              case 'peek':
                this.s.preview = null
                this.openPeek(el.dataset.sid)
                break
              case 'peek-sw':
                this.s.sheet.sw = !this.s.sheet.sw
                break
              case 'peek-to':
                this.openPeek(el.dataset.sid)
                break
              case 'peek-send':
                this.peekSend()
                break
              case 'peek-opt': {
                const s = this.ses(this.s.sheet.sid)
                if (this.canSend(s)) {
                  this.sendToSession(s, el.dataset.v)
                  this.s.focus = 'peek-reply'
                }
                break
              }
              case 'sess-opt': {
                const s = this.ses(this.s.route.sid)
                if (this.canSend(s)) {
                  this.sendToSession(s, el.dataset.v)
                  this.s.scrollBottom = true
                }
                break
              }
              case 'sess-send': {
                const s = this.ses(this.s.route.sid)
                const txt = (this.s.sessReply || '').trim()
                if (!txt || !this.canSend(s)) return
                this.sendToSession(s, txt)
                this.s.sessReply = ''
                this.s.scrollBottom = true
                break
              }
              case 'stop': {
                const s = this.ses(el.dataset.sid)
                s.state = 'done'
                s.last = '已停止这一轮。'
                s.term.push('  <span class="d">⎿  Interrupted by user</span>')
                this.task(s.task).timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html: `在速览里停止了 ${s.agent} 这一轮（手机）`
                })
                this.toast('已停止这一轮', 'square')
                break
              }
              case 'all-progress':
                this.s.ui.allProgress[id] = !this.s.ui.allProgress[id]
                break
              case 'gen-summary':
                this.s.ui.genRunning[id] = true
                setTimeout(() => {
                  this.s.ui.genRunning[id] = false
                  this.addSummary(id)
                  this.toast('已生成一条进展，标明「Orca 生成」', 'sparkles')
                  this.render()
                }, 1500)
                break
              case 'comment': {
                const txt = (this.s.ui.comment[id] || '').trim()
                if (!txt) return
                this.task(id).timeline.push({
                  who: '你',
                  kind: 'you',
                  time: '刚刚',
                  html: '评论（手机）',
                  comment: txt
                })
                this.s.ui.comment[id] = ''
                break
              }
              case 'pass':
                this.s.sheet = null
                this.pass(id)
                break
              case 'reject-open':
                this.s.sheet = { name: 'reject', tid: id, text: '' }
                this.s.focus = 'reject-text'
                break
              case 'reject':
                if (this.s.sheet.text.trim()) this.reject(id, this.s.sheet.text.trim())
                break
              case 'accept-open':
                this.s.sheet = { name: 'accept', tid: id }
                break
              case 'start-open':
                this.s.preview = null
                this.s.sheet = {
                  name: 'start',
                  tid: id,
                  form: { agent: 'Claude', prompt: '按任务说明开始' }
                }
                break
              case 'start': {
                const t = this.task(id)
                const f = this.s.sheet.form
                const n = this.sessionsOf(id).length + 1
                this.d.sessions.push({
                  id: `s-${id}-${n}`,
                  task: id,
                  agent: f.agent,
                  view: 'terminal',
                  state: 'working',
                  since: '刚刚',
                  last: '',
                  term: [
                    `<span class="o">✻</span> Welcome to ${f.agent === 'Claude' ? 'Claude Code' : 'Codex'}`,
                    '',
                    `<span class="d">&gt;</span> ${esc(f.prompt)}`
                  ]
                })
                t.timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html: `开了 ${f.agent} 会话，第一句「${esc(f.prompt)}」直接发送（手机）`
                })
                this.s.sheet = null
                this.toast(`${f.agent} 会话已启动`)
                break
              }
              case 'goal-open':
                this.s.sheet = { name: 'goal', tid: id }
                break
              case 'goal': {
                const t = this.task(id)
                t.goal = true
                t.timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html: '设为目标：守卫按任务描述验收，结论写成进展（手机）'
                })
                this.s.sheet = null
                this.toast('已设为目标', 'target')
                break
              }
              case 'startwork-open':
                this.s.sheet = {
                  name: 'startwork',
                  tid: id,
                  form: this.blankForm({
                    project: this.task(id).project,
                    repo: this.proj(this.task(id).project).repo,
                    wsName: id.toLowerCase(),
                    pick: null
                  })
                }
                break
              case 'startwork': {
                const t = this.task(id)
                const f = this.s.sheet.form
                if (f.where === 'existing' && !f.pick) return
                const { w } = this.commitForm(f, t)
                this.s.sheet = null
                this.toast(w && f.agent !== 'none' ? `已开始做，${f.agent} 会话已启动` : '已开始做')
                break
              }
              case 'new-task':
                this.openNew(false)
                break
              case 'create':
                this.createFromForm()
                break
              case 'proj-open':
                this.s.sheet = { name: 'proj' }
                break
              case 'proj-pick':
                this.s.form.project = el.dataset.v
                this.s.form.repo = this.proj(el.dataset.v).repo
                this.s.sheet = null
                break
              case 'f-where':
                this.form(fk).where = el.dataset.v
                break
              case 'f-pick':
                this.form(fk).pick = el.dataset.v
                break
              case 'f-repo':
                this.form(fk).repo = el.dataset.v
                break
              case 'f-agent':
                this.form(fk).agent = el.dataset.v
                break
              case 'pp-toggle': {
                const it = this.conv(this.s.convId).msgs[+el.dataset.mi].proposal.items.find(
                  (i) => i.key === el.dataset.key
                )
                it.on = !it.on
                break
              }
              case 'pp-edit': {
                const p = this.conv(this.s.convId).msgs[+el.dataset.mi].proposal
                p.editing = p.editing === el.dataset.key ? null : el.dataset.key
                if (p.editing) this.s.focus = `pp-title-${p.editing}`
                break
              }
              case 'pp-agent': {
                const it = this.conv(this.s.convId).msgs[+el.dataset.mi].proposal.items.find(
                  (i) => i.key === el.dataset.key
                )
                it.agent = el.dataset.agent
                break
              }
              case 'pp-cancel': {
                const p = this.conv(this.s.convId).msgs[+el.dataset.mi].proposal
                p.done = true
                p.cancelled = true
                break
              }
              case 'pp-confirm':
                this.confirmProposal(this.conv(this.s.convId).msgs[+el.dataset.mi])
                break
              default:
                return
            }
            this.render()
          }
        }

        // ======================================================================
        // 屏幕清单：每台手机给一个起始状态；之后都能接着点。
        const fill = (p, chip, text) => {
          p.s.comp.home = { chips: [chip], text }
        }
        // 标题已生成、撤销期已过：像几分钟前派出的一样。
        const settle = (p, c) => {
          const t = p.task(c.task)
          if (t.pendingTitle) {
            t.title = t.pendingTitle
            t.pendingTitle = null
          }
          t.freshTitle = false
        }
        const A1 = (p, done = false) => {
          fill(p, { type: 'ws', id: 'orca/docs-typo' }, '把 README 里过期的链接都修一下')
          const c = p.send('home')
          if (done) {

            c.undoLeft = 0
            p.s.dispatched = p.s.dispatched.filter((k) => k !== c.key)
          }
          return c
        }
        const A2 = (p) => {
          fill(p, { type: 'ws', id: 'orca/feat-reconnect' }, '这里给我调研一下重连为什么要 3 秒')
          return p.send('home')
        }
        // 桌面那一路的历史里，今天先派了 A1、A2，再发了 B；手机的 m6 照这个顺序，B 派出的编号接着往后排。

          A1(p, true)
          p.conv('c-a1').time = '9:20'
          p.s.convId = 'c-a2'

          settle(p, c)
          c.undoLeft = 0
          p.conv('c-a2').time = '9:26'
          p.s.dispatched = []
          p.s.convId = 'c-today'
        }
        const toTasks = (p) => p.go({ name: 'tasks' })
        const SCREENS = [

          },
          {
            id: 'm6',
            name: '通用对话',
            desc: '路径 B：没有 @ 在哪做，交给调度会话。它先只读查询并写明查了什么，再给提案卡；每项可以勾掉、改标题和智能体。点「确认派活」后出现两张「已派活」卡，同样能撤销。右上角是对话历史（按天分组）和新对话；底部输入框和首页是同一个组件。',
            frames: [
              {

            frames: [

              },

          {
            id: 'm8',
            name: '新建任务',
            desc: '全屏表单，一次完成三步：① 标题、描述；② 在哪做：已有工作区（可搜索，dbox 的置灰）、新建工作区（选仓库和主机）、稍后再定；③ 开工：智能体默认 Claude，可选「先不开」，第一句指令默认「按任务说明开始」。手机没有「放进输入框」，一律直接发送并写明原因（D-010）。点「创建并开工」后停在任务详情。',
            frames: [
              { caption: '① 任务 ② 在哪做：已有工作区', init: (p) => p.openNew(true) },
              {
                caption: '② 选「新建工作区」③ 开工',
                init: (p) => {
                  p.openNew(true)
                  p.s.form.where = 'new'
                },
                scroll: 'step2'
              },
              {
                caption: '点「创建并开工」：停在任务详情',
                init: (p) => {

                }
              }
            ]
          }
        ]

        // ---------- page ----------
        const tabs = document.getElementById('tabs')
        const stage = document.getElementById('stage')
        const desc = document.getElementById('desc')
        let PHONES = []
        tabs.innerHTML = `<a href="#all" data-id="all">总览</a>${SCREENS.map((s) => `<a href="#${s.id}" data-id="${s.id}"><b>${s.id}</b>${s.name}</a>`).join('')}`

        // offsetTop 链累加，不受总览页 CSS zoom 影响。
        const offsetWithin = (el, box) => {
          let y = 0
          while (el && el !== box) {
            y += el.offsetTop
            el = el.offsetParent
          }
          return y
        }
        function mountFrames(root, frames) {
          root.querySelectorAll('.screen[data-phone]').forEach((el) => {
            const i = +el.dataset.phone
            const fr = frames[i]
            const p = new Phone()
            PHONES[i] = p
            if (fr.init) fr.init(p)
            p.el = el
            p.render()
            const sc = el.querySelector('.viewport .scroll')
            if (fr.scroll && sc) {
              if (fr.scroll === 'bottom') sc.scrollTop = sc.scrollHeight
              else {
                const a = sc.querySelector(`[data-anchor="${fr.scroll}"]`)
                if (a) sc.scrollTop = offsetWithin(a, sc) - 8
              }
            }
            const sb = el.querySelector('.overlay .sheet-body')
            if (fr.sheetScroll && sb) {
              const a = sb.querySelector(`[data-anchor="${fr.sheetScroll}"]`)
              if (a) sb.scrollTop = offsetWithin(a, sb) - 4
            }
          })
        }
        function fit() {
          const frames = stage.querySelector('.frames')
          if (!frames || SHOT) return
          frames.style.zoom = 1
          const avail = window.innerHeight - stage.getBoundingClientRect().top - 24
          frames.style.zoom = Math.max(
            Math.min(1, (stage.clientWidth - 48) / frames.scrollWidth, avail / frames.scrollHeight),
            0.4
          )
        }
        function render() {
          const id = location.hash.slice(1) || 'm1'
          tabs.querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.id === id))
          PHONES = []
          if (id === 'all') {
            desc.textContent = `全部 ${SCREENS.length} 屏。点屏幕标题进入该屏；每台手机在这里也能点。界面文字用简体中文方便评审，真实 App 是英文。`
            let n = 0
            const all = []
            stage.innerHTML = `<div class="overview">${SCREENS.map(
              (s) =>
                `<section class="ov-screen"><h2><a href="#${s.id}"><span>${s.id}</span>${s.name}</a></h2><div class="frames">${s.frames
                  .map((f) => {
                    all.push(f)
                    return phoneShell(n++, f.caption)
                  })
                  .join('')}</div></section>`
            ).join('')}</div>`
            mountFrames(stage, all)
            return
          }
          const s = SCREENS.find((x) => x.id === id) || SCREENS[0]
          desc.textContent = s.desc
          stage.innerHTML = `<div class="frames" id="frames-${s.id}">${s.frames.map((f, i) => phoneShell(i, f.caption)).join('')}</div>`
          mountFrames(stage, s.frames)
          fit()
        }

        const phoneOf = (target) => {
          const scr = target.closest && target.closest('.screen[data-phone]')
          return scr ? PHONES[+scr.dataset.phone] : null
        }
        document.addEventListener('click', (e) => {
          const p = phoneOf(e.target)
          if (!p) return
          if (p.suppressClick) {
            p.suppressClick = false
            e.preventDefault()
            return
          }
          const el = e.target.closest('[data-act]')
          if (!el || !p.el.contains(el)) return
          e.preventDefault()
          if (el.disabled || el.hasAttribute('disabled')) return
          p.act(el.dataset.act, el)
        })
        document.addEventListener('input', (e) => {
          const p = phoneOf(e.target)
          if (p && e.target.dataset.k) p.onInput(e.target, e)
        })
        document.addEventListener('keydown', (e) => {
          const p = phoneOf(e.target)
          if (!p || e.key !== 'Enter' || e.shiftKey || e.isComposing || !e.target.dataset.enter)
            return
          e.preventDefault()
          const el = e.target
          if (el.dataset.enter === 'send') p.send(el.dataset.comp)
          else p.act(el.dataset.enter, el)
        })
        // 长按任务卡：看完整进展（方案 §5.1「悬停或长按可以展开完整摘要」）。
        let pressTimer = null
        document.addEventListener('pointerdown', (e) => {
          const card = e.target.closest('[data-press]')
          const p = phoneOf(e.target)
          if (!card || !p || e.target.closest('button')) return
          clearTimeout(pressTimer)
          pressTimer = setTimeout(() => {
            const t = p.task(card.dataset.press)
            if (!t || !p.leadSession(t) || !p.latest(t)) return
            p.s.preview = { tid: t.id }
            p.suppressClick = true
            p.render()
          }, 450)
        })
        ;['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach((ev) =>
          document.addEventListener(ev, (e) => {
            if (ev !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 4)
              clearTimeout(pressTimer)
          })
        )
        // 长按松手后的那次 click 可能落在已被替换的卡片上而不触发；只吞掉紧跟着的那一次。
        document.addEventListener('pointerup', (e) => {
          const p = phoneOf(e.target)
          if (p && p.suppressClick)
            setTimeout(() => {
              p.suppressClick = false
            }, 0)
        })
        if (!SHOT) setInterval(() => PHONES.forEach((p) => p && p.tick()), 1000)
        window.addEventListener('hashchange', render)
        window.addEventListener('resize', fit)
        render()
      })()
    </script>
