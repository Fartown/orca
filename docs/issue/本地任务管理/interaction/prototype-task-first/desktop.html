        background: color-mix(in srgb, var(--accent) 40%, transparent);
      }
      .mp-row.on {
        background: var(--row-selected);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 12%, transparent);
      }
      .mp-row.dis {
        cursor: not-allowed;
        color: color-mix(in srgb, var(--foreground) 38%, transparent);
      }
      .mp-row.dis .mp-ic,
      .mp-row.dis .mp-sub {
        opacity: 0.55;
      }
      .mp-ic {
        display: inline-grid;
        place-items: center;
        width: 16px;
        color: var(--muted-foreground);
        flex: none;
      }
      .mp-n {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 0 1 auto;
      }
      .mp-sub {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .mp-r {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .mp-r.own {
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 6px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.06);
      }
      .mp-why {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-2xs);
        color: var(--agent-unverifiable);
        white-space: nowrap;
        flex: none;
      }
      .mp-more {
        padding: 2px 8px 4px 32px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .mp-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        padding: 8px 8px 4px;
        border-top: 1px solid var(--border);
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .mp-empty {
        padding: 14px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }

      /* Dispatch receipts */
      .rcpts {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        flex: none;
      }
      .rcpt {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: color-mix(in srgb, var(--card) 70%, transparent);
        padding: 8px 10px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .rcpt.live {
        border-color: color-mix(in srgb, var(--status-success) 35%, transparent);
        box-shadow: inset 3px 0 0 color-mix(in srgb, var(--status-success) 70%, transparent);
      }
      .rcpt.undone {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        padding: 8px 10px 8px 12px;
      }
      .rc-1 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-xs);
        height: 24px;
      }
      .rc-1 b {
        font-weight: 600;
      }
      .rc-1 .muted {
        font-size: var(--text-2xs);
      }
      .rc-done {
        font-size: var(--text-2xs);
      }
      .btn.undo {
        gap: 5px;
      }
      .btn.undo .cd {
        display: inline-grid;
        place-items: center;
        min-width: 18px;
        height: 16px;
        padding: 0 4px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--foreground) 12%, transparent);
        font-size: var(--text-3xs);
        font-variant-numeric: tabular-nums;
      }
      .rc-2 {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .rc-t {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        cursor: pointer;
      }
      .rc-title {
        font-size: var(--text-base);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 4px;
        padding: 0 2px;
        margin: 0 -2px;
      }
      .rc-t:hover .rc-title {
        text-decoration: underline;
        text-decoration-color: var(--input);
        text-underline-offset: 3px;
      }
      .gen {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-2xs);
        color: var(--ai-action-accent);
        white-space: nowrap;
        flex: none;
      }
      .gen.pending {
        color: var(--muted-foreground);
      }
      .rc-why {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: rgb(250 250 250 / 0.85);
        padding: 5px 8px;
        border-radius: 6px;
        background: rgb(255 255 255 / 0.04);
      }
      .rc-why .ic {
        color: var(--callout-note);
      }
      .rc-3 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-xs);
        min-width: 0;
      }
      .rc-s {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .rc-s .muted {
        font-size: var(--text-2xs);
      }
      .morph {
        animation: morph 2.4s ease-out;
      }
      @keyframes morph {
        0% {
          background: color-mix(in srgb, var(--ai-action-accent) 34%, transparent);
          color: var(--foreground);
          filter: blur(1.5px);
        }
        18% {
          filter: blur(0);
        }
        100% {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .morph {
          animation: none;
        }
      }

      /* Task cards in the grouped list (two lines: facts, then latest progress) */
      .list {
        border-radius: 10px;
        overflow: visible;
      }
      .list > .lgrp:first-child {
        border-radius: 10px 10px 0 0;
      }
      .lgrp {
        cursor: pointer;
        height: 34px;
      }
      .lgrp .grule {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        font-weight: 400;
        margin-left: 4px;
      }
      .lgrp.ngrp {
        cursor: default;
        background: color-mix(in srgb, var(--agent-question) 6%, transparent);
      }
      .nsub {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 12px 0 36px;
        font-size: var(--text-2xs);
        font-weight: 500;
        color: var(--muted-foreground);
        border-bottom: 1px solid var(--border);
        background: rgb(255 255 255 / 0.012);
      }
      .trow {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        min-height: 54px;
        padding: 7px 12px 7px 8px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        min-width: 0;
      }
      .trow:hover {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .trow.hl {
        background: var(--row-selected);
        box-shadow: inset 2px 0 0 var(--foreground);
      }
      .trow.fresh {
        animation: rowin 0.9s ease-out;
      }
      @keyframes rowin {
        from {
          background: color-mix(in srgb, var(--status-success) 14%, transparent);
        }
        to {
          background: transparent;
        }
      }
      .list > .trow:last-child {
        border-bottom: 0;
      }
      .tr-1 {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        height: 20px;
      }
      .tr-1 .tt {
        font-size: var(--text-sm);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 0 1 auto;
        border-radius: 4px;
        padding: 0 2px;
        margin: 0 -2px;
      }
      .tr-1 .pill {
        height: 17px;
      }
      .exp {
        width: 16px;
        height: 16px;
        display: inline-grid;
        place-items: center;
        border-radius: 4px;
        color: var(--muted-foreground);
        flex: none;
      }
      button.exp:hover {
        background: rgb(255 255 255 / 0.08);
        color: var(--foreground);
      }
      .kidn {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        flex: none;
      }
      .subof {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        flex: none;
      }
      .c-ws {
        width: 168px;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-xs);
        color: rgb(250 250 250 / 0.8);
        min-width: 0;
      }
      .c-ws.muted {
        color: var(--muted-foreground);
        font-size: var(--text-2xs);
      }
      .c-host {
        width: 104px;
        flex: none;
        display: inline-flex;
        align-items: center;
      }
      .c-sess {
        width: 132px;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        min-width: 0;
      }
      .c-sess .q {
        color: var(--agent-question-text);
      }
      .c-time {
        width: 60px;
        flex: none;
        text-align: right;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .tr-2 {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 20px;
        padding-left: 46px;
        font-size: var(--text-xs);
        color: rgb(250 250 250 / 0.72);
      }
      .ptag {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 16px;
        padding: 0 5px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.06);
        font-size: var(--text-3xs);
        font-weight: 500;
        color: var(--muted-foreground);
        flex: none;
      }
      .ptag.agent {
        color: rgb(250 250 250 / 0.75);
      }
      .ptag.orca {
        color: var(--ai-action-accent);
        background: color-mix(in srgb, var(--ai-action-accent) 12%, transparent);
      }
      .ptag.last {
        background: transparent;
        border: 1px dashed var(--input);
      }
      .ptag.off {
        color: var(--agent-unverifiable);
        background: color-mix(in srgb, var(--agent-unverifiable) 12%, transparent);
      }
      .ptext {
        flex: 0 1 auto;
      }
      .ptext b {
        font-weight: 500;
        color: rgb(250 250 250 / 0.85);
      }
      .pat {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .peek {
        opacity: 0;
      }
      .trow:hover .peek {
        opacity: 1;
      }
      .peek-off {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
        opacity: 0.8;
      }
      .nacts {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
      }
      .trow.nrow .tr-1 .tt {
        font-weight: 600;
      }
      .trow.sub {
        padding-left: 34px;
      }
      .trow.sub::before {
        content: '';
        position: absolute;
        left: 22px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: color-mix(in srgb, var(--foreground) 12%, transparent);
      }
      .trow.sub.last::before {
        bottom: auto;
        height: 17px;
      }
      .trow.sub::after {
        content: '';
        position: absolute;
        left: 22px;
        top: 17px;
        width: 30px;
        height: 1px;
        background: color-mix(in srgb, var(--foreground) 12%, transparent);
      }
      .trow.sub .tr-2 {
        padding-left: 46px;
      }
      .phc {
        display: none;
        position: absolute;
        left: 40px;
        top: 22px;
        width: 520px;
        padding: 10px 12px;
        z-index: 35;
        flex-direction: column;
        gap: 5px;
        font-size: var(--text-xs);
        color: var(--foreground);
      }
      .ptext:hover ~ .phc {
        display: flex;
      }
      .phc-h {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .phc-r {
        display: flex;
        gap: 10px;
        line-height: 1.55;
      }
      .phc-r .k {
        width: 64px;
        flex: none;
        color: var(--muted-foreground);
        font-size: var(--text-2xs);
        padding-top: 1px;
      }
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 40px;
        color: var(--muted-foreground);
        font-size: var(--text-xs);
      }
      .kb-hint {
        margin-top: 8px;
      }

      /* Board */
      .bstrip {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .bs-h {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        font-weight: 600;
        margin-right: 4px;
      }
      .bs-c {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        font-size: var(--text-sm);
        max-width: 360px;
        cursor: pointer;
      }
      .board {
        height: 100%;
      }
      .bcard {
        cursor: pointer;
        gap: 5px;
      }
      .bc-1 {
        gap: 5px;
        min-width: 0;
      }
      .bc-p {
        font-size: var(--text-xs);
        line-height: 1.5;
        color: rgb(250 250 250 / 0.72);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .bc-p b {
        font-weight: 500;
        color: var(--muted-foreground);
        font-size: var(--text-2xs);
      }
      .bc-p.off {
        color: var(--muted-foreground);
      }
      .bc-p.off .ic {
        color: var(--agent-unverifiable);
        vertical-align: -2px;
        margin-right: 3px;
      }
      .bc-3 {
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
        gap: 5px;
      }

      /* ---------- Detail ---------- */
      .crumb .cid {
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .lnk2 {
        cursor: pointer;
      }
      .dscroll {
        overflow-y: auto;
        padding: 18px 36px 24px;
        scrollbar-width: none;
      }
      .dscroll::-webkit-scrollbar {
        display: none;
      }
      .dinner {
        max-width: 780px;
        gap: 0;
      }
      .d-title {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .d-acts {
        display: flex;
        gap: 6px;
        flex: none;
        padding-top: 1px;
      }
      .d-acts .btn {
        height: 30px;
      }
      .dmeta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
        font-size: var(--text-2xs);
      }
      .schip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid var(--input);
        font-size: var(--text-xs);
        white-space: nowrap;
      }
      .goalc {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--ai-action-accent) 14%, transparent);
        color: var(--ai-action-accent);
        font-size: var(--text-2xs);
      }
      .ddesc {
        margin-top: 10px;
        font-size: var(--text-sm);
        color: rgb(250 250 250 / 0.72);
        line-height: 1.65;
      }
      .offban {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 12px;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, var(--agent-unverifiable) 35%, transparent);
        background: color-mix(in srgb, var(--agent-unverifiable) 8%, transparent);
        font-size: var(--text-xs);
        line-height: 1.6;
        color: rgb(250 250 250 / 0.85);
      }
      .offban .ic {
        color: var(--agent-unverifiable);
        margin-top: 2px;
      }
      .offban b {
        color: var(--agent-unverifiable);
        font-weight: 600;
      }
      .pcard {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        padding: 10px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pcard.orca {
        border-color: color-mix(in srgb, var(--ai-action-accent) 30%, transparent);
      }
      .pc-head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        font-size: var(--text-xs);
      }
      .pc-head b {
        font-weight: 600;
        font-size: var(--text-sm);
      }
      .pc-head .psrc {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted-foreground);
        font-size: var(--text-2xs);
        white-space: nowrap;
      }
      .pc-head .btn .cnt {
        margin-left: 2px;
      }
      .pc-rows {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .prow {
        display: flex;
        gap: 12px;
        font-size: var(--text-sm);
        line-height: 1.6;
      }
      .prow .k {
        width: 70px;
        flex: none;
        color: var(--muted-foreground);
        font-size: var(--text-xs);
        padding-top: 2px;
      }
      .prow .v {
        color: rgb(250 250 250 / 0.9);
      }
      .pc-empty {
        font-size: var(--text-xs);
        color: var(--muted-foreground);
        line-height: 1.6;
      }
      .pc-empty code,
      .sr-l code,
      .setrow code {
        font-family: var(--font-mono);
        font-size: var(--text-2xs);
        padding: 1px 5px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.07);
        color: var(--foreground);
      }
      .pc-off {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-2xs);
        color: var(--agent-unverifiable);
        padding-top: 6px;
        border-top: 1px dashed var(--border);
      }
      .pc-all {
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        padding-top: 6px;
      }
      .pa-i {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 5px 0;
        font-size: var(--text-xs);
        line-height: 1.55;
      }
      .pa-i.cur .pa-t {
        color: var(--foreground);
      }
      .pa-src {
        width: 92px;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted-foreground);
        font-size: var(--text-2xs);
        padding-top: 1px;
      }
      .pa-t {
        flex: 1 1 auto;
        color: rgb(250 250 250 / 0.72);
      }
      .pa-at {
        flex: none;
        font-size: var(--text-2xs);
        color: var(--muted-foreground);
      }
      .sec-h {
        margin-top: 20px;
      }
      .sec-h .opt-t {
        font-weight: 400;
        font-size: var(--text-2xs);
      }
      .sec-h .btn.xs {
        font-weight: 500;
        color: var(--foreground);
      }
      .slist {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .srow2 {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        padding: 0 10px 0 14px;
        border-bottom: 1px solid var(--border);
        font-size: var(--text-xs);
        cursor: pointer;
      }
      .srow2:last-child {
        border-bottom: 0;
      }
      .srow2:hover {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .srow2.ended {
        opacity: 0.6;
      }
      .srow2 b {
        font-weight: 500;
        font-size: var(--text-sm);
      }
      .srow2 > b,
      .srow2 > .muted,
      .srow2 > .sr-sub {
        flex: none;
        white-space: nowrap;
      }
      .srow2 .st {
        color: var(--muted-foreground);
        white-space: nowrap;
        flex: none;
      }
      .srow2 .st.q {
        color: var(--agent-question-text);
      }
      .sr-last {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted-foreground);
      }
      .sl-empty {
        padding: 12px;
        font-size: var(--text-xs);
        color: var(--muted-foreground);
      }
      .thumb i:nth-child(-n + 3) {
        background: color-mix(in srgb, var(--foreground) 35%, transparent);
      }
      .kids {
        border: 1px solid var(--border);
        border-radius: 8px;

      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 420px;
        z-index: 25;
        display: flex;
        flex-direction: column;
        background: var(--popover);
        border-left: 1px solid rgb(255 255 255 / 0.1);
        box-shadow: var(--shadow-lg);
        animation: drawerin 0.18s ease-out;
        transition: width 0.18s ease-out;
      }
      .drawer.wide {
        width: 62%;

      .main.pushed {
        padding-right: 420px;
      }
      .main.pushed .toast {
        left: calc((100% - 420px) / 2);
      }

      .main.pushed .c-time {
        display: none;

      .main.pushed .sfield {
        width: 28px;

          opacity: 0;

        to {
          transform: none;
          opacity: 1;
        }

          animation: none;
          transition: none;
        }

      /* Task mode: the task page's view column moved into the sidebar as it is, rows expandable. */
      .sb .views.sbviews {
        width: auto;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0;
        padding: 4px 8px 10px;
        border-right: 0;
      }
      .sb .views.sbviews .v-i {
        gap: 6px;
        padding-left: 4px;
        cursor: pointer;
      }
      .sb .views.sbviews .v-i .exp {
        width: 16px;
        height: 16px;
      }
      .sb .views.sbviews .v-sec {
        padding-left: 8px;
      }

      /* Each level steps in 20px, and a guide line runs down the parent's caret column. */
      .sb .views.sbviews .tn {
        position: relative;
        margin: 0;
        padding-left: calc(6px + var(--d) * 20px);
      }
      .sb .views.sbviews .tn::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(var(--d) * 20px - 8px);
        width: 1px;
        background: var(--border);
      }

      /* Task mode: the task view tab strip (概览 + this task's sessions). */
      .ttabs .wtab.dis {
        opacity: 0.55;
        cursor: not-allowed;
      }

          if (agent === 'claude') return br('claude', s)
          if (agent === 'codex') return br('openai', s, 'c-fg')
          if (agent === 'me')
            return `<span class="me-av" style="width:${s + 2}px;height:${s + 2}px">我</span>`
          return ''
        }
        function sFact(s) {
          if (s.state === 'ended') return 'exited'
          const h = hostOfWs(W(s.workspace))
          if (!h.connected || s.fact === 'unverifiable') return 'unverifiable'
          return 'live'
        }
        function sLabel(s) {
          if (sFact(s) === 'unverifiable') return '无法确认'
          return {
            working: '工作中',
            waiting: '等你回答',
            blocked: '被卡住',
            done: '做完一轮',
            starting: '会话已启动',
            ended: '已结束',
            unknown: '状态未知'
          }[s.state]
        }
        function sAst(s, size = 12) {
          if (sFact(s) === 'unverifiable') return ast('unverifiable', size)
          if (s.state === 'starting') return ast('working', size)
          return ast(s.state, size)
        }
        const sWhen = (s) =>
          s.state === 'working' && sFact(s) === 'live'
            ? ` · ${s.since}`
            : s.state === 'done'
              ? ` · ${s.lastAt}`
              : ''
        function prChip(pr, long = false) {
          if (!pr) return ''
          if (pr.state === 'merged')
            return `<span class="prc mg" title="${pr.note}">${ic('git-merge', 12)}#${pr.number}${long ? ' 已合并' : ''}</span>`
          if (pr.state === 'failed')
            return `<span class="prc fail" title="${pr.note}">${ic('git-pull-request', 12)}#${pr.number}${ic('circle-x', 11)}${long ? ' CI 失败' : ''}</span>`
          return `<span class="prc op" title="${pr.note}">${ic('git-pull-request', 12)}#${pr.number}${long ? ' 未合并' : ''}</span>`
        }
        const hostTag = (h, { off = true } = {}) =>
          `<span class="hostt ${h.connected ? '' : 'off'}">${ic(h.connected ? hostIc(h) : 'unplug', 12)}${h.name}${!h.connected && off ? ' 未连接' : ''}</span>`
        const wsChip = (w, { repo = false } = {}) => {
          const h = hostOfWs(w)
          return `<span class="wchip ${h.connected ? '' : 'off'}">${ic('git-branch', 12)}<span class="ell">${repo ? `${w.repo}/` : ''}${w.name}</span><span class="dotsep"></span>${ic(h.connected ? hostIc(h) : 'unplug', 12)}${h.name}${h.connected ? '' : ' 未连接'}</span>`
        }
        const tid = (t) => `<span class="tid" title="${t.id}">${t.id}</span>`
        function toast(text) {
          S.toast = { text, at: Date.now() }
          later(2600, () => {
            if (S.toast && Date.now() - S.toast.at >= 2500) S.toast = null
          })
        }

        // ---------- needs-you + progress ----------
        function needsYou() {
          const out = []
          for (const t of S.tasks) {
            if (t.parent || S.snoozed[t.id]) continue
            const fam = familySessions(t)
            const waiting = fam.find((s) => s.state === 'waiting' && sFact(s) === 'live')
            if (waiting) {
              out.push({ task: t, kind: 'answer', session: waiting })
              continue
            }
            if (t.status === 'review') {
              out.push({ task: t, kind: 'review', session: latestSession(t) })
              continue
            }
            const unread = fam.find(
              (s) => s.state === 'done' && S.unread[s.id] && sFact(s) === 'live'
            )
            if (unread) out.push({ task: t, kind: 'turn', session: unread })
          }
          return out
        }
        const joinProgress = (p) =>
          [
            p.did,
            p.check ? `自检：${p.check}` : '',
            p.result,
            p.next ? `下一步：${p.next}` : '',
            p.need
          ]
            .filter(Boolean)
            .join('')
        function progressInfo(t) {
          const w = wsOfTask(t)
          const h = w && hostOfWs(w)
          const p = t.progress[0]
          const s = liveSessions(t)[0] || familySessions(t)[0]
          let r
          if (p)
            r = {
              kind: p.source === 'orca' ? 'orca' : 'agent',
              tag: p.source === 'orca' ? 'Orca 生成' : '回写',
              text: joinProgress(p),
              at: p.at
            }
          else if (s && s.state === 'starting')
            r = { kind: 'start', tag: '', text: '会话已启动 · 等第一条回写', at: s.lastAt }
          else if (s && s.last) r = { kind: 'last', tag: '最后一句话', text: s.last, at: s.lastAt }
          else if (s) r = { kind: 'state', tag: '', text: `${sLabel(s)}${sWhen(s)}`, at: '' }
          else
            r = {
              kind: 'none',
              tag: '',
              text: w ? '还没有会话' : `还没有工作区和会话 · ${t.createdBy}`,
              at: ''
            }
          if (h && !h.connected) r.offline = h
          return r
        }

        // ---------- window chrome ----------
        function statusbar() {
          return `<div class="stbar">
      <span class="sbs">${br('claude', 12)}<span class="meter"><i style="width:78%"></i></span>78% 5h · 94% 周</span>
      <span class="sbs">${br('openai', 12, 'c-fg')}<span class="meter"><i style="width:64%"></i></span>64% 5h · 80% 周</span>
      <span class="fill"></span>
      ${D.hosts.map((h) => `<span class="sbs ${h.connected ? '' : 'off'}">${ic(h.connected ? hostIc(h) : 'unplug', 12)}${h.name}${h.connected ? '<i class="dot ok"></i>' : ' 未连接'}</span>`).join('')}
    </div>`
        }
        const sbTop = () =>
          `<div class="sb-top"><div class="lights"><i></i><i></i><i></i></div><span class="app">Orca</span>${ic('panel-left', 16, 'c-mute')}<span class="fill"></span>${ic('arrow-left', 14, 'c-mute')}${ic('arrow-right', 14, 'c-mute')}</div>`
        const sbFoot = () =>
          `<div class="sb-foot"><button class="icon-btn" data-act="settings" title="设置">${ic('settings', 16)}</button><button class="icon-btn" title="帮助">${ic('circle-alert', 16)}</button><span class="fill"></span><button class="icon-btn" title="资源">${ic('activity', 16)}</button></div>`
        function wsRow(w) {
          const t = w.task ? T(w.task) : null
          const sess = S.sessions.filter((s) => s.workspace === w.id && s.state !== 'ended')
          const h = hostOfWs(w)
          let lead = `<span class="ast" style="width:12px;height:12px"><span class="wdot ${sess.length && h.connected ? 'on' : ''}"></span></span>`
          const waiting = sess.find((s) => s.state === 'waiting')
          if (!h.connected && sess.length) lead = ast('unverifiable', 12)
          else if (waiting) lead = ast('waiting', 12)
          const on = S.view === 'detail' && t && (S.detail === t.id || T(S.detail)?.parent === t.id)
          const strip = sess.length
            ? `<div class="wsr-s" ${h.connected ? `data-act="open-session" data-sid="${sess[0].id}"` : ''}>${sess.map((s) => `<span class="pair">${sAst(s, 11)}${av(s.agent, 11)}</span>`).join('')}<span class="lbl2">${sess.length === 1 ? sLabel(sess[0]) : `${sess.length} 个会话`}</span>${ic('chevron-right', 12, 'c-mute')}</div>`
            : ''
          return `<div class="wsr ${on ? 'on' : ''}">
      <div class="wsr-1">${lead}<span class="wsr-n">${w.name}</span>${w.primary ? '<span class="tagp">主要</span>' : ''}${t ? `<span class="tchip" data-act="open" data-id="${t.id}" title="${t.id} ${esc(t.title)}">${ic('list-todo', 11)}<span>${esc(t.title)}</span></span>` : ''}</div>
      <div class="wsr-2"><span class="ell">${w.branch}</span>${w.pr ? prChip(w.pr) : ''}</div>
      ${strip}
    </div>`
        }
        function sidebar(active) {
          const n = needsYou().length
          const nav = (key, icon, label, extra = '', act = '') =>
            `<div class="nav-i ${key === active ? 'on' : ''} ${key === 'search' ? 'search' : ''}" ${act}>${ic(icon, 16)}<span>${label}</span>${extra}</div>`
          const groups = S.repos
            .map((r) => {
              const h = H(r.host)

            })
            .join('')
          const tasksMode = S.sidebar === 'tasks'

          const modeBtn = `<button class="icon-btn ${tasksMode ? 'on' : ''}" data-act="sbmode" data-v="${tasksMode ? 'workspace' : 'tasks'}" title="${tasksMode ? '切回工作区' : '按任务显示'}">${ic('list-todo', 14)}</button>`
          const body = tasksMode

            : `<div class="ws-h">项目<span class="tools">${modeBtn}<button class="icon-btn">${ic('bell', 14)}</button><button class="icon-btn">${ic('sliders-horizontal', 14)}</button><button class="icon-btn">${ic('folder-open', 14)}</button><button class="icon-btn">${ic('plus', 14)}</button></span></div>
      <div class="sb-list" id="sbscroll">${groups}</div>`

        }

        // ---------- sidebar task mode: needs-you, status views, project → task → workspace → session ----------
        const STATUS_ORDER = ['doing', 'review', 'todo', 'backlog', 'done', 'canceled']
        const byStatus = (a, b) =>

        const caret = (key, extra = '') =>
          `<button class="exp" data-act="tree" data-k="${key}" ${extra}>${ic(S.tree[key] ? 'chevron-down' : 'chevron-right', 12)}</button>`
        // Task mode is about tasks: a session hangs straight off its task; the workspace only shows in the hover card and the detail.
        function treeSessionRow(s, depth, { loose = false } = {}) {
          const w = W(s.workspace)
          const h = hostOfWs(w)
          const off = !h.connected
          const on = S.view === 'session' && S.session === s.id
          // Deeper rows (a subtask's session) have less width, so they drop the time.
          const label = `${sLabel(s)}${depth > 1 || off ? '' : s.state === 'working' ? ` ${s.since}` : s.state === 'done' ? ` · ${s.lastAt}` : ''}`
          const last = s.state === 'starting' ? '等第一条回写' : s.last || ''
          // In task mode a session row opens its task's overview plus the quick-view drawer (data-from="tree").
          return `<div class="tn ts ${on ? 'on' : ''} ${off ? 'dis' : ''} ${loose ? 'loose' : ''}" style="--d:${depth}" data-sid="${s.id}" ${off ? `title="${h.name} 未连接，不能打开会话"` : `data-act="open-session" data-from="tree"`}>
      <div class="ts-1"><span class="exp"></span>${sAst(s, 12)}${av(s.agent, 12)}<span class="tn-n">${AG[s.agent]}</span>${loose ? `<span class="tn-s">· ${w.name} · ${h.name}</span>` : ''}<span class="tn-s ${s.state === 'waiting' && !off ? 'q' : ''}">${loose ? '· ' : ''}${label}</span>${off ? `<span class="tn-off">${h.name} 未连接</span>` : ''}${loose ? `<span class="fill"></span><button class="btn xs tu-act" data-act="as-task-session" data-sid="${s.id}">${ic('plus', 11)}记成任务…</button>` : ''}</div>
      ${last ? `<div class="ts-2">${esc(last)}</div>` : ''}
    </div>`
        }
        // A parent task's card and hover card carry one line about its subtasks (S9): count, session states, latest progress.
        function kidsSummary(t) {
          const kids = t.children.map(T).filter(Boolean)
          if (!kids.length) return null
          const ss = kids.flatMap((k) => sessionsOf(k.id)).filter((s) => s.state !== 'ended')
          let st
          if (!ss.length) st = '还没有会话'
          else if (ss.every((s) => s.state === 'done')) st = '都做完一轮'
          else {
            const n = (pred, label) => {
              const c = ss.filter(pred).length
              return c ? `${c} 个${label}` : ''
            }
            st = [
              n((s) => s.state === 'working' || s.state === 'starting', '工作中'),
              n((s) => s.state === 'waiting', '等你回答'),
              n((s) => s.state === 'done', '做完一轮')
            ]
              .filter(Boolean)
              .join('、')
          }
          const latest = [...kids].sort((a, b) => (S.fresh[b.id] || 0) - (S.fresh[a.id] || 0))[0]
          const lastKid = S.fresh[latest.id] ? latest : kids[kids.length - 1]
          return { n: kids.length, st, kid: lastKid, text: progressInfo(lastKid).text }
        }
        const kidsLine = (t) => {
          const k = kidsSummary(t)
          return k
            ? `<div class="tr-3">${ic('corner-down-right', 11)}子任务 ${k.n} · ${k.st} · 最新：<span class="tid">${k.kid.id}</span><span class="ell">${esc(k.text)}</span></div>`
            : ''
        }
        // A task row; in 需要你 it carries the reason and clicking goes to whatever needs you (the quick view or the acceptance).
        function treeTaskNode(t, depth, need = null) {
          const key = `t-${t.id}`
          const sess = sessionsOf(t.id)
          const kids = t.children.map(T).filter(Boolean)
          const w = wsOfTask(t)
          const h = w && hostOfWs(w)
          const off = h && !h.connected
          const expandable = sess.length || kids.length
          const live = liveSessions(t)
          const lead = live.find((s) => s.state === 'waiting') || live[0]
          const right = off ? ic('unplug', 12, 'c-unv') : lead ? sAst(lead, 12) : ''
          // The reason (needs-you) or the host warning gets its own small line so the title keeps the row's width.
          let note = ''
          if (need && need.kind === 'answer')
            note = `${av(need.session.agent, 11)}<span class="tn-q">${AG[need.session.agent]} 等你回答</span><span class="tn-s">· ${need.session.lastAt}</span>`
          else if (need && need.kind === 'review') {
            const pr = w && w.pr
            note = `<span class="tn-ok">待验收</span>${pr ? `<span class="tn-s">· PR #${pr.number} ${pr.state === 'merged' ? '已合并' : '未合并'}</span>` : ''}`
          } else if (need) note = '<span class="tn-s">做完一轮，你还没看</span>'
          else if (off)
            note = `<span class="tn-off">${ic('unplug', 11)}${h.name} 未连接</span><span class="tn-s">· 上次进展 ${progressInfo(t).at}</span>`
          // Opening from the tree lands on the session that waits on you, if any; otherwise on the overview.
          const act = `data-act="open" data-id="${t.id}" data-from="tree"`
          const on =
            (S.view === 'detail' && S.detail === t.id) ||
            (S.view === 'session' && SS(S.session)?.task === t.id)
          let html = `<div class="tn tt ${note ? 'two' : ''} ${on ? 'on' : ''}" style="--d:${depth}" ${act} data-tip="${t.id}">
      <div class="tt-1">${expandable ? caret(key) : '<span class="exp"></span>'}${stIcon(t, 13)}<span class="tn-t">${esc(t.title)}</span><span class="tid">${t.id}</span><span class="fill"></span>${right}</div>
      ${note ? `<div class="tt-2">${note}</div>` : ''}</div>`
          if (!S.tree[key]) return html
          html += sess.map((s) => treeSessionRow(s, depth + 1)).join('')
          html += kids.map((k) => treeTaskNode(k, depth + 1)).join('')
          return html
        }
        function projectMenu(where) {
          const n = (key) => S.tasks.filter((t) => key === 'all' || t.project === key).length
          const item = (key, label, extra = '') =>
            `<div class="mi ${S.filter.project === key ? 'on' : ''}" data-act="proj-set" data-p="${key}">${ic(key === 'all' ? 'layers' : 'folder-git-2', 14)}<span>${label}</span>${extra}<span class="sub">${n(key)}</span></div>`
          return `<div class="popover menu pmenu ${where}">${item('all', '全部项目')}<div class="msep"></div>${S.projects.map((p) => item(p.key, p.name, `<span class="pk">${p.key}</span>`)).join('')}</div>`
        }
        const projLabel = () => (S.filter.project === 'all' ? '全部项目' : P(S.filter.project).name)
        // Task mode: the task page's own view column, moved into the sidebar as it is; every row also
        // expands to its tasks, and a task to its sessions.
        function taskTree() {
          const f = S.filter
          const inScope = (t) => f.project === 'all' || t.project === f.project
          const tops = (pred) => S.tasks.filter((t) => !t.parent && pred(t)).sort(byFresh)
          const row = (key, icon, label, extra, n, act, on, kids, cls = '') => {
            const k = `v-${key}`
            return `<div class="v-i ${on ? 'on' : ''} ${cls}" ${act}>${kids.length ? caret(k) : '<span class="exp"></span>'}${icon}<span>${label}</span>${extra}<span class="n">${n}</span></div>${S.tree[k] ? kids.join('') : ''}`
          }
          const need = needsYou().filter((x) => inScope(x.task))
          const view = (key, icon, label, cls = '') => {
            const match = (t) => inScope(t) && (key === 'all' || t.status === key)
            const kids =
              key === 'need'
                ? need.map((x) => treeTaskNode(x.task, 1, x))
                : tops(match).map((t) => treeTaskNode(t, 1))
            const n = key === 'need' ? need.length : tops(match).length
            return row(
              key,
              icon,
              label,
              '',
              n,
              `data-act="view" data-v="${key}"`,
              f.view === key,
              kids,
              cls
            )
          }
          const proj = (key, label, extra) => {
            const match = (t) => key === 'all' || t.project === key
            const kids = tops(match).map((t) => treeTaskNode(t, 1))
            const n = tops(match).length
            return row(
              `p-${key}`,
              ic(key === 'all' ? 'layers' : 'folder-git-2', 14),
              label,
              extra,
              n,
              `data-act="scope" data-p="${key}"`,
              f.project === key,
              kids
            )
          }
          // Sessions in workspaces nobody linked to a task (I8): task mode must still show them, and this is where 记成任务 lives.
          const loose = S.sessions.filter(
            (s) =>
              !s.task &&
              s.state !== 'ended' &&
              (f.project === 'all' || R(W(s.workspace).repo).project === f.project)
          )
          const unlinked = row(
            'unlinked',
            ic('message-square', 14),
            '未关联任务的会话',
            '',
            loose.length,
            '',
            false,
            loose.map((s) => treeSessionRow(s, 1, { loose: true })),
            'v-loose'
          )
          return `<nav class="views sbviews">
      ${view('need', ic('bell', 14), '需要你', 'v-need')}
      ${view('all', ic('list-todo', 14), '全部')}
      ${view('doing', catIcon('started'), '进行中')}
      ${view('backlog', catIcon('backlog'), '待规划')}
      ${view('done', catIcon('completed'), '已完成')}
      ${view('canceled', catIcon('canceled'), '已取消')}
      <div class="v-sec">项目<button class="icon-btn" data-act="settings" title="项目设置">${ic('settings', 13)}</button></div>
      ${proj('all', '全部项目', '')}
      ${S.projects.map((p) => proj(p.key, p.name, `<span class="key">${p.key}</span>`)).join('')}
      <div class="v-sec">其他</div>
      ${unlinked}
    </nav>`
        }
        function treeTipHtml(id) {
          const t = T(id)
          if (!t) return ''
          const p = progressInfo(t)
          const w = wsOfTask(t)
          const s = liveSessions(t)[0]
          const src =
            p.kind === 'agent'
              ? `${av(t.progress[0].agent, 12)}${AG[t.progress[0].agent]} 回写 #${t.progress[0].n}`
              : p.kind === 'orca'
                ? `${ic('sparkles', 12)}Orca 生成`
                : p.tag || '进展'
          return `<div class="ttip-h">${stIcon(t, 13)}<b>${esc(t.title)}</b><span class="tid">${t.id}</span></div>
      <div class="ttip-m">${STATUS[t.status].name}</div>
      <div class="ttip-w">${ic('folder-git-2', 11)}${w ? `在 ${w.name} · ${hostOfWs(w).name}${hostOfWs(w).connected ? '' : ' 未连接'}` : '还没有工作区'}</div>
      <div class="ttip-l">最新进展<span class="muted">${src}${p.at ? ` · ${p.at}` : ''}</span></div>
      <div class="ttip-t">${esc(p.text)}</div>
      ${p.offline ? `<div class="ttip-off">${ic('unplug', 12)}${p.offline.name} 未连接，这是断开前最后读到的内容</div>` : ''}
      ${s && !p.offline ? `<div class="ttip-s">${sAst(s, 12)}${av(s.agent, 12)}${AG[s.agent]} ${sLabel(s)}${s.state === 'working' ? ` · ${s.since}` : ''}</div>` : ''}
      ${kidsLine(t)}`
        }
        const titlebar = () =>
          `<div class="titlebar"><span class="fill"></span><button class="icon-btn">${ic('panel-right', 16)}</button></div>`

        // ---------- task page chrome ----------
        function sourceBar() {
          return `<div class="srcbar">
      <button class="close" title="关闭任务页，回到工作区">${ic('x', 16)}</button>
      <span class="sep-v" style="margin:0 4px"></span>

        }
        const VIEW_NAME = {
          need: '需要你',
          all: '全部',
          doing: '进行中',
          review: '待验收',
          todo: '未开始',
          backlog: '待规划',
          done: '已完成',

        }
        function viewsCol() {
          const f = S.filter
          const inScope = S.tasks.filter(
            (t) => !t.parent && (f.project === 'all' || t.project === f.project)

        // ---------- dispatch box (home + chat share it) ----------
        // Path A's forks (review §3 F8): @workspace / @repo / @task are rules, never a model call. 只问 always goes to the scheduler.
        function routeOf(d) {
          const text = d.text.replace(/@\S*$/, '').trim()
          if (d.mode === 'ask') return { kind: 'ask', chips: d.chips }
          if (!d.chips.length) return { kind: text ? 'B' : 'idle' }
          if (d.chips.length > 1) return { kind: 'B', why: '提及了多个对象' }
          const c = d.chips[0]
          if (c.type === 'ws') return routeForWorkspace(W(c.id), false)
          if (c.type === 'repo')
            return R(c.id).project
              ? { kind: 'repo', repo: c.id }
              : { kind: 'repo', repo: c.id, noProject: true }
          const t = T(c.id)
          const w = wsOfTask(t)

          return {
            kind: 'A2',

        }
        function routeHint(route) {

            }
            case 'A1': {
              const w = W(route.ws)
              return route.noProject
                ? `${kb('↵')}仓库 ${w.repo} 还没有项目，先建项目，再在 ${w.name} 建任务`

              return `${kb('↵')}${w.name} 属于 ${route.owner}，会建成它的子任务${busy ? `；${AG[busy.agent]} 还在工作中，另开一个会话` : ''}`

        function dispatchBox(where) {

        // ---------- @ mention popover ----------
        const WS_ORDER = [
          'orca/docs-typo',
          'orca/feat-reconnect',
          'orca/perf-startup',
          'tools/scripts-cleanup',
          'orca/feat-x',
          'shop/refund-webhook',

          'orca/main',

        // @主机 only narrows the list to that host's repositories and workspaces (I1); it never becomes a chip.
        function mentionGroups(query, hostFilter) {
          const q = query.trim().toLowerCase()
          const hit = (...xs) => !q || xs.some((x) => x && String(x).toLowerCase().includes(q))
          const onHost = (h) => !hostFilter || h.id === hostFilter
          const groups = []
          const wsAll = [
            ...WS_ORDER.map(W).filter(Boolean),
            ...S.workspaces.filter((w) => !WS_ORDER.includes(w.id))
          ].filter(
            (w) =>
              onHost(hostOfWs(w)) &&
              hit(w.name, w.repo, w.task, w.task && T(w.task) && T(w.task).title)
          )
          const wsItems = wsAll.map((w) => {
            const h = hostOfWs(w)
            const owner = w.task ? T(w.task) : null
            const idle = owner && idleSessionIn(w.id)
            let right = '空闲'
            if (owner) right = `属于 ${owner.id}${idle ? ` · ${AG[idle.agent]} 做完一轮` : ''}`
            else if (w.pr)
              right = `PR #${w.pr.number} ${w.pr.state === 'failed' ? 'CI 失败' : '未合并'}`
            else if (!R(w.repo).project) right = '仓库还没有项目'
            return {
              type: 'ws',
              id: w.id,
              icon: ic('git-branch', 14),
              name: w.name,
              sub: `${w.repo} · ${h.name}`,
              right,
              owner: !!owner,
              dis: !h.connected,
              why: `${h.name} 未连接`
            }
          })
          const limit = hostFilter ? 12 : q ? 8 : 7
          groups.push({
            name: '工作区',
            items: wsItems.slice(0, limit),
            more: wsItems.length - Math.min(limit, wsItems.length)
          })
          const repoItems = S.repos
            .filter((r) => onHost(H(r.host)) && hit(r.id))
            .map((r) => {
              const h = H(r.host)
              return {
                type: 'repo',
                id: r.id,
                icon: ic('folder', 14),
                name: r.id,
                sub: h.kind === 'local' ? '本机' : `${h.kindName} ${h.name}`,
                right: r.project ? '新建工作区来做' : '还没有项目 · 派活时先建',
                dis: !h.connected,
                why: `${h.name} 未连接`
              }

          groups.push({ name: '仓库', items: repoItems, more: 0 })
          if (hostFilter) return groups.filter((g) => g.items.length)
          const taskItems = S.tasks
            .filter(
              (t) =>

            .map((t) => {

                why: h ? `${h.name} 未连接` : ''

          const hostItems = D.hosts
            .filter((h) => hit(h.name, h.full, h.kindName))
            .map((h) => ({
              type: 'host',
              id: h.id,

              name: h.full,

        }
        function mentionPopover() {
          const host = S.dispatch[S.pop.where].host
          const groups = mentionGroups(S.pop.query, host)
          const flat = groups.flatMap((g) => g.items)

        function refreshDispatch(where) {

        // ---------- dispatch actions ----------
        // Only the scheduler names things (its proposals, 只建任务); path A keeps the first sentence as the title.
        function shortTitle(text) {

            .replace(/一下/g, '')
            .replace(/[，。,.!！？?].*$/, '')

        const rid = () => `r${Date.now()}${Math.random()}`

            ['\n'],

            ['\n'],

        }
        function createTask({
          project,

          ws,

        }) {

            labels: [],
            workspace: owner ? null : ws ? ws.id : null,

            description: description || (text === title ? '' : text),
            progress: [],
            timeline: []
          }

          if (ws && agent !== 'none') {

              id: sid,

        // Types a line at the terminal's prompt: the idle prompt (`> `) is replaced, then the agent starts thinking.

                ? '<span class="pill ok">待验收</span>'
                : '<span class="pill">做完一轮</span>'
          let l2
          let acts
          if (n.kind === 'answer') {
            // 速览 opens the narrow drawer with the cursor already in the chat composer; the answer is given there.
            l2 = `${av(s.agent, 12)}<span class="ptext ell"><b>${AG[s.agent]} 问：</b>${esc(s.last)}</span><span class="pat">· ${s.lastAt}</span>`
            acts = `<button class="btn sm" data-act="peek" data-sid="${s.id}">${ic('eye', 13)}速览</button><button class="btn ghost sm" data-act="snooze" data-id="${t.id}">${ic('clock', 13)}稍后提醒</button>`
          } else if (n.kind === 'review') {
            const p = progressInfo(t)
            l2 = `<span class="ptag agent">回写</span><span class="ptext ell">${esc(p.text)}</span>`
            const sh = s && hostOfWs(W(s.workspace))
            const peek = !s

              : sh.connected
                ? `<button class="btn sm" data-act="peek" data-sid="${s.id}">${ic('eye', 13)}速览</button>`
                : `<span class="peek-off">${ic('eye', 12)}速览不可用 · ${sh.name} 未连接</span>`
            acts = `${w && w.pr ? prChip(w.pr, true) : ''}${peek}<button class="btn sm" data-act="open" data-id="${t.id}">${ic('check-check', 13)}去验收</button>`
          } else {
            l2 = `<span class="ptag last">最后一句话</span><span class="ptext ell">${esc(s.last)}</span>`
            acts = `<button class="btn sm" data-act="peek" data-sid="${s.id}">${ic('eye', 13)}速览</button><button class="btn ghost sm" data-act="seen" data-sid="${s.id}">${ic('check', 13)}标记已看</button>`

        function needSection() {
          const all = needsYou()

          if (!list.length) return { html: '', ids: [] }
          const waits = list.filter((n) => n.kind !== 'review')
          const reviews = list.filter((n) => n.kind === 'review')
          const sub = (name, items) =>
            items.length
              ? `<div class="nsub">${name}<span class="cnt">${items.length}</span></div>${items.map(needRow).join('')}`
              : ''
          const html = `<div class="lgrp ngrp">${ic('bell', 14, 'c-q')}<span>需要你</span><span class="cnt q">${list.length}</span><span class="grule">会话在等你回答、做完一轮还没看，或任务待你验收</span></div>
      ${sub('会话在等你', waits)}${sub('待验收', reviews)}`
          return { html, ids: list.map((n) => n.task.id) }
        }
        function listView() {
          const f = S.filter
          const need = needSection()
          const tops = visibleTops().filter((t) => f.view !== 'all' || !need.ids.includes(t.id))
          let html = f.view === 'all' || f.view === 'need' ? need.html : ''
          if (f.view !== 'need') {
            for (const [st, name, cat] of GROUPS) {
              if (f.view !== 'all' && f.view !== st) continue
              const items = tops.filter((t) => t.status === st).sort(byFresh)
              if (!items.length) continue
              const key = st
              const collapsed = S.collapsed[key]
              const hidden =
                st === 'doing' ? need.ids.filter((id) => T(id).status === 'doing').length : 0
              html += `<div class="lgrp ${collapsed ? 'collapsed' : ''}" data-act="collapse" data-g="${key}">${ic(collapsed ? 'chevron-right' : 'chevron-down', 14, 'c-mute')}${catIcon(cat)}<span>${name}</span><span class="cnt">${items.length}</span>${hidden ? `<span class="grule">另有 ${hidden} 个在「需要你」</span>` : ''}<span class="fill"></span>${ic('plus', 14, 'c-mute')}</div>`
              if (!collapsed) html += items.map((t) => taskRow(t)).join('')

          }
          if (!html)
            html = `<div class="empty">${ic('list-checks', 18, 'c-mute')}<span>这里没有任务</span></div>`
          return `<div class="list">${html}</div>`
        }

        // ---------- home: board ----------
        function boardCard(t) {
          const w = wsOfTask(t)

          return `<div class="bcard" data-act="open" data-id="${t.id}">

      <div class="bc-1">${tid(t)}${w ? `${ic('git-branch', 11)}<span class="ell">${w.name}</span>${hostTag(hostOfWs(w))}` : '<span>还没有工作区</span>'}</div>
      <div class="bc-p ${p.offline ? 'off' : ''}">${p.offline ? `${ic('unplug', 11)}${p.offline.name} 未连接 · 上次进展 ${p.at}：` : p.tag ? `<b>${p.tag}</b> ` : ''}${esc(p.text)}</div>
      ${s ? `<div class="bc-3">${sAst(s, 11)}${av(s.agent, 11)}<span>${sLabel(s)}</span><span class="fill"></span><span>${t.updated}</span></div>` : ''}
    </div>`
        }
        function boardView() {
          const need = needSection()
          const tops = visibleTops()
          const strip = need.ids.length
            ? `<div class="bstrip"><div class="bs-h">${ic('bell', 13, 'c-q')}需要你<span class="cnt q">${need.ids.length}</span></div>${needsYou()
                .filter((n) => need.ids.includes(n.task.id))
                .map(
                  (n) =>
                    `<div class="bs-c" data-act="open" data-id="${n.task.id}">${stIcon(n.task, 13)}<span class="ell">${esc(n.task.title)}</span>${tid(n.task)}<span class="pill ${n.kind === 'review' ? 'ok' : 'q'}">${n.kind === 'review' ? '待验收' : '等你回答'}</span></div>`
                )
                .join('')}</div>`
            : ''
          const cols = GROUPS.filter(([st]) => st !== 'backlog' && st !== 'canceled')

              return `<div class="col"><div class="col-h">${catIcon(cat)}<span>${name}</span><span class="cnt">${items.length}</span><button class="icon-btn">${ic('plus', 14)}</button></div>${items.length ? items.map(boardCard).join('') : `<div class="col-empty">拖到这里改为「${name}」</div>`}</div>`

        function keyHints() {
          return `<div class="kb-hint"><span>${kb('J', 'K')}移动</span><span>${kb('↵')}打开</span><span>${kb('Space')}预览</span><span>${kb('S')}状态</span><span>${kb('V')}列表 / 看板</span><span>${kb('F')}筛选</span><span>${kb('/')}搜索</span><span>${kb('C')}新建任务</span></div>`
        }
        function homeContent() {
          return `<div class="home">
      ${dispatchBox('home')}
      ${S.receipts.length ? `<div class="rcpts">${S.receipts.map(receiptHtml).join('')}</div>` : ''}
      ${toolbar()}
      <div class="home-scroll">${S.mode === 'list' ? listView() : boardView()}</div>
      ${S.mode === 'list' ? keyHints() : ''}
    </div>`
        }

        // ---------- detail ----------
        function statusChip(t) {
          return `<span class="schip ${S.menu === 'status' ? 'on' : ''}" data-act="status-menu" title="改状态">${stIcon(t, 13)}${STATUS[t.status].name}${ic('chevron-down', 11, 'c-mute')}</span>`
        }
        function statusMenu(t) {
          return `<div class="popover menu spop">${Object.keys(STATUS)
            .map(
              (k) =>
                `<div class="mi ${k === t.status ? 'on' : ''}" data-act="status-set" data-id="${t.id}" data-v="${k}">${catIcon(STATUS[k].cat, 13)}<span>${STATUS[k].name}</span>${k === t.status ? ic('check', 13) : ''}</div>`
            )
            .join('')}</div>`
        }
        // One line: workspace · host · diff · PR; only what exists. Click opens 打开工作区 / 查看更改.
        function wsLine(t) {
          const w = wsOfTask(t)
          if (!w)
            return `<div class="wsline"><span class="wl-i muted">${ic('git-branch', 12)}还没有工作区</span></div>`
          const h = hostOfWs(w)
          const parts = [
            `<span class="wl-i">${ic('git-branch', 12)}<b>${w.name}</b></span>`,
            `<span class="wl-i ${h.connected ? '' : 'off'}">${ic(h.connected ? hostIc(h) : 'unplug', 12)}${h.name}${h.connected ? '' : ' 未连接'}</span>`,
            w.diff
              ? `<span class="wl-i">${w.diff.files} 文件 <span class="add">+${w.diff.add}</span> <span class="del">−${w.diff.del}</span></span>`
              : '',
            w.pr ? `<span class="wl-i">${prChip(w.pr, true)}</span>` : ''
          ].filter(Boolean)
          const item = (icon, label, msg) =>
            h.connected
              ? `<div class="mi" data-act="toast" data-msg="${msg}">${ic(icon, 14)}<span>${label}</span></div>`
              : `<div class="mi dis">${ic(icon, 14)}<span>${label}</span></div>`
          const pop =
            S.menu === 'ws'
              ? `<div class="popover menu wspop"><div class="mh"><b>${ic('git-branch', 13)}${w.repo}/${w.name}</b><span class="muted">分支 ${w.branch} · ${h.full}</span></div>${item('external-link', '打开工作区', '打开工作区：切到工作区视图')}${item('file-diff', '查看更改', '查看更改：打开 diff 面板')}${h.connected ? '' : `<div class="mnote">${ic('unplug', 12)}${h.name} 未连接，恢复联系后才能打开</div>`}</div>`
              : ''
          return `<div class="wsline"><span class="wl ${S.menu === 'ws' ? 'on' : ''}" data-act="ws-menu" title="工作区">${parts.join('<span class="wl-sep">·</span>')}</span>${t.parent ? '<span class="muted sm2">用上级的工作区</span>' : ''}${pop}</div>`
        }
        // One primary button, by status: no workspace → 开始做; workspace and not 待验收 → 开会话; 待验收 → 验收; done / canceled → none.
        function primaryAction(t) {
          const w = wsOfTask(t)
          const h = w && hostOfWs(w)
          if (t.status === 'done' || t.status === 'canceled') return ''
          if (!w)
            return `<button class="btn primary" data-act="start-work" data-id="${t.id}">${ic('play', 14)}开始做</button>`
          if (t.status === 'review')
            return `<button class="btn primary" data-act="accept-open" data-id="${t.id}">${ic('check-check', 14)}验收</button>`
          if (!h.connected)
            return `<span class="peek-off">${ic('unplug', 12)}开会话不可用 · ${h.name} 未连接</span><button class="btn primary" disabled data-act="new-session">${ic('bot', 14)}开会话</button>`
          return `<button class="btn primary" data-act="new-session" data-id="${t.id}">${ic('bot', 14)}开会话</button>`
        }
        // The 「现在」 card: acceptance bar (待验收), what is waiting on you, the latest write-back, then one line per session.
        function nowCard(t) {
          const p = t.progress[0]
          const w = wsOfTask(t)
          const h = w && hostOfWs(w)
          const off = h && !h.connected
          const fam = familySessions(t)
          const waiting = fam.find((x) => x.state === 'waiting' && sFact(x) === 'live')
          const accept = acceptBar(t)
          const waitRow = waiting
            ? `<div class="pc-wait">${ic('message-circle-question', 15, 'c-q')}<div class="pw-b"><b>${AG[waiting.agent]} 在等你回答：</b>${esc(waiting.last)}</div><span class="pw-acts"><button class="btn sm" data-act="peek" data-sid="${waiting.id}">${ic('eye', 13)}速览</button></span></div>`
            : ''
          const hasContent = fam.some(
            (s) => (S.terminals[s.id] || []).length || (S.chats[s.id] || []).length || s.last
          )
          let latest = ''
          if (p || hasContent) {
            const summ = S.summary[t.id]
            const src = !p
              ? '<span class="muted">还没有回写</span>'
              : p.source === 'orca'
                ? `${ic('sparkles', 12)}Orca 生成 · 读了 ${fam.length} 个会话的记录 · ${p.at}`
                : `${av(p.agent, 12)}${AG[p.agent]} 回写 #${p.n} · ${p.at}${off ? ' · 上次读到' : ''}`
            // 需要你什么 is left out while the acceptance bar is up: it already says where to verify.
            const rows = !p
              ? []
              : (p.source === 'orca'
                  ? [['摘要', p.did]]
                  : [
                      ['做了什么', p.did],
                      ['自检', p.check],
                      ['结论', p.result],
                      ['下一步', p.next],
                      ['需要你什么', accept ? '' : p.need]
                    ]
                ).filter(([, v]) => v)
            const allBtn = t.progress.length
              ? `<button class="btn ghost sm" data-act="prog-all" data-id="${t.id}">${ic('history', 13)}全部进展<span class="cnt">${t.progress.length}</span></button>`
              : ''
            const sumBtn = !hasContent
              ? ''
              : off
                ? `<button class="btn ghost sm" disabled title="要读 ${h.name} 上的会话记录">${ic('sparkles', 13)}生成摘要</button>`
                : `<button class="btn ghost sm" data-act="summarize" data-id="${t.id}" ${summ === 'loading' ? 'disabled' : ''}>${summ === 'loading' ? `${ic('loader-circle', 13, 'spin-ic')}生成中…` : `${ic('sparkles', 13)}生成摘要`}</button>`
            const list =
              S.progressAll[t.id] && t.progress.length
                ? `<div class="pc-all">${t.progress
                    .map(
                      (x, i) =>
                        `<div class="pa-i ${i === 0 ? 'cur' : ''}"><span class="pa-src">${x.source === 'orca' ? `${ic('sparkles', 12)}Orca 生成` : `${av(x.agent, 12)}回写 #${x.n}`}</span><span class="pa-t">${esc(joinProgress(x))}</span><span class="pa-at">${x.at}</span></div>`
                    )
                    .join('')}</div>`
                : ''
            latest = `<div class="pc-latest"><div class="pc-head">${ic('activity', 14, 'c-mute')}<b>最新进展</b><span class="psrc">${src}</span><span class="fill"></span>${allBtn}${sumBtn}</div>${rows.length ? `<div class="pc-rows">${rows.map(([k, v]) => `<div class="prow"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>` : ''}${list}</div>`
          }
          const offNote =
            off && p
              ? `<div class="pc-off">${ic('unplug', 13)}<span>${h.name} 未连接，${h.lostAt}断开。这是断开前最后读到的内容；恢复联系后 Orca 会重读一次。</span></div>`
              : ''
          const rows = fam
            .map((s) => {
              const owner = T(s.task)
              const peek = off
                ? `<span class="peek-off">${ic('eye', 12)}速览不可用 · ${h.name} 未连接</span>`
                : `<button class="btn ghost xs" data-act="peek" data-sid="${s.id}">${ic('eye', 12)}速览</button>`
              const sub =
                owner.id !== t.id
                  ? `<span class="sr-sub" data-act="open" data-id="${owner.id}" title="${owner.id}">${ic('corner-down-right', 11)}${esc(owner.title)}</span>`
                  : ''
              const last =
                s === waiting ? '' : s.state === 'starting' ? '等第一条回写' : s.last || ''
              return `<div class="srow2 ${s.state === 'ended' ? 'ended' : ''}" ${off ? '' : `data-act="peek" data-sid="${s.id}"`}>${sAst(s, 13)}${av(s.agent, 14)}<b>${AG[s.agent]}</b><span class="muted">${s.view === 'chat' ? '聊天' : '终端'}</span>${sub}<span class="st ${s.state === 'waiting' && !off ? 'q' : ''}">${sLabel(s)}${sWhen(s)}${off ? ` · ${h.lostAt}断开` : ''}</span><span class="sr-last" title="${esc(last)}">${esc(last)}</span>${peek}</div>`
            })
            .join('')
          const body =
            !fam.length && !p
              ? `<div class="sl-empty">${rows ? '' : '还没有会话'}</div>`
              : `${waitRow}${latest}${offNote}${rows ? `<div class="slist">${rows}</div>` : ''}`
          return `<div class="pcard now ${p && p.source === 'orca' ? 'orca' : ''} ${waiting ? 'waiting' : ''}"><div class="now-h">${ic('circle-dot', 12)}现在</div>${accept}${body}</div>`

        function descSect(t) {
          return t.description ? `<p class="ddesc">${esc(t.description)}</p>` : ''
        }
        function subtasksSect(t) {
          const kids = t.children.map(T).filter(Boolean)

            const s = liveSessions(k)[0]
            return `<div class="kid" data-act="open" data-id="${k.id}">${stIcon(k)}<span class="ell">${esc(k.title)}</span>${tid(k)}<span class="fill"></span>${s ? `${sAst(s, 12)}${av(s.agent, 12)}<span class="muted">${sLabel(s)}</span>` : ''}</div>`

        }
        const BY_CLASS = {
          对话: 'by-chat',
          Orca: 'by-orca',
          规则: 'by-rule',
          智能体: 'by-agent',
          你: 'by-you',
          手机: 'by-you'
        }
        function tlIcon(e) {
          switch (e.kind) {
            case 'dispatch':
              return ic('messages-square', 13)
            case 'session':
              return av(e.agent, 13)
            case 'progress':
              return av(e.agent, 13)
            case 'rule':
              return ic('zap', 13)
            case 'comment':
              return av('me', 12)
            case 'pr':
              return ic('git-pull-request', 13)
            case 'accept':
              return ic('check-check', 13)
            case 'reject':
              return ic('undo-2', 13)
            case 'offline':
              return ic('unplug', 13)
            case 'workspace':
              return ic('folder-git-2', 13)
            case 'title':
              return ic('sparkles', 13)
            case 'goal':
              return ic('target', 13)
            case 'link':
            case 'astask':
              return ic('corner-down-right', 13)
            default:
              return ic('circle-dot', 13)
          }
        }
        // 动态 shows your comments, write-backs, dispatches, accept / send-back and 记成任务; everything else folds into 系统记录.
        const SHOWN_KINDS = new Set([
          'comment',
          'progress',
          'dispatch',
          'accept',
          'reject',
          'astask'
        ])
        const isSys = (e) => !SHOWN_KINDS.has(e.kind)
        function timelineSect(t) {
          const open = S.sysOpen[t.id]
          const sys = t.timeline.filter(isSys)
          const items = t.timeline
            .filter((e) => open || !isSys(e))
            .map((e) => {
              if (e.kind === 'comment') {
                return `<div class="tlc"><div class="tlc-h">${av('me', 14)}<b>你</b><span class="by by-you">评论</span><span class="tl-at">${e.at}</span></div><div class="tlc-t">${esc(e.text)}</div></div>`
              }
              let text = esc(e.text)
              if (e.kind === 'progress') text = `回写 #${e.n}：${esc(e.text)}`

                e.kind === 'dispatch'
                  ? `<button class="lnk" data-act="goto-chat">${ic('arrow-up-right', 11)}回到那段对话</button>`
                  : ''
              return `<div class="tli ${e.kind === 'progress' ? 'prog' : ''} ${isSys(e) ? 'sys' : ''}"><span class="tl-ic">${tlIcon(e)}</span><div class="tl-b"><span class="by ${BY_CLASS[e.by] || ''}">${e.by}</span>${text}${quote}${e.note ? `<span class="tl-note">· ${esc(e.note)}</span>` : ''}${link}</div><span class="tl-at">${e.at}</span></div>`
            })
            .join('')
          const sysRow = sys.length
            ? `<div class="sysrow" data-act="sys-toggle" data-id="${t.id}">${ic(open ? 'chevron-down' : 'chevron-right', 12)}系统记录<span class="cnt">${sys.length}</span><span class="muted">${open ? '收起' : '展开'}</span></div>`

          return `<div class="sec-h">动态</div>

      <div class="dates2">创建于 ${t.created} · ${t.createdBy} · 更新于 ${t.updated}</div>`
        }
        function acceptBar(t) {
          const res = S.accept.result[t.id]
          if (res) {
            const ok = res.kind === 'approved'
            return `<div class="abar done ${ok ? 'ok' : 'back'}">${ok ? catIcon('completed') : ic('undo-2', 14)}<b>${ok ? '已通过' : '已打回'}</b><span class="muted">${ok ? '待验收 → 已完成 · 你 · 刚刚' : `待验收 → 进行中 · ${res.sent ? `原因已发给 ${res.sent} <span class="okt">${ic('check-check', 12)}已送达</span>` : '用原因开了一个新的 Claude 会话'}`}</span></div>`
          }
          const isReview = t.status === 'review'
          if (!isReview && S.accept.open !== t.id) return ''
          const w = wsOfTask(t)
          const where =
            w && w.pr && w.pr.state === 'merged'
              ? `${ic('git-merge', 13, 'c-mg')}<b>PR #${w.pr.number} 已合并</b><span class="muted">${w.branch} → main · ${w.repo} · ${hostOfWs(w).name}</span>`
              : `${ic('git-branch', 13, 'c-mute')}<span class="muted">还没有 PR · ${w ? `${w.name} 有 ${w.diff ? w.diff.files : 0} 个文件改动未提交` : '没有工作区'}</span>`
          const diff =

          // Asking a session something while accepting sends it back to work; the task stays 待验收.

        // The … menu: 设为目标 greys out without a terminal session to guard; cancel keeps the sessions unless the box is ticked.

        // Task mode: a task holds its sessions as a workspace holds its tabs. 概览 first, then one tab per

        function taskTabs(t, sid) {
          const w = wsOfTask(t)
          const tab = (x) => {

          }

          const sessions = familySessions(t).filter((x) => x.state !== 'ended')

            ? `<div class="wtab" data-act="new-session" data-id="${t.id}" title="开会话">${ic('plus', 14)}</div>`
            : `<div class="wtab start" data-act="start-work" data-id="${t.id}" title="还没有工作区：先开始做">${ic('play', 12)}<span>开始做</span></div>`

        }

        // ---------- session drawer: 速览 (narrow) ↔ 加宽 (wide), both fully operable; 全屏 switches to its tab ----------

        // Typing into a session (its tab, or the wide drawer): the sentence goes in as the next instruction and the session goes back to work.
        function sendToSession(s, text) {
          const wasWaiting = s.state === 'waiting'
          if (s.view === 'chat') {
            ;(S.chats[s.id] = S.chats[s.id] || []).push({ who: 'you', text, status: '刚刚' })
            if (wasWaiting && s.id === 's38') {
              later(2200, () => {
                if (s.state !== 'working') return
                const said = `好，未关联任务的工作区放在${text.includes('最上面') ? '最上面' : '最下面'}，组头写「未关联任务」。我改一下。`
                S.chats[s.id].push({ who: 'agent', text: said })
                s.last = said
              })
            }
          } else {
            const lines = [...(S.terminals[s.id] || [])]
            while (
              lines.length &&
              (lines[lines.length - 1][1] === '> ' || lines[lines.length - 1][0] === '\n')
            )
              lines.pop()
            S.terminals[s.id] = [
              ...lines,
              ['\n'],
              ['\n'],
              ['d', '> '],
              ['w', text],
              ['\n'],
              ['d', '  ⎿  已送达'],
              ['\n'],
              ['\n'],
              ['o', '✶ 正在思考…'],
              ['d', ' (刚刚 · esc 中断)']
            ]
          }
          s.state = 'working'
          s.since = '刚刚'
          s.last = ''
          s.lastAt = '刚刚'
          if (s.task) {
            const t = T(s.task)
            t.updated = '刚刚'
            if (wasWaiting)
              t.timeline.push({
                at: '刚刚',
                kind: 'comment',
                text: `回答 ${AG[s.agent]} 的问题：${text}`,
                by: '你'
              })
            // A question asked while accepting: the session works on it, the task stays 待验收.
            if (rootOf(t).status === 'review') {
              s.askedInReview = true
              if (s.id === 's12') {
                later(2200, () => {
                  if (s.state !== 'working' || s.view !== 'terminal') return
                  const lines = S.terminals[s.id]
                  const spinner = lines.splice(lines.length - 2, 2)
                  S.terminals[s.id] = [
                    ...lines,
                    ['w', '⏺ '],
                    ['', D.reviewAnswer[0]],

        // ---------- pages + window ----------
        function homePage() {

        }
        function windowHtml() {
          let side = sidebar(S.view === 'home' ? 'tasks' : S.view === 'detail' ? 'tasks' : null)
          let main

          if (S.view === 'settings') {
            side = settingsSide()
            main = `<div class="titlebar"></div>${settingsPage()}`
            cls = 'settings'
          } else if (S.view === 'detail') main = detailPage(S.detail)
          else if (S.view === 'chat') main = chatPage()
          else if (S.view === 'session') main = sessionPage(S.session)
          else main = homePage()
          const drawer = S.drawer && S.view !== 'settings' ? drawerHtml() : ''
          const overlay = S.newTask
            ? newTaskDialog()
            : S.composer
              ? composerDialog()
              : S.sessionDlg
                ? sessionDialog()
                : S.cancelDlg
                  ? cancelDialog()
                  : ''
          const tst = S.toast
            ? `<div class="toast">${ic('info', 13)}${esc(S.toast.text)}</div>`
            : ''
          return `<div class="win ${cls}">${side}<div class="main ${drawer && pushed() ? 'pushed' : ''}">${main}${drawer}${tst}</div>${statusbar()}${overlay}<div class="popover ttip" id="ttip"></div></div>`
        }

        // ---------- render ----------
        const frame = document.querySelector('.frame')
        function render() {
          const active = document.activeElement
          const activeKey = active && active.dataset ? active.dataset.fk : null
          const focusKey = S.focus || activeKey
          const caret =
            !S.focus && active && typeof active.selectionStart === 'number'
              ? active.selectionStart
              : null
          const scrolls = {}
          frame.querySelectorAll('[id$="scroll"], .home-scroll, .dr-body').forEach((el) => {
            scrolls[el.id || el.className] = el.scrollTop
          })
          frame.innerHTML = `<section class="screen on" id="${current}">${windowHtml()}</section>`
          frame.querySelectorAll('[id$="scroll"], .home-scroll, .dr-body').forEach((el) => {
            const k = el.id || el.className
            if (k in scrolls) el.scrollTop = scrolls[k]
          })
          const term = frame.querySelector('.dterm')
          if (term) term.scrollTop = term.scrollHeight
          for (const el of frame.querySelectorAll('.chatv, .schat-in'))
            el.scrollTop = el.scrollHeight
          if (S.scrollChat) {
            const cs = frame.querySelector('#chscroll')
            if (cs) cs.scrollTop = cs.scrollHeight
            S.scrollChat = false
          }
          if (focusKey) {
            const el = frame.querySelector(`[data-fk="${focusKey}"]`)
            if (el) {
              el.focus({ preventScroll: true })
              const pos = caret == null ? el.value.length : caret
              try {
                el.setSelectionRange(pos, pos)
              } catch (e) {
                /* not a text field */
              }
              // Opened by the page's own hash while still loading: the browser's fragment scroll blurs the input at load end.
              if (document.readyState !== 'complete')
                window.addEventListener(
                  'load',
                  () => setTimeout(() => el.isConnected && el.focus({ preventScroll: true }), 0),
                  { once: true }
                )
            }
          }
          S.focus = null
        }

        // ---------- events ----------
        // level: 'peek' (narrow, 速览) or 'wide' (加宽). Same drawer, same session, same input; only the width changes.
        // The cursor lands in the session's input whenever the host is in contact.
        function openPeek(sid, level = 'peek') {
          const s = SS(sid)
          S.drawer = { session: sid, level, stopping: false }
          S.ccDraft = ''
          if (s && sFact(s) === 'live' && s.state !== 'ended') S.focus = 'cc-input'
        }

          home: () => {

          'd8-answered': '窄态里选了「最下面」：已送达，Codex 回到工作中',
          'd8-wide': '浮层加宽态 · 聊天',
          'd13-task': '任务视图 · 概览',
          'd13-task-waiting': '任务视图 · 等你回答',
          'd13-shop12': '任务视图 · 子任务会话',
          'd13-session': '点侧栏会话',
          'd13-session-wide': '点侧栏会话 → 加宽',
          'd13-session-tab': '全屏：会话标签 + 收回侧边',
          'd13-unlinked': '未关联任务的会话'
        }
        let current = 'd1'
        function applyPreset(id) {
          timers.forEach(clearTimeout)
          timers = []
          current = id
          S = freshState()
          S.sidebar = storedSidebar(id) || SIDEBAR_DEFAULT[id] || 'workspace'
          PRESETS[id]()
          render()
          const parent = SUB[id] || id
          document
            .querySelectorAll('.switcher .tab')
            .forEach((a) => a.classList.toggle('on', a.dataset.id === parent))
          const sub = document.querySelector('.switcher .subname')
          if (sub) sub.textContent = SUB[id] ? `${id} · ${SUB_NAME[id]}` : ''
          document.title = `Orca 以任务为主 · ${SUB[id] ? SUB_NAME[id] : SCREENS.find(([s]) => s === id)[1]}`
        }
        const nav = document.querySelector('.switcher .tabs-host')
        nav.innerHTML =
          SCREENS.map(
            ([id, name]) =>
              `<a class="tab" href="#${id}" data-id="${id}"><span>${id}</span>${name}</a>`
          ).join('') + '<span class="subname"></span>'
        document.querySelector('.switcher .reset').addEventListener('click', () => {
          try {
            localStorage.removeItem(sidebarKey(current))
          } catch (e) {
            /* nothing stored */
          }
          applyPreset(current)
        })
        function fromHash() {
          const id = (location.hash || '#d1').slice(1).split('?')[0]
          applyPreset(PRESETS[id] ? id : 'd1')
        }
        function fit() {
          const stage = document.querySelector('.stage')
          const s = Math.min(1, (stage.clientWidth - 32) / 1440, (stage.clientHeight - 32) / 900)
          frame.style.transform = `scale(${s})`
        }
        window.addEventListener('hashchange', fromHash)
        window.addEventListener('resize', fit)
        // Exposed for the screenshot script: lets it drive the same actions a user would click.
        window.__tf = {
          state: () => S,
          render,
          act: (name, data = {}) => {
            const el = document.createElement('div')
            Object.assign(el.dataset, data)
            const r = ACTS[name](el)
            if (r !== 'rendered') render()
          }
        }
        fromHash()
        fit()
      })()
    </script>
  </body>
</html>
