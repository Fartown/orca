name: Sync upstream

# Why: this fork tracks stablyai/orca and carries its own features, listed in
# config/fork-features.jsonc. Every week this job fast-forwards `main` to upstream and
# opens a PR that merges it into the integration branch; the PR checks then run the fork
# feature gate and the architecture policies. Conflicts are never resolved here: the job
# opens an issue naming the conflicting files instead, and a person (or an agent in its
# own worktree) resolves them with `pnpm sync:upstream`.
#
# The job verifies the merged tree itself (fork feature gate, architecture policies and
# every registered feature check) before opening the PR, so no personal token is needed for
# the gates that matter. PRs opened with the default GITHUB_TOKEN do not trigger the regular
# PR workflow; set the optional FORK_SYNC_TOKEN secret (a fine-grained PAT with contents +
# pull requests write on this repo) only if you also want that full PR CI on sync PRs.

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/stablyai/orca.git
  UPSTREAM_BRANCH: main
  INTEGRATION_BRANCH: fork/integration

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "orca-fork-sync"
          git config user.email "orca-fork-sync@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch origin "$UPSTREAM_BRANCH"

      - name: Fast-forward main to upstream
        run: |
          git fetch . "upstream/$UPSTREAM_BRANCH:$UPSTREAM_BRANCH"
          git push origin "$UPSTREAM_BRANCH:$UPSTREAM_BRANCH"

      - name: Merge upstream into a sync branch
        id: merge
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Integration already contains upstream; nothing to do."
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync/upstream-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git push --force-with-lease origin "$branch"
            echo "state=merged" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/install-node-dependencies
        if: steps.merge.outputs.state == 'merged'
        with:
          native-runtime: node

      # Why in-job: the merged tree is verified here whether or not PR CI runs later.
      - name: Verify the merged tree
        id: verify
        if: steps.merge.outputs.state == 'merged'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Sync verification"
            echo
            for step in \
              "pnpm run check:fork-features" \
              "pnpm run check:architecture-policies -- --base upstream/$UPSTREAM_BRANCH" \
              "pnpm run build:goal-driver" \
              "node config/scripts/run-fork-feature-checks.mjs"; do
              if $step > step.log 2>&1; then
                echo "- ✅ \`$step\`"
              else
                echo "- ❌ \`$step\`"
                echo
                echo '```'
                tail -n 40 step.log
                echo '```'
                echo "failed=true" >> "$GITHUB_OUTPUT"
                break
              fi
            done
          } | tee verify-summary.md
          cat verify-summary.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q '❌' verify-summary.md; then exit 1; fi

      - name: Open the sync pull request
        if: steps.merge.outputs.state == 'merged'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          if [ "${{ steps.verify.outputs.failed }}" = "true" ]; then
            title="sync: upstream main $(date -u +%Y-%m-%d) [checks failed]"
          else
            title="sync: upstream main $(date -u +%Y-%m-%d)"
          fi
          existing=$(gh pr list --base "$INTEGRATION_BRANCH" --head "${{ steps.merge.outputs.branch }}" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for this branch."
            exit 0
          fi
          {
            echo "Merges stablyai/orca main at \`$upstream_sha\` into \`$INTEGRATION_BRANCH\`."
            echo
            cat verify-summary.md
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Opened by the sync-upstream workflow. Merge only when every line above is ✅ (or after fixing on this branch and re-running \`pnpm sync:upstream\` locally)."
          } > pr-body.md
          gh pr create \
            --base "$INTEGRATION_BRANCH" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "$title" \
            --body-file pr-body.md

      - name: Open a conflict issue
        if: steps.merge.outputs.state == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          {
            echo "Merging stablyai/orca main at \`$upstream_sha\` into \`$INTEGRATION_BRANCH\` conflicts in:"
            echo
            sed 's/^/- /' conflicts.txt
            echo
            echo 'Resolve locally from a clean `'"$INTEGRATION_BRANCH"'` checkout:'
            echo
            echo '```'
            echo 'pnpm sync:upstream          # stops on the same conflicts'
            echo '# resolve, keeping every feature in config/fork-features.jsonc'
            echo 'git add -A && git commit    # commit the merge before the gates run'
            echo 'pnpm sync:upstream --push   # re-runs every gate and feature check, then pushes'
            echo '```'
          } > issue-body.md
          gh issue create --title "Upstream sync conflict ($(date -u +%Y-%m-%d))" --label sync-upstream --body-file issue-body.md \
            || gh issue create --title "Upstream sync conflict ($(date -u +%Y-%m-%d))" --body-file issue-body.md
