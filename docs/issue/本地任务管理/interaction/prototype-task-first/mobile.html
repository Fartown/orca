              title: title || firstSentence(text),
              pendingTitle: null,
              status: 'doing',
              ws: parent ? null : w.id,
              parent,
              // The sentence is the title; it is not repeated as the description.
              desc: '',
              progress: [],
              updated: '刚刚',
              created: ++this.seq,
              createdAt: `刚刚 · 由${src}派出`,
              priority: 0,
              labels: [],
              timeline: [
                {
                  who: src,
                  kind: 'chat',
                  time: '刚刚',
                  html:
                    origin === 'proposal'
                      ? '你确认提案后，由 Orca 直接建任务、关联工作区、开会话'
                      : '由对话派出（手机）',
                  link: { act: 'open-conv', id: this.s.convId, label: '回到对话' }
                },
                ...(newProj
                  ? [
                      {
                        who: 'Orca',
                        kind: 'chat',
                        sys: true,
                        time: '刚刚',
                        html: `仓库 ${repo.id} 还没有项目，先建了项目 ${newProj}`
                      }
                    ]
                  : []),
                ...(newWs
                  ? [
                      {
                        who: src,
                        kind: 'chat',
                        sys: true,
                        time: '刚刚',
                        html: `在 ${h.name} 新建工作区 <span class="mono">${w.name}</span>`
                      }
                    ]
                  : []),
                ...(parent
                  ? [
                      {
                        who: src,
                        kind: 'chat',
                        sys: true,
                        time: '刚刚',
                        html: `<span class="mono">${w.name}</span> 属于 ${parent}，建成它的子任务`
                      }
                    ]
                  : []),
                {
                  who: src,
                  kind: 'chat',
                  sys: true,
                  time: '刚刚',
                  html: `在 <span class="mono">${w.name}</span> 启动了 ${agent} 会话，原话作为第一句直接发送`
                },
                {
                  who: '规则',
                  kind: 'rule',
                  sys: true,
                  time: '刚刚',
                  html: '状态 未开始 → <b>进行中</b>',
                  rule: '开始做'
                }
              ]
            }
            if (!parent) w.task = id
            else {
              const pt = this.task(parent)
              pt.children = [...(pt.children || []), id]
            }
            this.d.tasks.push(t)
            const s = {
              id: `s-${id}`,
              task: id,
              agent,
              view: 'terminal',
              state: 'working',
              since: '刚刚',
              last: '',
              term: [
                `<span class="o">✻</span> Welcome to ${agent === 'Claude' ? 'Claude Code' : 'Codex'}`,
                '',
                `<span class="d">&gt;</span> ${esc(text)}`,
                `  <span class="d">任务 ${id}，需要最新内容时运行 orca task show ${id}</span>`,
                '',
                `<span class="y">✻</span> Thinking… <span class="d">(esc to interrupt)</span>`
              ]
            }
            this.d.sessions.push(s)
            const card = {
              key: `k${this.seq}`,
              task: id,
              session: s.id,
              ws: w.id,
              newWs,
              newProj,
              parent,
              undoLeft: 10,
              age: 0,
              text,
              chips: clone(chips),
              origin
            }
            this.cards[card.key] = card
            return card
          }
          // 仓库还没有项目：派活停在「建一个？」这一步（和桌面 d3-noproject 一样），确认后才建项目并派活。
          repoOfTarget(tg) {
            if (tg.type === 'repo') return this.repo(tg.id)
            if (tg.type === 'ws') return this.repo(this.ws(tg.id).repo)
            return null
          }
          projOk(key) {
            const c = this.cards[key]
            const repo = this.repo(c.repo)
            const pkey = this.ensureProject(repo)
            const target = c.ws ? { type: 'ws', id: c.ws } : { type: 'repo', id: c.repo }
            const nc = this.createDispatch({
              target,
              text: c.text,
              chips: c.chips,
              origin: c.origin,
              newProj: pkey
            })
            const conv = this.conv(this.s.convId)
            if (c.origin === 'home') {
              this.s.dispatched = this.s.dispatched.map((k) => (k === key ? nc.key : k))
              conv.msgs.push(
                { type: 'me', text: c.text, chips: clone(c.chips), time: '刚刚' },
                { type: 'cards', keys: [nc.key] }
              )
            } else {
              conv.msgs.forEach((m) => {
                if (m.type === 'cards') m.keys = m.keys.map((k) => (k === key ? nc.key : k))
              })
              this.s.scrollBottom = true
            }
            delete this.cards[key]
            this.toast(`建了项目 ${pkey}，已派活 ${nc.task}`)
          }
          projCancel(key) {
            const c = this.cards[key]
            this.s.dispatched = this.s.dispatched.filter((k) => k !== key)
            const conv = this.conv(this.s.convId)
            conv.msgs = conv.msgs.filter(
              (m) => !(m.type === 'cards' && m.keys.length === 1 && m.keys[0] === key)
            )
            this.s.comp[c.origin] = { chips: clone(c.chips), text: c.text }
            this.s.focus = `comp-${c.origin}`
            delete this.cards[key]
          }
          send(comp) {
            const c = this.s.comp[comp]
            const text = c.text.trim()
            if (!text) {
              this.toast('先说一句要做什么', 'info')
              this.render()
              return
            }
            const targets = c.chips.filter((ch) => ch.type !== 'host')
            const conv = this.conv(this.s.convId)
            const placeable =
              targets.length === 1 &&
              c.chips.length === 1 &&
              !(targets[0].type === 'task' && !this.taskWs(this.task(targets[0].id)))
            if (placeable) {
              const repo = this.repoOfTarget(targets[0])
              if (repo && !repo.project) {
                const card = {
                  key: `k${++this.seq}`,
                  kind: 'noproj',
                  repo: repo.id,
                  pkey: repo.id.slice(0, 4).toUpperCase(),
                  ws: targets[0].type === 'ws' ? targets[0].id : null,
                  text,
                  chips: clone(c.chips),
                  origin: comp
                }
                this.cards[card.key] = card
                if (comp === 'home') this.s.dispatched.unshift(card.key)
                else {
                  conv.msgs.push({ type: 'cards', keys: [card.key] })
                  this.s.scrollBottom = true
                }
                this.s.comp[comp] = { chips: [], text: '' }
                this.render()
                return card
              }
              const card = this.createDispatch({
                target: targets[0],
                text,
                chips: c.chips,
                origin: comp
              })
              conv.msgs.push(
                { type: 'me', text, chips: clone(c.chips), time: '刚刚' },
                { type: 'cards', keys: [card.key] }
              )
              if (comp === 'home') this.s.dispatched.unshift(card.key)
              else this.s.scrollBottom = true
              this.s.comp[comp] = { chips: [], text: '' }
              this.render()
              return card
            }
            conv.msgs.push(
              { type: 'me', text, chips: clone(c.chips), time: '刚刚' },
              { type: 'thinking' }
            )
            this.s.comp[comp] = { chips: [], text: '' }
            if (comp === 'home') this.go({ name: 'chat' })
            this.s.scrollBottom = true
            const reply = () => {
              conv.msgs = conv.msgs.filter((m) => m.type !== 'thinking')
              if (/PR|合/.test(text)) conv.msgs.push(this.proposalMsg())
              else
                conv.msgs.push({
                  type: 'bot',
                  ro: D.proposal.readOnly.slice(0, 2),
                  text: '这句话没说在哪做，我也没看出要拆成几件事。要派活的话，@ 一个工作区或仓库；想让我先找，就说清楚找什么。'
                })
              this.s.scrollBottom = true
              this.render()
            }
            if (SHOT) reply()
            else {
              this.render()
              setTimeout(reply, 1400)
            }
          }
          undo(key) {
            const c = this.cards[key]
            const t = this.task(c.task)
            const s = this.ses(c.session)
            const w = this.ws(c.ws)
            c.undone = true
            this.d.tasks = this.d.tasks.filter((x) => x.id !== t.id)
            this.d.sessions = this.d.sessions.filter((x) => x.id !== s.id)
            if (c.parent) {
              const pt = this.task(c.parent)
              pt.children = pt.children.filter((x) => x !== t.id)
            }
            if (w.task === t.id) delete w.task
            const wsNote = c.newWs
              ? `新建的工作区 ${w.name} 留着，不用可以删。`
              : `${w.name} 原本就有，没动。`
            c.undoNote = `停了 ${s.agent} 会话，删了 ${t.id}。${wsNote}${c.origin === 'home' ? '原话已放回输入框。' : ''}`
            if (c.origin === 'home') this.s.comp.home = { chips: c.chips, text: c.text }
            if (this.s.route.name === 'task' && this.s.route.id === t.id) this.back()
            this.render()
          }
          confirmProposal(msg) {
            const p = msg.proposal
            p.done = true
            p.editing = null
            const keys = p.items
              .filter((i) => i.on)
              .map(
                (i) =>
                  this.createDispatch({
                    target: { type: 'ws', id: i.ws },
                    text: i.prompt,
                    title: i.title,
                    agent: i.agent,
                    origin: 'proposal'
                  }).key
              )
            const conv = this.conv(this.s.convId)
            conv.msgs.push({
              type: 'bot',
              text: `已派活 ${keys.length} 项。会话都已启动，进展会写回各自的任务。`,
              keys
            })
            this.s.scrollBottom = true
          }

          // ---------- 速览、验收、新建 ----------
          // 速览就是会话的小边框模式：抽屉里是真实会话视图，光标直接落在它的输入里。
          openPeek(sid) {
            this.s.sheet = { name: 'peek', sid, reply: '' }
            const s = this.ses(sid)
            if (s && !this.offline(this.task(s.task)) && s.state !== 'ended')
              this.s.focus = 'peek-reply'
          }
          canSend(s) {
            return !this.offline(this.task(s.task)) && s.state !== 'ended'
          }
          // 往会话里说一句（速览、会话页都走这里）：送进去当下一句，会话回到工作中；回答提问时 Codex 稍后接话。
          sendToSession(s, txt) {
            const t = this.task(s.task)
            const wasWaiting = s.state === 'waiting'
            if (s.view === 'chat')
              s.chat.push({ who: 'me', time: '刚刚', text: txt, delivered: true })
            else termType(s, txt)
            s.state = 'working'
            s.since = '刚刚'
            s.last = ''
            s.replied = true
            t.updated = '刚刚'
            t.timeline.push({
              who: '你',
              kind: 'you',
              time: '刚刚',
              html: wasWaiting
                ? `回答了 ${s.agent} 的问题（手机）`
                : `发给 ${s.agent} 当下一句（手机）`,
              comment: txt
            })
            if (this.rootOf(t).status === 'review') {
              s.askedInReview = true
              if (s.id === 's-12') {
                const answer = () => {
                  if (s.state !== 'working' || s.view !== 'terminal') return
                  const spin = s.term.pop()
                  s.term.push(
                    ...D.reviewAnswer.term.map(
                      (x, i) => `${i ? '  ' : '<span class="g">⏺</span> '}${esc(x)}`
                    ),
                    '',
                    spin
                  )
                  s.last = D.reviewAnswer.text
                  s.replied = false
                }
                if (SHOT) answer()
                else
                  setTimeout(() => {
                    answer()
                    this.render()
                  }, 2200)
              }
            }
            if (wasWaiting && s.id === 's-38') {
              const reply = () => {
                if (s.state !== 'working') return
                const said = `好，未关联任务的工作区放在${txt.includes('最上面') ? '最上面' : '最下面'}，组头写「未关联任务」。我改一下。`
                s.chat.push({ who: 'agent', time: '刚刚', text: said })
                s.last = said
                s.replied = false
              }
              if (SHOT) reply()
              else
                setTimeout(() => {
                  reply()
                  this.render()
                }, 2200)
            }
          }
          peekSend() {
            const sh = this.s.sheet
            const txt = (sh.reply || '').trim()
            const s = this.ses(sh.sid)
            if (!txt || !this.canSend(s)) return
            this.sendToSession(s, txt)
            sh.reply = ''
            this.s.focus = 'peek-reply'
          }
          pass(tid) {
            const t = this.task(tid)
            t.status = 'done'
            t.result = { kind: 'pass' }
            t.doneNote = '你通过了验收 · 刚刚'
            t.timeline.push({
              who: '你',
              kind: 'you',
              time: '刚刚',
              html: '通过了验收，状态 待验收 → <b>完成</b>（手机）'
            })
            this.toast('已通过，任务移到完成')
          }
          // 打回的会话：这个任务和它子任务下做完一轮的会话，各带子任务标题。
          rejectTargets(t) {
            return this.treeSessions(t)
              .filter((x) => x.state === 'done' && !this.offline(t))
              .map((s) => ({
                s,
                label: `${s.agent}${s.task !== t.id ? `（${this.task(s.task).title.split(/[：:]/)[0]}）` : ''}`
              }))
          }
          reject(tid, reason) {
            const t = this.task(tid)
            const targets = this.rejectTargets(t)
            const names = targets
              .map((x) => x.label)
              .join('和 ')
              .trim()
            t.status = 'doing'
            t.result = { kind: 'reject', reason, agent: names || null }
            t.timeline.push({
              who: '你',
              kind: 'you',
              time: '刚刚',
              html: '打回（手机）',
              comment: reason
            })
            t.timeline.push({
              who: '你',
              kind: 'you',
              time: '刚刚',
              html: '状态 待验收 → <b>进行中</b>'
            })
            for (const { s } of targets) {
              s.state = 'working'
              s.since = '刚刚'
              if (s.view === 'chat')
                s.chat.push({ who: 'me', time: '刚刚', text: `打回：${reason}`, delivered: true })
              else termType(s, `打回：${reason}`)
            }
            if (targets.length)
              t.timeline.push({
                who: '你',
                kind: 'you',
                time: '刚刚',
                html: `打回原因作为下一句指令发给了 ${names} · 已送达`
              })
            else {
              const w = this.taskWs(t)
              if (w) {
                this.d.sessions.push({
                  id: `s-${t.id}-${++this.seq}`,
                  task: t.id,
                  agent: 'Claude',
                  view: 'terminal',
                  state: 'working',
                  since: '刚刚',
                  last: '',
                  term: [
                    '<span class="o">✻</span> Welcome to Claude Code',
                    '',
                    `<span class="d">&gt;</span> 打回：${esc(reason)}`,
                    `  <span class="d">任务 ${t.id}，需要最新内容时运行 orca task show ${t.id}</span>`,
                    '',
                    '<span class="y">✻</span> Thinking… <span class="d">(esc to interrupt)</span>'
                  ]
                })
                t.timeline.push({
                  who: 'Orca',
                  kind: 'chat',
                  sys: true,
                  time: '刚刚',
                  html: `没有做完一轮的会话，用打回原因加任务说明开了一个新的 Claude 会话 · <span class="mono">${w.name}</span>`
                })
              }
            }
            this.s.sheet = null
            this.toast(targets.length ? `已打回，原因已发给 ${names}` : '已打回，用原因开了新会话')
          }
          addSummary(tid) {
            const t = this.task(tid)
            const s = this.sessionsOf(tid)[0]
            t.progress.unshift({
              n: null,
              source: 'orca',
              session: s ? s.id : null,
              time: '刚刚',
              text:
                (D.summaries && D.summaries[tid]) || `${t.progress[0] ? t.progress[0].text : ''}`,
              needs: ''
            })
            t.timeline.push({
              who: 'Orca',
              kind: 'chat',
              sys: true,
              time: '刚刚',
              html: `读了 ${s ? s.agent : ''} 的会话记录，生成了一条进展（你点的「生成摘要」）`
            })
          }
          blankForm(over = {}) {
            return {
              project: 'SHOP',
              title: '',
              desc: '',
              where: 'existing',
              q: '',
              pick: null,
              repo: 'shop',
              wsName: 'shop-16',
              agent: 'Claude',
              prompt: '按任务说明开始',
              ...over
            }
          }
          openNew(filled) {
            const N = D.newTask
            this.s.form = this.blankForm(
              filled
                ? {
                    project: N.project,
                    title: N.title,
                    desc: N.desc,
                    pick: 'shop/refund-webhook',
                    wsName: 'shop-16-refund-filter'
                  }
                : {}
            )
            this.go({ name: 'new' })
          }
          commitForm(f, existingTask) {
            let w = null
            let parent = null
            if (f.where === 'existing') {
              w = this.ws(f.pick)
              if (w.task) parent = w.task
            }
            if (f.where === 'new') {
              const r = this.repo(f.repo)
              w = { id: `${r.id}/${f.wsName}`, repo: r.id, name: f.wsName, created: true }
              this.d.workspaces.push(w)
            }
            const project = w ? this.repo(w.repo).project : f.project
            const t = existingTask || {
              id: this.nextId(project),
              project,
              title: f.title.trim(),
              desc: f.desc.trim(),
              progress: [],
              updated: '刚刚',
              created: ++this.seq,
              createdAt: '刚刚 · 你新建',
              priority: 0,
              labels: [],
              timeline: [
                { who: '你', kind: 'you', sys: true, time: '刚刚', html: '在手机上新建任务' }
              ]
            }
            if (!existingTask) this.d.tasks.push(t)
            const h = w && this.wsHost(w)
            if (w) {
              if (parent) {
                t.parent = parent
                const pt = this.task(parent)
                pt.children = [...(pt.children || []), t.id]
                t.timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html: `<span class="mono">${w.name}</span> 属于 ${parent}，建成它的子任务`
                })
              } else {
                t.ws = w.id
                w.task = t.id
                t.timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html:
                    f.where === 'new'
                      ? `开始做：在 ${h.name} 新建工作区 <span class="mono">${w.name}</span>`
                      : `关联工作区 <span class="mono">${w.name}</span>`
                })
              }
              if (f.agent !== 'none') {
                this.d.sessions.push({
                  id: `s-${t.id}`,
                  task: t.id,
                  agent: f.agent,
                  view: 'terminal',
                  state: 'working',
                  since: '刚刚',
                  last: '',
                  term: [
                    `<span class="o">✻</span> Welcome to ${f.agent === 'Claude' ? 'Claude Code' : 'Codex'}`,
                    '',
                    `<span class="d">&gt;</span> ${esc(f.prompt)}`,
                    `  <span class="d">任务 ${t.id}，需要最新内容时运行 orca task show ${t.id}</span>`,
                    '',
                    '<span class="y">✻</span> Thinking… <span class="d">(esc to interrupt)</span>'
                  ]
                })
                t.timeline.push({
                  who: '你',
                  kind: 'you',
                  sys: true,
                  time: '刚刚',
                  html: `开了 ${f.agent} 会话，第一句「${esc(f.prompt)}」直接发送`
                })
              }
              if (t.status !== 'doing')
                t.timeline.push({
                  who: '规则',
                  kind: 'rule',
                  sys: true,
                  time: '刚刚',
                  html: `状态 ${STATUS_NAME[t.status || 'todo']} → <b>进行中</b>`,
                  rule: '开始做'
                })
              t.status = 'doing'
            } else t.status = t.status || 'todo'
            return { t, w, h }
          }
          createFromForm() {
            const f = this.s.form
            const { t, w } = this.commitForm(f)
            this.s.form = null
            this.s.route = { name: 'task', id: t.id }
            this.s.stack = [{ name: 'home' }, { name: 'tasks' }]
            this.scrollMem[this.routeKey(this.s.route)] = 0
            this.toast(w && f.agent !== 'none' ? `已创建，${f.agent} 会话已启动` : '已创建')
          }

          // ======================================================================
          // views
          view() {
            const r = this.s.route
            if (r.name === 'task' && !this.task(r.id)) this.s.route = { name: 'home' }
            switch (this.s.route.name) {
              case 'task':
                return this.vTask(this.s.route.id)
              case 'tasks':
                return this.vTasks()
              case 'chat':
                return this.vChat()
              case 'new':
                return this.vNew()
              case 'session':
                return this.vSession(this.s.route.sid)
              case 'host':
                return this.vHost(this.s.route.id)
              default:
                return this.vHome()
            }
          }

          // ---------- composer（首页和对话共用） ----------
          chipHTML(ch, comp, i) {
            let icon = 'folder-git-2'
            let label = ''
            let host = ''
            if (ch.type === 'ws') {
              const w = this.ws(ch.id)
              label = `${w.repo}/${w.name}`
              const h = this.wsHost(w)
              if (h.kind !== 'local') host = h.name
            }
            if (ch.type === 'repo') {
              icon = 'folder'
              label = ch.id
              host = '仓库'
            }
            if (ch.type === 'task') {
              icon = 'list-todo'
              const t = this.task(ch.id)
              label = t.title
              host = t.id
            }
            if (ch.type === 'host') {
              const h = this.host(ch.id)
              icon = h.kind === 'local' ? 'laptop' : 'server'
              label = h.name
            }
            return `<span class="m-chip">${ic(icon)}<span class="ell">${esc(label)}</span>${host ? `<span class="host">${host}</span>` : ''}${comp ? `<button data-act="chip-x" data-comp="${comp}" data-i="${i}" aria-label="移除">${ic('x', 's12')}</button>` : ''}</span>`
          }
          vComposer(comp) {
            const c = this.s.comp[comp]
            const ready = !!c.text.trim()
            const ph =
              comp === 'home'
                ? '要做什么？@ 一个工作区或仓库，说一句话'
                : '接着说，或 @ 一个工作区派活'
            return `<div class="composer" data-composer="${comp}">
        <div class="cb-field ${c.chips.length ? 'has-chip' : ''}">${c.chips.map((ch, i) => this.chipHTML(ch, comp, i)).join('')}<textarea data-k="comp-${comp}" data-enter="send" data-comp="${comp}" rows="1" placeholder="${c.chips.length ? '说一句要做什么' : ph}">${esc(c.text)}</textarea></div>
        <div class="cb-bar"><button class="cb-btn at" data-act="mention" data-comp="${comp}" aria-label="提及">@</button>
          ${comp === 'home' ? `<button class="cb-btn" data-act="open-chat">${ic('message-square')}展开对话</button>` : ''}
          <span class="sp"></span><button class="cb-send ${ready ? 'on' : ''}" data-act="send" data-comp="${comp}" aria-label="派活">${ic('send')}</button></div>
      </div>`
          }
          hint(comp) {
            const c = this.s.comp[comp]
            if (!c.chips.length)
              return c.text.trim()
                ? `${ic('sparkles', 's14')}<span>没有 @ 在哪做：交给调度智能体，先出方案，你确认后才动手</span>`
                : ''
            const tg = c.chips.filter((ch) => ch.type !== 'host')
            if (tg.length !== 1 || c.chips.length !== 1)
              return `${ic('sparkles', 's14')}<span>提及了不止一处：交给调度智能体，先出方案</span>`
            const ch = tg[0]
            if (ch.type === 'ws') {
              const w = this.ws(ch.id)
              const h = this.wsHost(w)
              if (w.task)
                return `${ic('corner-down-right', 's14')}<span>${w.name} 属于 ${w.task}，发出后建成它的子任务，会话开在 ${w.name}</span>`
              if (!this.repo(w.repo).project)
                return `${ic('folder', 's14')}<span>仓库 ${w.repo} 还没有项目：发出后先问要不要建项目，再在 ${w.name} 建任务</span>`
              return `${ic('play', 's14')}<span>发出后直接派活：在 ${w.name}（${h.name}）建任务，开 Claude 会话</span>`
            }
            if (ch.type === 'repo') {
              if (!this.repo(ch.id).project)
                return `${ic('folder', 's14')}<span>仓库 ${ch.id} 还没有项目：发出后先问要不要建项目，再新建工作区来做</span>`
              return `${ic('play', 's14')}<span>发出后直接派活：在 ${ch.id}（${this.host(this.repo(ch.id).host).name}）新建工作区，开 Claude 会话</span>`
            }
            const t = this.task(ch.id)
            if (!this.taskWs(t))
              return `${ic('sparkles', 's14')}<span>「${esc(t.title)}」还没有工作区：交给调度智能体，先出方案</span>`
            return `${ic('corner-down-right', 's14')}<span>发出后建成「${esc(t.title)}」的子任务，会话开在 ${this.taskWs(t).name}</span>`
          }

          // ---------- 已派活卡 ----------
          vDisp(key) {
            const c = this.cards[key]
            if (!c) return ''
            if (c.kind === 'noproj') {
              const h = this.host(this.repo(c.repo).host)
              return `<div class="disp noproj" data-disp="${key}">
          <div class="disp-h">${ic('folder')}仓库 ${c.repo} 还没有项目。建一个？</div>
          <div class="disp-b">
            <div class="disp-row np"><span class="nowrap">名称 <b>${c.repo}</b></span><span class="faint">·</span><span class="nowrap">前缀 <b class="mono">${c.pkey}</b></span><span class="faint">·</span><span class="ell">${h.name}${c.ws ? ` · 工作区 ${this.ws(c.ws).name}` : ''}</span></div>
            <div class="disp-row np">${ic('message-square', 's12')}<span class="ell">「${esc(c.text)}」</span></div>
            <div class="disp-note">${ic('info', 's14')}<span>任务要有项目才能建，派活停在这一步；确认后编号从 ${c.pkey}-1 开始。</span></div>
            <div class="ny-acts"><button class="btn sm" data-act="proj-cancel" data-key="${key}">取消</button><button class="btn sm primary" data-act="proj-ok" data-key="${key}">${ic('check')}建项目并派活</button></div>
          </div></div>`
            }
            if (c.undone) {
              return `<div class="disp undone"><div class="disp-h">${ic('undo-2')}已撤销<span class="sp"></span>${c.origin === 'home' ? `<button class="x" data-act="disp-x" data-key="${key}" aria-label="关闭">${ic('x', 's14')}</button>` : ''}</div>
          <div class="disp-b">${esc(c.undoNote)}</div></div>`
            }
            const t = this.task(c.task)
            const s = this.ses(c.session)
            const w = this.ws(c.ws)
            const h = this.wsHost(w)
            const info = s ? this.sesInfo(s) : null
            const undo =
              c.undoLeft > 0
                ? `<button class="undo" data-act="undo" data-key="${key}">${ic('undo-2')}撤销 <span data-cd="${key}">${c.undoLeft}</span> 秒</button>`
                : ''
            const close =
              c.origin === 'home' && !c.historical
                ? `<button class="x" data-act="disp-x" data-key="${key}" aria-label="关闭">${ic('x', 's14')}</button>`
                : ''
            const pt = c.parent && this.task(c.parent)
            const sesLine =
              s && s.state === 'working' && !t.progress.length && !s.last
                ? `${stateDot('working', 12)}<span>${s.agent} 会话已启动 · 等第一条回写</span>`
                : s
                  ? `${stateDot(info.dot, 12)}<span>${s.agent} <span class="${info.cls}">${info.text}</span></span>`
                  : ''
            return `<div class="disp" data-disp="${key}">
        <div class="disp-h">${ic('circle-check')}已派活<span class="muted">· ${c.historical ? c.when : '刚刚'}</span>${undo || '<span class="sp"></span>'}${close}</div>
        <div class="disp-b">
          <div class="disp-task" data-act="open-task" data-id="${t.id}">${statusIcon(t.status)}<div class="row-main"><div class="t ${t.freshTitle && !SHOT ? 'fresh' : ''}">${esc(t.title)}</div>${this.genTag(t)}</div>${ic('chevron-right', 's14 chev')}</div>
          <div class="disp-row"><span class="tid">${t.id}</span><span class="faint">·</span>${ic('folder-git-2', 's12')}<span class="ell">${w.name} · ${h.name}${c.newWs ? ' · 新建的工作区' : ''}</span></div>
          <div class="disp-row">${sesLine}</div>
          ${pt ? `<div class="disp-note">${ic('corner-down-right', 's14')}<span>${w.name} 属于 ${pt.id}「${esc(pt.title)}」，所以建成它的子任务</span></div>` : ''}
          ${c.newProj ? `<div class="disp-note">${ic('folder', 's14')}<span>仓库 ${w.repo} 原来没有项目，建了项目 ${c.newProj}（前缀 ${c.newProj}）后直接派活</span></div>` : ''}
        </div>
        ${c.undoLeft > 0 ? `<div class="disp-bar"><i data-cdbar="${key}" style="width:${c.undoLeft * 10}%"></i></div>` : ''}
      </div>`
          }
          genTag(t, short = false) {
            if (t.pendingTitle)
              return `<span class="gen pending">${ic('sparkles')}${short ? '起标题中' : '正在起短标题'}</span>`
            if (t.freshTitle)
              return `<span class="gen">${ic('sparkles')}${short ? '新标题' : '已换成生成的标题，点开可以改'}</span>`
            return ''
          }

          // ---------- home ----------
          vNy(it) {
            const t = it.t
            if (it.kind === 'review') {
              const ls = this.latestSession(t)
              return `<div class="ny" data-act="open-task" data-id="${t.id}">${statusIcon('review')}
          <div class="ny-main"><div class="t-line"><span class="t-title">${esc(t.title)}</span><span class="t-time">${t.updated}</span></div>
            <div class="t-meta"><span class="tid">${t.id}</span><span class="kind c-ok">待验收</span><span class="sep">·</span><span class="ell">PR #${t.merge.pr} 已合并</span></div>
            <div class="ny-q">验收：${esc(t.acceptNote)}</div>${this.kidsLine(t)}
            <div class="ny-acts">${ls ? `<button class="btn sm" data-act="peek" data-sid="${ls.id}">${ic('eye')}速览</button>` : ''}<button class="btn sm" data-act="open-task" data-id="${t.id}">${ic('check')}去验收</button><button class="btn sm" data-act="snooze" data-id="${t.id}">${ic('clock')}稍后提醒</button></div></div></div>`
            }
            const s = it.s
            return `<div class="ny" data-act="open-task" data-id="${t.id}">${stateDot('waiting', 16)}
        <div class="ny-main"><div class="t-line"><span class="t-title">${esc(t.title)}</span><span class="t-time">${s.since}</span></div>
          <div class="t-meta"><span class="tid">${t.id}</span><span class="kind c-q">等你回答</span><span class="sep">·</span><span>${s.agent}</span></div>
          <div class="ny-q">${esc(s.last)}</div>
          <div class="ny-acts"><button class="btn sm" data-act="peek" data-sid="${s.id}">${ic('eye')}速览</button><button class="btn sm" data-act="open-session" data-sid="${s.id}">${ic('square-terminal')}打开完整会话</button><button class="btn sm" data-act="snooze" data-id="${t.id}">${ic('clock')}稍后提醒</button></div></div></div>`
          }
          vCard(t) {
            const w = this.taskWs(t)
            const h = w && this.wsHost(w)
            const off = this.offline(t)
            const s = this.leadSession(t)
            const lt = this.latest(t)
            let meta = `<span class="tid">${t.id}</span>`
            if (t.status === 'done')
              meta += `<span class="sep">·</span><span>${t.doneNote || '完成'}</span>`
            else if (w)
              meta += `<span class="sep">·</span><span class="ws">${w.name}</span><span class="sep">·</span><span>${h.name}</span>`
            else meta += '<span class="sep">·</span><span>还没有工作区</span>'
            let foot = ''
            if (t.status !== 'done') {
              if (off)
                foot = `${stateDot('unverifiable', 12)}<span class="c-unv">${h.name} 未连接 · 上次进展 ${lt ? lt.time : ''}</span>`
              else if (s) {
                const info = this.sesInfo(s)
                foot = `${stateDot(info.dot, 12)}<span>${s.agent} <span class="${info.cls}">${info.text}</span></span>${lt && lt.src ? `<span class="r">${lt.src} · ${lt.time}</span>` : ''}`
              }
            }
            const kids = (t.children || []).map((cid) => this.task(cid)).filter(Boolean)
            const childRows = kids.length
              ? `<div class="tchild-wrap">${kids
                  .map((k) => {
                    const ks = this.sessionsOf(k.id)[0]
                    return `<div class="tchild ${k.freshTitle ? 'fresh-row' : ''}" data-act="open-task" data-id="${k.id}">${ic('corner-down-right', 'corner')}${statusIcon(k.status, 14)}<span class="ttl">${esc(k.title)}</span><span class="tid">${k.id}</span>${ks ? stateDot(this.sesInfo(ks).dot, 12) : ''}</div>`
                  })
                  .join('')}</div>`
              : ''
            return `<div class="tcard" data-act="open-task" data-id="${t.id}" data-press="${t.id}">${statusIcon(t.status)}
        <div class="ny-main"><div class="t-line"><span class="t-title ${t.freshTitle && !SHOT ? 'fresh' : ''}">${esc(t.title)}</span>${t.pendingTitle || t.freshTitle ? this.genTag(t, true) : ''}</div>
          <div class="t-meta">${meta}</div>
          ${lt && t.status !== 'done' ? `<div class="prog ${lt.dim || off ? 'dim' : ''}">${esc(lt.text)}</div>` : ''}
          ${foot ? `<div class="t-foot">${foot}</div>` : ''}${this.kidsLine(t)}</div></div>${childRows}`
          }
          vHostRows() {
            return this.d.hosts
              .map((h) => {
                const n = this.d.workspaces.filter((w) => this.wsHost(w).id === h.id).length
                const kind =
                  h.kind === 'local'
                    ? '配对的桌面'
                    : h.kind === 'ssh'
                      ? `SSH 主机 · 经 ${this.host(h.via).name}`
                      : h.kindLabel
                const sub = h.online
                  ? `<span class="host-dot"></span>${kind} · ${n} 个工作区`
                  : `<span class="host-dot off"></span>${kind} · 未连接，${h.lost}`
                return `<div class="host-row ${h.online ? '' : 'off'}" data-act="open-host" data-id="${h.id}"><div class="icon-box">${ic(h.kind === 'local' ? 'laptop' : 'server', 's18')}</div>
          <div class="row-main"><div class="row-title">${h.name}</div><div class="row-sub">${sub}</div></div>${ic('chevron-right', 's14 chev')}</div>`
              })
              .join('')
          }
          // 上游首页不动（I10）：欢迎语、统计、主机、最近会话；本地任务卡升级为任务页入口，带需要你和最新进展。
          vHome() {
            const ny = this.needsYou()
            const doing = this.d.tasks.filter((t) => !t.parent && t.status === 'doing').length
            const resume = D.resume
              .map((id) => this.ses(id))
              .filter(Boolean)
              .map((s) => {
                const t = this.task(s.task)
                const w = this.taskWs(t)
                const info = this.sesInfo(s)
                return `<div class="row" data-act="open-session" data-sid="${s.id}">${stateDot(info.dot, 16)}<div class="row-main"><div class="row-title">${w.name}<span class="faint" style="font-weight:400"> · ${s.agent}</span></div><div class="row-sub"><span class="${info.cls} nowrap">${info.text}</span><span class="faint">·</span><span class="ell">${esc(s.last || '会话已启动')}</span></div></div>${ic('chevron-right', 's14 chev')}</div>`
              })
              .join('')
            const nyRow = (it) => {
              const t = it.t
              if (it.kind === 'review')
                return `<div class="lt-row" data-act="open-task" data-id="${t.id}">${statusIcon('review')}<div class="row-main"><div class="lt-l1"><span class="tid">${t.id}</span><span class="kind c-ok">待验收</span><span class="sp"></span><span class="t-time">${t.updated}</span></div><div class="lt-l2">${esc(t.title)} · PR #${t.merge.pr} 已合并，等你验收</div></div></div>`
              return `<div class="lt-row" data-act="open-task" data-id="${t.id}">${stateDot('waiting', 16)}<div class="row-main"><div class="lt-l1"><span class="tid">${t.id}</span><span class="kind c-q">等你回答</span><span class="sp"></span><span class="t-time">${it.s.since}</span></div><div class="lt-l2">${it.s.agent}：${esc(it.s.last)}</div></div></div>`
            }
            // 最新进展：需要你之外、最近有回写的那条。
            const latestTask = this.d.tasks.filter(
              (t) =>
                !t.parent &&
                t.status === 'doing' &&
                !ny.some((x) => x.t.id === t.id) &&
                t.progress.length &&
                !this.offline(t)
            )[0]
            const latestRow = latestTask
              ? (() => {
                  const lt = this.latest(latestTask)
                  const s = this.leadSession(latestTask)
                  return `<div class="lt-row" data-act="open-task" data-id="${latestTask.id}">${stateDot(s ? this.sesInfo(s).dot : 'ended', 16)}<div class="row-main"><div class="lt-l1"><span class="tid">${latestTask.id}</span><span class="kind">最新进展 · ${lt.src}</span><span class="sp"></span><span class="t-time">${lt.time}</span></div><div class="lt-l2">${esc(lt.text)}</div></div></div>`
                })()
              : ''
            const total = this.d.tasks.filter((t) => !t.parent && t.status !== 'done').length
            return `<div class="home-top"><h1>Orca</h1><span class="sp"></span>${soon('settings', '设置')}</div>
      <div class="scroll">
        <div class="welcome">欢迎回来</div>
        <div class="stats">${D.stats.map((x) => `<div class="stat">${ic(x.icon)}<div class="n">${x.n}</div><div class="l">${x.label}</div></div>`).join('')}</div>
        <div class="sec" data-anchor="sec-hosts">${ic('monitor', 's14 muted')}主机<span class="n">${this.d.hosts.length}</span></div>
        <div class="list-card">${this.vHostRows()}</div>
        <div class="sec">${ic('rotate-ccw', 's14 muted')}最近会话<span class="n">${D.resume.length}</span></div>
        <div class="list-card">${resume}</div>
        <div class="sec" data-anchor="sec-local">${ic('list-todo', 's14 muted')}任务</div>
        <div class="lt-card" data-anchor="local-card">
          <div class="lt-h" data-act="open-tasks"><div class="icon-box">${ic('list-todo', 's18')}</div><div class="row-main"><div class="row-title">本地任务</div><div class="row-sub">本地 · GitHub · Linear</div></div>${ic('chevron-right', 's14 chev')}</div>
          <div class="lt-stats" data-act="open-tasks"><span><b class="q">${ny.length}</b>需要你</span><span><b>${doing}</b>进行中</span></div>
          ${ny.slice(0, 2).map(nyRow).join('')}${latestRow}
          <div class="lt-foot" data-act="open-tasks">查看全部 ${total} 条${ic('chevron-right', 's14')}</div>
        </div>
        <div class="pad-bottom"></div>
      </div>`
          }
          // 本地任务页：派活输入框在最上面，由配对的桌面执行；分段 需要你 / 进行中 / 全部。
          vTasks() {
            const seg = this.s.tseg || 'all'
            const ny = this.needsYou()
            const nyIds = new Set(ny.map((x) => x.t.id))
            const allTops = this.d.tasks
              .filter((t) => !t.parent)
              .sort((a, b) => (b.created || 0) - (a.created || 0))
            const tops = allTops.filter((t) => !nyIds.has(t.id))
            const group = (st, name, items, foldable) => {
              if (!items.length) return ''
              const fold = foldable && this.s.foldDone
              return `<div class="sec ${foldable ? 'clickable' : ''} ${fold ? 'collapsed' : ''}" data-anchor="sec-${st}" ${foldable ? 'data-act="fold-done"' : ''}>${foldable ? ic('chevron-down', 'tog') : ''}${statusIcon(st, 14)}${name}<span class="n">${items.length}</span></div>
          ${fold ? '' : `<div class="list-card">${items.map((t) => this.vCard(t)).join('')}</div>`}`
            }
            let body
            if (seg === 'need')
              body = ny.length
                ? `<div class="list-card" style="margin-top:12px">${ny.map((it) => this.vNy(it)).join('')}</div>`
                : '<div class="ses-empty" style="padding:24px 16px;text-align:center">没有在等你的</div>'
            else if (seg === 'doing')
              body = group(
                'doing',
                '进行中',
                allTops.filter((t) => t.status === 'doing'),
                false
              )
            else
              body = `${ny.length ? `<div class="sec" data-anchor="sec-ny">${ic('bell', 's14 c-q')}需要你<span class="n attn">${ny.length}</span></div><div class="list-card">${ny.map((it) => this.vNy(it)).join('')}</div>` : ''}
        ${[
          ['doing', '进行中'],
          ['review', '待验收'],
          ['todo', '未开始'],
          ['done', '完成']
        ]
          .map(([st, name]) =>
            group(
              st,
              name,
              tops.filter((t) => t.status === st),
              st === 'done'
            )
          )
          .join('')}`
            const hint = this.hint('home')
            const segBtn = (k, name, n) =>
              `<button class="${seg === k ? 'on' : ''}" data-act="tseg" data-v="${k}">${name}${n != null ? `<span class="n">${n}</span>` : ''}</button>`
            return `${navbar({ back: '首页', title: '本地任务', right: `<button class="icon-btn" data-act="new-task" aria-label="新建任务" title="新建任务">${ic('plus')}</button>${soon('search', '搜索')}` })}
      <div class="scroll">
        ${this.vComposer('home')}
        <div class="exec-line">${ic('laptop', 's12')}由 MacBook Pro 执行 · 任务在它的库里，手机通过它读写</div>
        ${hint ? `<div class="cb-hint">${hint}</div>` : ''}
        ${this.s.dispatched.map((k) => this.vDisp(k)).join('')}
        <div class="seg tseg">${segBtn('need', '需要你', ny.length)}${segBtn('doing', '进行中', allTops.filter((t) => t.status === 'doing').length)}${segBtn('all', '全部', null)}</div>
        ${body}
        <div class="pad-bottom"></div>
      </div>`
          }

          // ---------- 任务详情（第三轮：头部一个主按钮，一张「现在」卡，空块不显示，系统记录折叠） ----------
          vTimelineItem(x) {
            const link = x.link
              ? `<a class="tl-link" data-act="${x.link.act}" data-id="${x.link.id}">${x.link.label}${ic('chevron-right', 's12')}</a>`
              : ''
            return `<div class="tl-item ${x.sys ? 'sys' : ''}"><span class="tl-dot ${x.kind}"></span>${x.who ? `<span class="who">${x.who}</span> ` : ''}${x.html}${x.rule ? ` <span class="tl-rule">${ic('zap')}${x.rule}</span>` : ''}<span class="tl-time">${x.time}</span>${link}
        ${x.quote ? `<div class="tl-quote">${esc(x.quote)}</div>` : ''}${x.comment ? `<div class="tl-quote">${esc(x.comment)}</div>` : ''}</div>`
          }
          // 验收条：合入位置、改动、智能体的自检结论、在哪验收、通过 / 打回；没有可勾选的清单。
          vAccept(t) {
            const w = this.taskWs(t)
            const latest = t.progress.find((p) => p.source !== 'orca')
            const s = latest && latest.session && this.ses(latest.session)
            const diff =
              w && w.diff
                ? `${ic('file-diff', 's14')}<span>${w.diff.files} 个文件 <span class="c-ok">+${w.diff.add}</span> <span class="c-del">−${w.diff.del}</span></span><a class="acc-lnk" data-act="soon-msg" data-msg="查看更改：打开 diff 面板">查看更改</a>`
                : '<span class="muted">没有改动</span>'
            // 来源就是写这条回写的会话：点了在抽屉里打开它。
            const srcText = `${s ? s.agent : '智能体'} · 回写 #${latest ? latest.n : ''} · ${latest ? latest.time : ''}`
            const src =
              s && !this.offline(t)
                ? `<div><a class="acc-lnk" data-act="peek" data-sid="${s.id}">${srcText}</a></div>`
                : `<div class="muted" style="font-size:12px">${srcText}</div>`
            const check =
              latest && latest.check
                ? `<div>${esc(latest.check)}</div>${src}`
                : `<span class="muted">${latest ? '智能体没有写自检结论' : '智能体还没有回写'}</span>`
            // 验收中往会话里说了一句：会话回到工作中，任务仍是待验收。
            const asked = this.treeSessions(t).find(
              (x) => x.askedInReview && x.state === 'working' && !this.offline(t)
            )
            return `<div class="accept" data-anchor="accept">
        ${asked ? `<div class="acc-ask" data-act="peek" data-sid="${asked.id}">${stateDot('working', 12)}<span>${asked.agent} 工作中 · 你在验收中发了一句</span></div>` : ''}
        <div class="acc-h">${statusIcon('review')}等你验收<span class="time">${t.merge ? `PR 合并后进入待验收 · ${t.merge.time}` : '你手动改成了待验收'}</span></div>
        <div class="acc-kv"><span class="k">合入位置</span><div class="v"><div class="line">${t.merge ? `${ic('git-merge', 's14')}<span>PR #${t.merge.pr} 已合并到 <span class="mono">${t.merge.into}</span></span>` : `${ic('git-branch', 's14')}<span class="muted">还没有 PR</span>`}</div></div></div>
        <div class="acc-kv"><span class="k">改动</span><div class="v"><div class="line">${diff}</div></div></div>
        <div class="acc-kv"><span class="k">自检</span><div class="v" style="gap:2px">${check}</div></div>
        <div class="acc-kv"><span class="k">在哪验收</span><div class="v">${t.acceptNote ? esc(t.acceptNote) : '<span class="muted">项目没有写验收说明</span>'}</div></div>
        <div class="acc-acts"><button class="btn lg flex1" data-act="reject-open" data-id="${t.id}">${ic('undo-2')}打回</button><button class="btn lg primary flex1" data-act="pass" data-id="${t.id}">${ic('check')}通过</button></div>
      </div>`
          }
          vResult(t) {
            const r = t.result
            if (!r) return ''
            if (r.kind === 'pass')
              return `<div class="result-band">${ic('circle-check')}<div><div>你通过了验收 · 刚刚</div><div class="s">任务移到完成。会话不受影响，要收尾可以在会话里接着说。</div></div></div>`
            return `<div class="result-band">${ic('undo-2', 'c-q')}<div><div>已打回 · 刚刚</div><div class="s">原因记成评论${r.agent ? `，并作为下一句指令发给 ${r.agent}` : ''}。</div>${r.agent ? `<div class="dlv" style="margin-top:4px">${ic('check-check')}已送达 · 刚刚</div>` : ''}</div></div>`
          }
          // 工作区一行：工作区 · 主机 · 改动 · PR，没有的项不显示；点开有「打开工作区」「查看更改」。
          vWsLine(t) {
            const w = this.taskWs(t)
            if (!w) return `<div class="ws-line faint">${ic('git-branch', 's12')}还没有工作区</div>`
            const h = this.wsHost(w)
            const off = !h.online
            const parts = [
              ['', `<b>${w.name}</b>`],
              [
                off ? 'c-unv' : '',
                `${off ? stateDot('unverifiable', 10) : '<span class="host-dot"></span>'}${h.name}${off ? ' 未连接' : ''}`
              ]
            ]
            if (w.diff)
              parts.push([
                '',
                `${w.diff.files} 文件 <span class="c-ok">+${w.diff.add}</span> <span class="c-del">−${w.diff.del}</span>`
              ])
            if (w.pr) parts.push(['', `${ic('git-merge', 's12')}${esc(w.pr.note)}`])
            if (t.parent) parts.push(['faint', '用上级的'])
            // The dot travels with its item so a wrapped line never starts with a separator.
            return `<div class="ws-line" data-act="ws-open" data-id="${t.id}">${ic('git-branch', 's12')}${parts.map(([cls, inner], i) => `<span class="i ${cls}">${i ? '<span class="sep">·</span>' : ''}${inner}</span>`).join('')}</div>`
          }
          // 一个主按钮，按状态变：没有工作区 → 开始做；有工作区且不是待验收 → 开会话；待验收 → 验收；完成 / 取消 → 没有。
          vPrimary(t, w, h, off) {
            if (t.status === 'done' || t.status === 'canceled') return ''
            if (!w)
              return `<button class="btn primary" data-act="startwork-open" data-id="${t.id}">${ic('play')}开始做</button>`
            if (t.status === 'review')
              return `<button class="btn primary" data-act="scroll-accept" data-id="${t.id}">${ic('check')}验收</button>`
            return `<button class="btn primary" data-act="start-open" data-id="${t.id}" ${off ? 'disabled' : ''}>${ic('plus')}开会话</button>${off ? `<span class="faint" style="font-size:12px;align-self:center">${h.name} 未连接，恢复联系后才能开</span>` : ''}`
          }
          // 「现在」卡：待验收的验收条在最上面，然后是在等你什么、最新进展、每个会话一行。
          vNowCard(t, w, h, off) {
            const ses = this.treeSessions(t)
            const p = t.progress[0]
            const waiting = ses.find((s) => s.state === 'waiting' && !off)
            const accept = t.status === 'review' ? this.vAccept(t) : this.vResult(t)
            const wait = waiting
              ? `<div class="now-wait">${ic('message-circle-question', 's14')}<div class="row-main"><div><b>${waiting.agent} 在等你回答：</b>${esc(waiting.last)}</div></div><button class="btn sm" data-act="peek" data-sid="${waiting.id}">${ic('eye')}速览</button></div>`
              : ''
            const hasContent = ses.some(
              (s) => (s.term && s.term.length) || (s.chat && s.chat.length) || s.last
            )
            let latest = ''
            if (p || hasContent) {
              const s = p && p.session && this.ses(p.session)
              const src = !p
                ? '<span class="ell">还没有回写</span>'
                : p.source === 'orca'
                  ? `<span class="badge gen">${ic('sparkles', 's10')}Orca 生成</span><span class="ell">读了 ${s ? s.agent : ''} 的会话记录 · ${p.time}</span>`
                  : `<span class="badge">回写 #${p.n}</span><span class="ell">${s ? s.agent : ''} · ${p.time}${off ? ' · 上次读到' : ''}</span>`
              const needs = p && t.status !== 'review' ? this.needsOf(t, p) : ''
              const all = this.s.ui.allProgress[t.id]
              const older = t.progress.slice(1)
              const running = this.s.ui.genRunning[t.id]
              const allBtn = t.progress.length
                ? `<button data-act="all-progress" data-id="${t.id}" ${older.length ? '' : 'disabled'}>${ic(all ? 'chevron-up' : 'list')}${all ? '收起' : `全部进展 ${t.progress.length}`}</button>`
                : ''
              const genBtn = hasContent
                ? `<button class="gen-btn" data-act="gen-summary" data-id="${t.id}" ${!off && !running ? '' : 'disabled'}>${running ? `${spinner(14)}生成中…` : `${ic('sparkles')}生成摘要`}</button>`
                : ''
              latest = `<div class="now-latest" data-anchor="prog">
          <div class="pc-h"><span class="t">最新进展</span></div>
          <div class="pc-src">${src}</div>
          ${p ? `<div class="pc-text">${esc(p.text)}</div>` : ''}
          ${needs ? `<div class="pc-kv"><span class="k">需要你什么</span><span class="v">${esc(needs)}</span></div>` : ''}
          ${all && older.length ? `<div class="pc-all"><div class="pc-older">更早的进展</div>${older.map((x) => `<div class="pc-item"><div class="h">${x.source === 'orca' ? `<span style="color:var(--ai-action-accent)">${ic('sparkles', 's10')} Orca 生成</span>` : `回写 #${x.n}`}<span class="time">${x.time}</span></div><div class="b">${esc(x.text + (this.needsOf(t, x) || ''))}</div></div>`).join('')}</div>` : ''}
          ${allBtn || genBtn ? `<div class="pc-acts">${allBtn}${genBtn}</div>` : ''}
        </div>`
            }
            const rows = ses.map((s) => {
              const info = this.sesInfo(s)
              const owner = this.task(s.task)
              const last = s === waiting ? '' : s.last || '会话已启动 · 等第一条回写'
              return `<div class="ses-row" data-act="peek" data-sid="${s.id}">${stateDot(info.dot, 16)}<div class="row-main">
          <div class="l1">${s.agent}<span class="kind">${s.view === 'chat' ? '聊天' : '终端'}</span>${owner.id !== t.id ? `<span class="sub-tag">${ic('corner-down-right', 's10')}${esc(owner.title)}</span>` : ''}<span class="stt ${info.cls}">${info.text}</span></div>
          ${last ? `<div class="l2">${esc(last)}</div>` : ''}</div>${ic('chevron-right', 's14 chev')}</div>`
            })
            const offNote =
              off && p
                ? `<div class="now-off">${stateDot('unverifiable', 12)}${h.name} 未连接 · ${h.lost} · 这是断开前最后读到的内容</div>`
                : ''
            const body =
              !ses.length && !p
                ? '<div class="ses-empty">还没有会话</div>'
                : `${wait}${latest}${offNote}${rows.length ? `<div class="now-ses" data-anchor="sessions">${rows.join('')}</div>` : ''}`
            return `<div class="now-card ${waiting ? 'waiting' : ''}"><div class="now-h">${ic('circle-dot', 's12')}现在</div>${accept}${body}</div>`
          }
          vTask(id) {
            const t = this.task(id)
            const w = this.taskWs(t)
            const h = w && this.wsHost(w)
            const off = this.offline(t)
            const p = this.proj(t.project)
            const pt = t.parent && this.task(t.parent)
            const kids = (t.children || []).map((c) => this.task(c)).filter(Boolean)
            const chips = [
              `<span class="chip" data-act="status-open" data-id="${t.id}">${statusIcon(t.status, 12)}${STATUS_NAME[t.status]}${ic('chevron-down', 's10')}</span>`,
              t.priority
                ? `<span class="chip">${prioMark(t.priority)}${PRIO_NAME[t.priority]}</span>`
                : '',
              t.labels && t.labels.length
                ? `<span class="chip">${ic('tag')}${t.labels.join('、')}</span>`
                : '',
              pt
                ? `<span class="chip" data-act="open-task" data-id="${pt.id}">${ic('corner-down-right')}${esc(pt.title)}</span>`
                : '',
              t.goal ? `<span class="chip">${ic('target')}目标</span>` : ''
            ]
              .filter(Boolean)
              .join('')
            const acts = this.vPrimary(t, w, h, off)
            const adds = [t.desc ? '' : '添加描述', kids.length ? '' : '添加子任务'].filter(Boolean)
            const sys = t.timeline.filter((x) => x.sys)
            const open = this.s.ui.sysOpen[t.id]
            const tl = t.timeline
              .filter((x) => open || !x.sys)
              .map((x) => this.vTimelineItem(x))
              .join('')
            return `${navbar({ back: '任务', title: `${statusIcon(t.status, 14)}<span class="mono">${t.id}</span>`, right: `<button class="icon-btn" data-act="more-open" data-id="${t.id}" aria-label="更多">${ic('ellipsis')}</button>` })}
      <div class="scroll">
        <div class="d-head">
          <div class="d-crumb">${ic('layers', 's12')}${p.name}</div>
          <div class="d-title ${t.freshTitle && !SHOT ? 'fresh' : ''}">${esc(t.title)}</div>
          <div class="chips">${chips}</div>
          ${this.vWsLine(t)}
          ${acts ? `<div class="d-acts">${acts}</div>` : ''}
        </div>
        ${off ? `<div class="d-sec" style="margin-top:14px"><div class="offline-band">${stateDot('unverifiable', 14)}<div><div>${h.name} 未连接 · ${h.lost}</div><div class="s">下面是上次读到的内容。开会话、速览、回复都要等它恢复联系；恢复后只重读一次，不会自己重连。</div></div></div></div>` : ''}
        <div class="d-sec" style="margin-top:14px">${this.vNowCard(t, w, h, off)}</div>
        ${t.desc ? `<div class="d-sec" data-anchor="desc"><div class="d-sec-h">描述</div><div class="d-desc">${esc(t.desc)}</div></div>` : ''}
        ${
          kids.length
            ? `<div class="d-sec"><div class="d-sec-h">子任务<span class="n">${kids.length}</span></div>
          <div class="card">${kids
            .map((k) => {
              const ks = this.sessionsOf(k.id)[0]
              return `<div class="ses-row" data-act="open-task" data-id="${k.id}">${statusIcon(k.status)}<div class="row-main"><div class="l1"><span class="ell">${esc(k.title)}</span><span class="tid">${k.id}</span></div><div class="l3">${ks ? `${stateDot(this.sesInfo(ks).dot, 12)}${ks.agent} ${this.sesInfo(ks).text}` : '还没有会话'}</div></div>${ic('chevron-right', 's14 chev')}</div>`
            })
            .join('')}</div></div>`
            : ''
        }
        ${adds.length ? `<div class="d-sec add-row">${adds.map((a) => `<a class="add-link" data-act="soon">${ic('plus', 's12')}${a}</a>`).join('')}</div>` : ''}
        <div class="d-sec" data-anchor="timeline"><div class="d-sec-h">动态</div>
          <div class="tl">${sys.length ? `<div class="tl-item sys-row" data-act="sys-toggle" data-id="${t.id}">${ic(open ? 'chevron-down' : 'chevron-right', 's12')}系统记录 ${sys.length} · ${open ? '收起' : '展开'}</div>` : ''}${tl}</div>
          <div class="cmt"><textarea data-k="cmt-${t.id}" data-enter="comment" data-id="${t.id}" rows="1" placeholder="写评论…">${esc(this.s.ui.comment[t.id] || '')}</textarea><button class="send-btn ${this.s.ui.comment[t.id] ? 'on' : ''}" data-act="comment" data-id="${t.id}" data-needs="cmt-${t.id}" aria-label="发送">${ic('send')}</button></div>
          <div class="dates-line">${t.createdAt ? `创建于 ${t.createdAt} · ` : ''}更新于 ${t.updated}</div>
        </div>
        <div class="pad-bottom"></div>
      </div>`
          }
          // 「…」：设为目标（聊天型会话置灰并写原因）、取消任务、删除任务、复制链接、改标题。
          vMoreSheet(sh) {
            const t = this.task(sh.tid)
            const live = this.treeSessions(t).filter((s) => s.state !== 'ended')
            const guard = !this.offline(t) && live.some((s) => s.view === 'terminal')
            const goalWhy =
              t.goal || guard
                ? ''
                : live.length && live.every((s) => s.view === 'chat')
                  ? '聊天型会话不能当守卫'
                  : live.length
                    ? '要有在联系的终端会话'
                    : '还没有会话'
            const ended = t.status === 'done' || t.status === 'canceled'
            const row = (
              act,
              icon,
              label,
              { dis = false, sub = '', danger = false, msg = '' } = {}
            ) =>
              `<button class="more-row ${danger ? 'danger' : ''}" data-act="${act}" data-id="${t.id}" ${msg ? `data-msg="${esc(msg)}"` : ''} ${dis ? 'disabled' : ''}>${ic(icon)}<span>${label}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</button>`
            return `<div class="sheet"><div class="grabber"></div>
        <div class="sheet-head"><div><h2>${esc(t.title)}</h2><div class="sub"><span class="tid">${t.id}</span></div></div><button class="close-x" data-act="close-sheet">${ic('x')}</button></div>
        <div class="sheet-body" style="padding-bottom:12px"><div class="card" style="margin:0">
          ${row('goal-open', 'target', t.goal ? '已设为目标' : '设为目标', { dis: !!goalWhy || !!t.goal, sub: goalWhy })}
          ${ended || t.status === 'review' ? '' : row('accept-open', 'check', '提前验收…')}
          ${row('soon-msg', 'circle-x', '取消任务', { danger: true, dis: t.status === 'canceled', sub: live.length ? `${live.length} 个会话在跑` : '', msg: '取消任务：和桌面一样会问要不要停会话' })}
          ${row('soon-msg', 'x', '删除任务', { danger: true, msg: '删除任务：和取消一样会问要不要停会话' })}
          ${row('soon-msg', 'link', '复制链接', { msg: '已复制任务链接' })}
          ${row('soon-msg', 'pencil', '改标题', { msg: '改标题：沿用现有的标题编辑' })}
        </div></div>
        <div class="sheet-foot"><button class="btn lg flex1" data-act="close-sheet">关闭</button></div></div>`
          }
          vStatusSheet(sh) {
            const t = this.task(sh.tid)
            return `<div class="sheet"><div class="grabber"></div>
        <div class="sheet-head"><div><h2>改状态</h2><div class="sub">「${esc(t.title)}」</div></div><button class="close-x" data-act="close-sheet">${ic('x')}</button></div>
        <div class="sheet-body" style="padding-bottom:12px"><div class="card" style="margin:0">${Object.keys(
          STATUS_NAME
        )
          .map(
            (k) =>
              `<button class="more-row ${k === t.status ? 'on' : ''}" data-act="status-set" data-id="${t.id}" data-v="${k}">${statusIcon(k, 14)}<span>${STATUS_NAME[k]}</span>${k === t.status ? ic('check') : ''}</button>`
          )
          .join('')}</div></div>
        <div class="sheet-foot"><button class="btn lg flex1" data-act="close-sheet">关闭</button></div></div>`
          }
          vWsSheet(sh) {
            const t = this.task(sh.tid)
            const w = this.taskWs(t)
            const h = this.wsHost(w)
            const off = !h.online
            return `<div class="sheet"><div class="grabber"></div>
        <div class="sheet-head"><div><h2>${ic('git-branch', 's14')} ${w.repo}/${w.name}</h2><div class="sub">${h.name}${off ? ' 未连接，恢复联系后才能打开' : ''}</div></div><button class="close-x" data-act="close-sheet">${ic('x')}</button></div>
        <div class="sheet-body" style="padding-bottom:12px"><div class="card" style="margin:0">
          <button class="more-row" data-act="open-host" data-id="${h.via || h.id}" ${off ? 'disabled' : ''}>${ic('external-link')}<span>打开工作区</span></button>
          <button class="more-row" data-act="soon-msg" data-msg="查看更改：打开 diff 面板" ${off ? 'disabled' : ''}>${ic('file-diff')}<span>查看更改</span></button>
        </div></div>
        <div class="sheet-foot"><button class="btn lg flex1" data-act="close-sheet">关闭</button></div></div>`
          }

          // ---------- 会话页（打开完整会话） ----------
          vSession(sid) {
            const s = this.ses(sid)
            const t = this.task(s.task)
            const w = this.taskWs(t)
            const h = this.wsHost(w)
            const off = this.offline(t)
            const info = this.sesInfo(s)
            const content =
              s.view === 'chat'
                ? `<div class="scroll" style="padding:12px 16px"><div class="msgs">${s.chat.map((m) => this.vChatMsg(m, s)).join('')}${this.vTyping(s)}</div></div>`
                : `<div class="term s-term">${s.term.join('\n')}</div>`
            const opts = this.askOptions(s)
            const reply = this.s.sessReply || ''
            return `<div class="s-top"><button class="icon-btn" data-act="back" style="color:var(--foreground)">${ic('chevron-left', 's20')}</button>
        <div class="s-title"><div class="t">${w.name}</div><div class="m"><span class="host-dot ${off ? 'off' : ''}"></span>${h.name} · 1 个会话</div></div>
        ${soon('folder', '文件')}${soon('git-branch', '分支')}${soon('ellipsis', '更多')}</div>
      <div class="s-strip" data-act="open-task" data-id="${t.id}">${ic('list-todo', 's14 muted')}<span class="ttl">${esc(t.title)}</span>${stateDot(info.dot, 12)}<span class="${info.cls}">${info.text}</span></div>
      <div class="s-tabs"><div class="s-tab">${stateDot(info.dot, 12)}${s.agent}</div>${soon('plus', '新标签')}</div>
      ${content}
      ${
        s.view === 'chat'
          ? `<div class="s-input" style="padding-top:10px;flex-direction:column;align-items:stretch;gap:8px">${opts.length ? `<div class="peek-opts"><span>选一个，或在下面写：</span>${opts.map((o) => `<button class="btn sm" data-act="sess-opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''}<div class="reply-row"><textarea data-k="sess-reply" data-enter="sess-send" rows="1" placeholder="回复 ${s.agent}…" ${off ? 'disabled' : ''}>${esc(reply)}</textarea><button class="send-btn ${reply.trim() ? 'on' : ''}" data-act="sess-send" data-needs="sess-reply" aria-label="发送">${ic('send')}</button></div></div>`
          : `<div class="s-keys"><span>Esc</span><span>Tab</span><span>Enter</span><span>Shift+Tab</span><span>粘贴</span></div>
           <div class="s-input"><div class="box">${ic('keyboard', 's18')}<div><b>实时输入</b>点一下弹出键盘</div></div></div>`
      }`
          }
          // 等你回答的聊天：最后一条提问带的选项。
          askOptions(s) {
            const last = s.view === 'chat' && s.chat.length ? s.chat[s.chat.length - 1] : null
            return s.state === 'waiting' && this.canSend(s) && last && last.ask && last.options
              ? last.options
              : []
          }
          vTyping(s) {
            return s.state === 'working' && s.view === 'chat'
              ? `<div class="msg agent typing"><div class="bub muted">${stateDot('working', 12)} ${s.agent} 正在回复…</div></div>`
              : ''
          }
          vChatMsg(m, s) {
            if (m.who === 'tool')
              return `<div class="msg-tool">${ic('files', 's12')}${esc(m.text)}</div>`
            const who = m.who === 'me' ? '你' : s.agent
            return `<div class="msg ${m.who === 'me' ? 'me' : 'agent'} ${m.ask ? 'ask' : ''}"><div class="who">${who} · ${m.time}</div><div class="bub">${esc(m.text)}</div>${m.delivered ? `<div class="dlv">${ic('check-check')}已送达 · 刚刚</div>` : ''}</div>`
          }

          // ---------- 通用对话 ----------
          vProposal(p, mi) {
            const n = p.items.filter((i) => i.on).length
            const items = p.items
              .map((i) => {
                const w = this.ws(i.ws)
                const h = this.wsHost(w)
                const editing = p.editing === i.key
                const form = editing
                  ? `<div class="pp-form"><span class="lbl">标题</span><input data-k="pp-title-${i.key}" data-mi="${mi}" data-key="${i.key}" value="${esc(i.title)}">
            <span class="lbl">智能体</span><div class="seg">${['Claude', 'Codex'].map((a) => `<button class="${i.agent === a ? 'on' : ''}" data-act="pp-agent" data-mi="${mi}" data-key="${i.key}" data-agent="${a}">${a}</button>`).join('')}</div></div>`
                  : ''
                return `<div class="pp-item ${i.on ? '' : 'off'}">${p.done ? `<span class="cbox ${i.on ? 'on' : ''}" style="opacity:.6">${ic('check')}</span>` : `<button class="cbox ${i.on ? 'on' : ''}" data-act="pp-toggle" data-mi="${mi}" data-key="${i.key}" aria-label="勾选">${ic('check')}</button>`}
          <div class="pp-main"><div class="pp-title">${esc(i.title)}</div>
            <div class="pp-meta">${ic('folder-git-2', 's12')}<span class="mono">${w.repo}/${w.name}</span><span class="faint">·</span>${h.name}<span class="faint">·</span>${i.agent}</div>
            <div class="pp-prompt">第一句：${esc(i.prompt)}</div>${form}</div>
          ${p.done ? '' : `<button class="pp-edit" data-act="pp-edit" data-mi="${mi}" data-key="${i.key}" aria-label="修改">${ic(editing ? 'check' : 'pencil', 's14')}</button>`}</div>`
              })
              .join('')
            const foot = p.done
              ? `<div class="pp-done">${ic(p.cancelled ? 'x' : 'check', 's14')}${p.cancelled ? '已取消，没有新建任何东西' : `已确认，派出 ${n} 个任务`}</div>`
              : `<div class="pp-foot" style="flex-direction:column;align-items:stretch"><span class="note">只读查询直接做；建任务、开会话等你确认。设置里可以改成直接执行。</span>
            <div class="bb-row"><button class="btn" data-act="pp-cancel" data-mi="${mi}">取消</button><button class="btn primary flex1" data-act="pp-confirm" data-mi="${mi}" ${n ? '' : 'disabled'}>${ic('play')}确认派活${n ? ` ${n} 项` : ''}</button></div></div>`
            return `<div class="proposal" data-anchor="proposal"><div class="pp-h">${ic('sparkles')}提案 · ${p.items.length} 项<span class="aside">要新建的东西，等你确认</span></div>${items}${foot}</div>`
          }
          vChat() {
            const conv = this.conv(this.s.convId)
            const meta = this.histList().find((c) => c.id === conv.id)
            const msgs = conv.msgs
              .map((m, mi) => {
                if (m.type === 'me')
                  return `<div class="msg me"><div class="bub">${(m.chips || []).map((ch) => this.chipHTML(ch)).join(' ')} ${esc(m.text)}</div><div class="who">你 · ${m.time}</div></div>`
                if (m.type === 'thinking')
                  return `<div class="bot"><div class="bot-av">${ic('sparkles')}</div><div class="bot-main"><div class="bot-who"><b>调度</b>· Claude</div><span class="thinking">${spinner(14)}只读查询中：orca worktree list、PR 状态…</span></div></div>`
                if (m.type === 'cards')
                  return `<div style="display:flex;flex-direction:column;gap:8px">${m.keys.map((k) => this.vDisp(k)).join('')}</div>`
                return `<div class="bot"><div class="bot-av">${ic('sparkles')}</div><div class="bot-main"><div class="bot-who"><b>调度</b>· Claude · 跑在 MacBook Pro</div>
          ${m.ro ? `<div class="ro-list"><div class="h">${ic('eye', 's12')}只读查了这些，没改任何东西</div>${m.ro.map((x) => `<div class="li"><div><span class="${/^orca /.test(x.cmd) ? 'mono' : ''}">${esc(x.cmd)}</span><div class="out">${esc(x.out)}</div></div></div>`).join('')}${m.skipped ? `<div class="li skip"><div>${stateDot('unverifiable', 10)} ${esc(m.skipped)}</div></div>` : ''}</div>` : ''}
          ${m.text ? `<div class="bot-text">${esc(m.text)}</div>` : ''}
          ${m.proposal ? this.vProposal(m.proposal, mi) : ''}
          ${m.keys ? `<div style="display:flex;flex-direction:column;gap:8px">${m.keys.map((k) => this.vDisp(k)).join('')}</div>` : ''}</div></div>`
              })
              .join('')
            return `${navbar({ back: '任务', title: '对话', right: `<button class="icon-btn" data-act="history" aria-label="对话历史">${ic('clock')}</button><button class="icon-btn" data-act="new-conv" aria-label="新对话">${ic('plus')}</button>` })}
      <div class="scroll chat"><div class="chat-body">
        ${conv.msgs.length ? `<div class="day-sep">${meta ? `${meta.day} ${meta.time}` : '今天'}</div>${msgs}` : `<div class="day-sep" style="margin-top:40px">新对话。@ 一个工作区直接派活；不 @ 就交给调度智能体，先出方案。</div>`}
      </div></div>
      <div class="chat-dock">${this.vComposer('chat')}</div>`
          }

          // ---------- 新建任务 & 开始做（同一套「在哪做」「开工」） ----------
          vWhere(f, fk) {
            const seg = `<div class="seg">${[
              ['existing', '已有工作区'],
              ['new', '新建工作区'],
              ['later', '稍后再定']
            ]
              .map(
                ([k, n]) =>
                  `<button class="${f.where === k ? 'on' : ''}" data-act="f-where" data-form="${fk}" data-v="${k}">${n}</button>`
              )
              .join('')}</div>`
            let body = ''
            if (f.where === 'existing') {
              body = `<div class="ws-search">${ic('search', 's14')}<input data-k="${fk}-q" data-form="${fk}" placeholder="搜索工作区" value="${esc(f.q)}"></div>
          <div class="card" style="margin:0" data-wslist="${fk}">${this.vWsList(f, fk)}</div>`
            } else if (f.where === 'new') {
              const r = this.repo(f.repo)
              body = `<div class="card" style="margin:0">
          <div class="kv-pick" style="align-items:flex-start;padding-top:10px;padding-bottom:10px"><span class="k" style="padding-top:6px">仓库</span><div class="v">${this.d.repos
            .map((x) => {
              const h = this.host(x.host)
              return `<button class="opt ${f.repo === x.id ? 'on' : ''} ${h.online ? '' : 'dis'}" data-act="f-repo" data-form="${fk}" data-v="${x.id}">${ic('folder', 's12')}${x.id} · ${h.name}${h.online ? '' : ' 未连接'}</button>`
            })
            .join('')}</div></div>
          <div class="kv-pick"><span class="k">名称</span><div class="v"><input class="mono" style="font-size:13px;flex:1" data-k="${fk}-ws" data-form="${fk}" value="${esc(f.wsName)}"></div></div>
          <div class="kv-pick"><span class="k">基于</span><div class="v">${ic('git-branch', 's14 muted')}<span class="mono" style="font-size:13px">main</span><span class="faint" style="font-size:12px;margin-left:auto">${this.host(r.host).name} 上的 ${r.id}</span></div></div></div>
          <div class="note-line">${ic('info', 's14')}<span>用现有的新建工作区流程，在 ${this.host(r.host).name} 上建工作树。dbox 未连接，它的仓库现在不能选。</span></div>`
            } else {
              body =
                '<div class="later-note">只建任务，不绑工作区，也不开会话。之后在任务详情里点「开始做」。</div>'
            }
            return `${seg}${body}`
          }
          vWsList(f, fk) {
            const q = f.q.trim().toLowerCase()
            const proj = f.project
            const groups = [...this.d.repos]
              .sort((a, b) => (b.project === proj) - (a.project === proj))
              .map((r) => {
                const h = this.host(r.host)
                const rows = this.d.workspaces.filter(
                  (w) => w.repo === r.id && (!q || `${w.repo}/${w.name}`.includes(q))
                )
                if (!rows.length) return ''
                return (
                  `<div class="wgroup">${ic(h.kind === 'local' ? 'laptop' : 'server', 's12')}${r.id} · ${h.name}${h.online ? '' : `<span class="c-unv" style="margin-left:auto;font-weight:500">未连接</span>`}</div>` +
                  rows
                    .map((w) => {
                      const owner = w.task && this.task(w.task)
                      let sub = '空闲'
                      if (!h.online)
                        sub = `${stateDot('unverifiable', 10)}${h.name} 未连接 · ${h.lost}`
                      else if (owner) sub = `属于 ${owner.id} · 会建成它的子任务`
                      else if (w.pr) sub = w.pr.note
                      else if (w.primary) sub = '主工作区'
                      return `<div class="wpick ${h.online ? '' : 'dis'} ${f.pick === w.id ? 'on' : ''}" data-act="${h.online ? 'f-pick' : 'noop'}" data-form="${fk}" data-v="${w.id}"><span class="radio ${f.pick === w.id ? 'on' : ''}"></span><div class="row-main"><div class="mt">${w.name}</div><div class="ms">${sub}</div></div></div>`
                    })
                    .join('')
                )
              })
              .join('')
            return groups || '<div class="ses-empty">没有匹配的工作区</div>'
          }
          vKickoff(f, fk) {
            const disabled = f.where === 'later'
            const tile = (k, name, sub) =>
              `<button class="tile ${f.agent === k ? 'on' : ''}" data-act="f-agent" data-form="${fk}" data-v="${k}" ${disabled ? 'disabled' : ''}><span class="radio ${f.agent === k ? 'on' : ''}"></span><span class="tt">${k === 'none' ? ic('x', 's14') : ic('bot', 's14')}${name}</span><span class="ts">${sub}</span></button>`
            return `<div style="${disabled ? 'opacity:.4;pointer-events:none' : ''};display:flex;flex-direction:column;gap:10px">
        <div class="tiles">${tile('Claude', 'Claude', '默认智能体')}${tile('Codex', 'Codex', '')}${tile('none', '先不开', '只建任务和工作区')}</div>
        <div class="f-sub" style="padding:0;margin-top:2px"><div class="lbl">第一句指令</div><input class="field" data-k="${fk}-prompt" data-form="${fk}" value="${esc(f.prompt)}" ${f.agent === 'none' ? 'disabled' : ''}></div>
        <div class="send-mode">${ic('send')}<div><div class="t">直接发送<span class="lock">手机固定</span></div><div class="s">手机上没有「放进输入框」：主机不投递手机发起的草稿，放进去只会得到「没有送达」（D-010）。</div></div></div>
        <div class="note-line">${ic('info', 's14')}<span>会话启动时附上任务说明：编号、怎么回写进展、最多推进到待验收。设置里可以关。</span></div>
      </div>`
          }
          formSummary(f) {
            if (f.where === 'later')
              return { ok: !!f.title.trim(), label: '创建', hint: '只建任务，之后再开始做' }
            const agent = f.agent === 'none' ? null : f.agent
            if (f.where === 'existing') {
              const w = f.pick && this.ws(f.pick)
              if (!w)
                return { ok: false, label: agent ? '创建并开工' : '创建', hint: '选一个工作区' }
              const h = this.wsHost(w)
              return {
                ok: !!f.title.trim(),
                label: agent ? '创建并开工' : '创建',
                hint: `${w.task ? `作为 ${w.task} 的子任务，` : ''}在 ${w.name}（${h.name}）${agent ? `开 ${agent} 会话` : '绑定，不开会话'}`
              }
            }
            const r = this.repo(f.repo)
            return {
              ok: !!f.title.trim() && !!f.wsName.trim(),
              label: agent ? '创建并开工' : '创建',
              hint: `在 ${this.host(r.host).name} 新建工作区 ${f.wsName}${agent ? `，开 ${agent} 会话` : ''}`
            }
          }
          vNew() {
            const f = this.s.form
            const pick = f.where === 'existing' && f.pick && this.ws(f.pick)
            const project = pick
              ? this.repo(pick.repo).project
              : f.where === 'new'
                ? this.repo(f.repo).project
                : f.project
            const p = this.proj(project)
            const sum = this.formSummary(f)
            return `${navbar({ left: '<a class="nav-text-btn dim" data-act="back">取消</a>', title: '新建任务' })}
      <div class="scroll">
        <div class="f-step" data-anchor="step1" style="margin-top:6px"><span class="num">1</span>任务</div>
        <div class="f-proj"><button class="proj-pill" data-act="proj-open">${ic('layers')}${p.name}<span class="key">${p.key}</span>${ic('chevron-down')}</button><span class="faint" style="font-size:12px">将创建为 <span class="mono">${this.nextId(project)}</span>${pick || f.where === 'new' ? ' · 项目跟着仓库走' : ''}</span></div>
        <input class="f-title" data-k="f-title" data-form="new" placeholder="标题（必填）" value="${esc(f.title)}">
        <textarea class="f-desc" data-k="f-desc" data-form="new" rows="1" placeholder="描述（可选）">${esc(f.desc)}</textarea>
        <div class="f-step" data-anchor="step2"><span class="num">2</span>在哪做</div>
        <div class="f-block">${this.vWhere(f, 'new')}</div>
        <div class="f-step" data-anchor="step3"><span class="num">3</span>开工</div>
        <div class="f-block">${this.vKickoff(f, 'new')}</div>
        <div class="pad-bottom"></div>
      </div>
      <div class="bottom-bar"><div class="bb-hint" data-sum="hint">${ic('info', 's14')}<span>${esc(sum.hint)}</span></div>
        <button class="btn lg primary" data-act="create" data-sum="btn" ${sum.ok ? '' : 'disabled'}>${ic(sum.label === '创建' ? 'check' : 'play')}${sum.label}</button></div>`
          }

          // ---------- 主机页 ----------
          vHost(hid) {
            const h = this.host(hid)
            const repos = this.d.repos.filter((r) => {
              const rh = this.host(r.host)
              return rh.id === h.id || rh.via === h.id
            })
            const body = repos
              .map((r) => {
                const rh = this.host(r.host)
                const rows = this.d.workspaces
                  .filter((w) => w.repo === r.id)
                  .map((w) => {
                    const t = w.task && this.task(w.task)
                    const dots = t
                      ? this.treeSessions(t)
                          .map((s) => stateDot(this.sesInfo(s).dot, 14))
                          .join('')
                      : ''
                    return `<div class="hws" ${t ? `data-act="open-task" data-id="${t.id}"` : ''} style="${h.online ? '' : 'opacity:.55'}">${ic('folder-git-2', 's16 muted')}<div class="row-main"><div class="t">${w.name}</div>
            <div class="s">${t ? `${ic('list-todo', 's12')}<span class="ell" style="color:var(--foreground)">${esc(t.title)}</span><span class="tid">${t.id}</span>` : `<span class="faint">没有关联任务${w.pr ? ` · ${w.pr.note}` : ''}</span>`}</div></div><span style="display:inline-flex;gap:4px">${dots}</span></div>`
                  })
                  .join('')
                return `<div class="h-sec">${r.id}<span class="faint" style="font-weight:500">${this.d.workspaces.filter((w) => w.repo === r.id).length}</span><span class="aside">${ic(rh.kind === 'local' ? 'laptop' : 'server', 's12')}${rh.kind === 'ssh' ? `${rh.name}（SSH）` : rh.kind === 'local' ? '本机' : rh.name}</span></div><div class="card">${rows}</div>`
              })
              .join('')
