<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 宿主把 Orca 的设计 token 注进 :root,并给 <html> 挂 light/dark class
         (src/shared/plugins/plugin-panel-shell.ts)。只用白名单里那 20 个,并且都带兜底值 ——
         照 examples/plugins/hello-orca 的写法。自己定义同名变量会覆盖宿主的值,
         浅色宿主里就显示成暗色。

         版式照 Orca 内置右侧栏面板(checks-panel-content):12px 分区、border 分隔、
         11px 次要文字、bg-accent/20 信息块、到处 min-width:0。 */
      :root {
        --ok: #16a34a;
        --warn: #b45309;
        --r: calc(var(--radius, 0.625rem) * 0.6);
        --block: color-mix(in srgb, var(--accent, #eee) 20%, transparent);
      }
      html.dark {
        --ok: #4ade80;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
        min-width: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--background, transparent);
        color: var(--foreground, #ddd);
        font: 12px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-y: auto; /* iframe 是 h-full,面板文档自己滚 */
        overflow-x: hidden; /* 面板很窄,横向一律折行适配,不给滚动条 */
        overscroll-behavior: contain;
      }

      /* 滚动条照抄 main.css 的 .scrollbar-sleek —— 面板是独立文档,继承不到应用样式,
         不抄就是系统默认那根粗条,和 Orca 其它面板对不上。
         刻意不留 scrollbar-gutter:内容不满时不显示滚动条,右边不会空一条。 */
      body {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--muted-foreground, #737373) 34%, transparent) transparent;
      }
      body::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      body::-webkit-scrollbar-track {
        background: transparent;
      }
      body::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--muted-foreground, #737373) 28%, transparent);
        border: 3px solid transparent;
        border-radius: 0;
        background-clip: padding-box;
        min-height: 28px;
      }
      body::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in srgb, var(--muted-foreground, #737373) 48%, transparent);
      }
      body::-webkit-scrollbar-thumb:active {
        background-color: color-mix(in srgb, var(--foreground, #171717) 36%, transparent);
      }
      body:hover {
        scrollbar-color: color-mix(in srgb, var(--muted-foreground, #737373) 48%, transparent) transparent;
      }

      .sec {
        padding: 12px;
        border-bottom: 1px solid var(--border, #333);
      }
      .sec:last-child {
        border-bottom: 0;
      }
      .sec[hidden] {
        display: none;
      }
      .sec-label {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-bottom: 8px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .block {
        border-radius: var(--r);
        border: 1px solid var(--border, #333);
        background: var(--block);
        padding: 6px 10px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.45;
        word-break: break-all;
      }

      .title {
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .muted {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        word-break: break-word;
      }
      .clamp {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--muted-foreground, #999);
        flex: none;
      }
      .dot.run {
        background: var(--ok);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .dot.bad {
        background: var(--destructive, #e5484d);
      }
      .dot.warn {
        background: var(--warn);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      button.btn {
        font: inherit;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: var(--r);
        border: 1px solid var(--border, #555);
        background: transparent;
        color: var(--foreground, #ddd);
        cursor: pointer;
        flex: none;
      }
      button.btn:hover:not([disabled]) {
        background: var(--accent, #333);
        color: var(--accent-foreground, #fff);
      }
      button.btn.primary {
        background: var(--primary, #ddd);
        color: var(--primary-foreground, #111);
        border-color: transparent;
        font-weight: 500;
      }
      button.btn.wide {
        width: 100%;
        padding: 6px 9px;
        font-size: 12px;
      }
      button.btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      label.f {
        display: block;
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-bottom: 5px;
      }
      textarea,
      input.f {
        display: block;
        width: 100%;
        max-width: 100%;
        font: inherit;
        font-size: 11px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
        border: 1px solid var(--input, var(--border, #555));
        border-radius: var(--r);
        padding: 6px 8px;
        resize: vertical;
      }
      textarea:focus,
      input.f:focus {
        outline: none;
        border-color: var(--ring, var(--border, #777));
      }
      .hint {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-top: 5px;
        line-height: 1.45;
        word-break: break-word;
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--border, #555);
        border-radius: var(--r);
        padding: 2px;
        gap: 2px;
        flex: none;
      }
      .seg button {
        font: inherit;
        font-size: 11px;
        padding: 2px 10px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted-foreground, #999);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--primary, #ddd);
        color: var(--primary-foreground, #111);
        font-weight: 500;
      }

      details > summary {
        cursor: pointer;
        font-size: 11px;
        color: var(--muted-foreground, #999);
        list-style: none;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      details > summary::before {
        content: "▸";
        font-size: 9px;
      }
      details[open] > summary::before {
        content: "▾";
      }

      .tl-item {
        display: grid;
        grid-template-columns: 15px minmax(0, 1fr);
        gap: 8px;
        padding-bottom: 10px;
        position: relative;
      }
      .tl-item:last-child {
        padding-bottom: 0;
      }
      .tl-item:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 15px;
        bottom: 0;
        width: 1px;
        background: var(--border, #333);
      }
      .tl-dot {
        width: 15px;
        height: 15px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border, #333);
        background: var(--background, transparent);
        font-size: 8px;
        color: var(--muted-foreground, #999);
        z-index: 1;
      }
      .tl-dot.ok {
        border-color: color-mix(in srgb, var(--ok) 55%, transparent);
        color: var(--ok);
      }
      .tl-dot.bad {
        border-color: color-mix(in srgb, var(--destructive, #e5484d) 55%, transparent);
        color: var(--destructive, #e5484d);
      }
      .tl-dot.warn {
        border-color: color-mix(in srgb, var(--warn) 55%, transparent);
        color: var(--warn);
      }
      .tl-head {
        display: flex;
        align-items: baseline;
        gap: 7px;
      }
      .tl-turn {
        font-size: 11px;
        font-weight: 500;
      }
      .tl-time {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-left: auto;
        flex: none;
      }

      .files {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      .file {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--block);
        color: var(--muted-foreground, #999);
        max-width: 100%;
        word-break: break-all;
      }
      .flag {
        margin-top: 5px;
        padding: 5px 8px;
        border-radius: var(--r);
        font-size: 11px;
        line-height: 1.45;
        border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
        background: color-mix(in srgb, var(--warn) 8%, transparent);
        color: var(--warn);
        word-break: break-word;
      }
      .blocker {
        padding: 6px 10px;
        border-radius: var(--r);
        font-size: 11px;
        line-height: 1.5;
        border: 1px solid color-mix(in srgb, var(--destructive, #e5484d) 40%, transparent);
        background: color-mix(in srgb, var(--destructive, #e5484d) 8%, transparent);
        color: var(--destructive, #e5484d);
        word-break: break-word;
      }
      .blocker code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        word-break: break-all;
      }

      .empty {
        padding: 24px 12px;
        text-align: center;
        font-size: 11px;
        color: var(--muted-foreground, #999);
      }
    </style>
  </head>
  <body>
    <!-- 骨架是静态的。刷新只改下面这几个具名区域的内容,绝不重建整页 ——
         整页重建会把用户正在输入的目标和验收标准一起冲掉。 -->
    <div class="sec" id="blocker-sec" hidden>
      <p class="blocker" id="blocker"></p>
    </div>

    <div class="sec" id="status-sec" hidden>
      <div class="row">
        <div class="title"><span class="dot" id="status-dot"></span><span id="status-text"></span></div>
        <div class="grow"></div>
        <span id="actions"></span>
      </div>
      <div class="muted" id="status-facts" style="margin-top: 6px"></div>
      <div class="muted" id="status-reason"></div>
      <div class="muted" id="stale" hidden></div>
      <div class="muted clamp" id="status-objective" style="margin-top: 8px"></div>
    </div>

    <div class="sec" id="gate-sec" hidden>
      <div class="sec-label">验收</div>
      <div class="stack" id="gate-list"></div>
    </div>

    <div class="sec" id="rounds-sec" hidden>
      <div class="sec-label">逐轮记录</div>
      <div id="rounds"></div>
    </div>

    <p class="empty" id="empty" hidden>这个工作区还没有目标</p>

    <div id="form-region">
    <div class="sec">
      <div class="sec-label">新目标</div>
      <label class="f" for="objective">目标</label>
      <textarea id="objective" rows="4" placeholder="想让 agent 完成什么?写清楚「做完」是什么样子。"></textarea>
      <p class="hint">这段话每一轮都会原样重发,防止它把目标悄悄缩小。</p>
    </div>

    <div class="sec">
      <div class="row" style="margin-bottom: 6px">
        <label class="f" for="criteria" style="margin: 0">验收标准</label>
        <div class="grow"></div>
        <button class="btn" id="draft" disabled>✨ 从目标生成</button>
      </div>
      <textarea id="criteria" class="mono" rows="5" placeholder="什么算「做到了」?写具体到文件和行为。"></textarea>
      <div class="row" style="margin-top: 8px">
        <label class="f" style="margin: 0">裁判</label>
        <div class="grow"></div>
        <div class="seg" id="judge">
          <button data-agent="claude">claude</button>
          <button data-agent="codex" class="on">codex</button>
        </div>
      </div>
      <p class="hint">选一个和干活那个不同家族的模型 —— 同门的盲点是相关的。</p>
    </div>

    <div class="sec">
      <details>
        <summary>另外还要跑的命令</summary>
        <p class="hint">这些只证明「没弄坏」,证明不了「做到了」。</p>
        <input class="f mono" id="checks" placeholder="pnpm test" />
      </details>
    </div>

    <div class="sec">
      <button class="btn primary wide" id="start" disabled>在当前终端上开始</button>
      <p class="hint">面板起不了后台循环,命令又不能带参数 —— 现在请用 <span class="mono">orca-goal start</span>。</p>
    </div>
    </div>

    <script>
      'use strict'
      // —— 面板 ↔ 宿主的桥。协议见 src/shared/plugins/plugin-panel-bridge.ts ——
      // 照 hello-orca 的契约:永远 resolve,返回 { ok, value, errorCode, error },
      // 调用方查 ok。这样不会产生未处理的 rejection。
      var seq = 0
      var pending = {}

      // 宿主在面板会话被替换时会直接不回消息(plugin-panel-bridge-host 的 respond 有这条早退),
      // 没有超时的话这个 Promise 永远悬着、pending 每 4 秒漏一条,界面则一直停在旧数据上不吭声。
      var CALL_TIMEOUT_MS = 12000

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          var timer = setTimeout(function () {
            delete pending[requestId]
            resolve({ ok: false, errorCode: 'no_response' })
          }, CALL_TIMEOUT_MS)
          pending[requestId] = function (data) {
            clearTimeout(timer)
            resolve(data)
          }
          // 面板是 opaque origin,targetOrigin 只能用 '*';宿主改为校验发送方窗口。
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        var data = event.data
        if (!data || data.type !== 'orca-panel-action-result') return
        var resolve = pending[data.requestId]
        if (!resolve) return
        delete pending[data.requestId]
        resolve(data)
      })

      var el = {}
      ;[
        'blocker-sec', 'blocker', 'status-sec', 'status-dot', 'status-text', 'status-facts',
        'status-reason', 'stale', 'status-objective', 'actions', 'gate-sec', 'gate-list', 'rounds-sec',
        'rounds', 'empty', 'judge', 'form-region'
      ].forEach(function (id) {
        el[id] = document.getElementById(id)
      })

      // 状态 → 界面。每个状态显示什么、给哪些操作、收不收表单,全在这一张表里,
      // 免得又变成「不管什么状态都摆一个禁用的开始按钮」。
      // 操作都还点不了(面板起不了后台循环),但按状态显示才说得清该做什么。
      var VIEW = {
        active: { label: '进行中', tone: 'run', form: false, actions: ['stop'] },
        // 记录写着 active 但驱动没了:能做的是接回,不是停止 —— 没东西可停。
        orphaned: { label: '中断了(驱动已退出)', tone: 'bad', form: false, actions: ['resume', 'forget'] },
        complete: { label: '目标达成', tone: 'ok', form: true, actions: ['log', 'forget'] },
        blocked: { label: '受阻', tone: 'bad', form: true, actions: ['resume', 'log', 'forget'] },
        budget_exhausted: { label: '预算耗尽', tone: 'warn', form: true, actions: ['resume', 'log', 'forget'] },
        stalled: { label: '空转', tone: 'warn', form: true, actions: ['resume', 'log', 'forget'] },
        aborted: { label: '人为中断', tone: '', form: true, actions: ['resume', 'forget'] }
      }
      var ACTION_LABEL = { stop: '停止', resume: '接着跑', log: '看日志', forget: '清除记录' }
      // 面板做不了的事,提示里说清用哪条命令,而不是给一个点不动的按钮就完事。
      var ACTION_CLI = {
        stop: 'orca-goal stop --terminal ',
        resume: 'orca-goal resume --terminal ',
        log: 'orca-goal watch --terminal ',
        forget: 'orca-goal forget --terminal '
      }

      /**
       * 正在跑第几轮。日志是一轮结束才写的,所以「最后记录的轮次」和「正在跑的轮次」
       * 差一轮还是同一轮,取决于当前这轮有没有写进日志。顶部统计和时间线必须用同一个
       * 计算,否则会出现「顶部说第 6 轮、时间线说第 7 轮」这种自相矛盾。
       */
      function currentTurn(g) {
        var rounds = g.rounds || []
        var logged = rounds.length ? rounds[rounds.length - 1].turn : 0
        return g.turns === logged ? g.turns + 1 : g.turns
      }

      function viewOf(g) {
        if (g.state === 'active' && g.driverAlive === false) {
          return VIEW.orphaned
        }
        return VIEW[g.state] || { label: g.state, tone: '', form: true, actions: [] }
      }

      function ago(ts) {
        if (!ts) return ''
        var m = Math.round((Date.now() - ts) / 60000)
        if (m < 1) return '刚刚'
        return m < 60 ? m + ' 分钟前' : Math.round(m / 60) + ' 小时前'
      }

      function node(tag, cls, text) {
        var n = document.createElement(tag)
        if (cls) n.className = cls
        if (text != null) n.textContent = text
        return n
      }

      function renderGate(commands) {
        el['gate-list'].textContent = ''
        if (!commands.length) {
          el['gate-list'].appendChild(node('div', 'muted', '没有配验收 —— 它说做完了就是做完了'))
          return
        }
        commands.forEach(function (c) {
          el['gate-list'].appendChild(node('div', 'block mono', c))
        })
      }

      // 每轮注入的是哪种提示词 —— 这是「守卫做了什么」最直接的证据。
      var INJECTED = {
        continuation: '续跑',
        'rejected-completion': '验收驳回后重试',
        'tamper-challenge': '被质证削弱验收'
      }

      function roundItem(r, inProgress) {
        var claim = r.claim && r.claim.kind
        var tone = inProgress
          ? 'run'
          : r.acceptancePassed === false
            ? 'bad'
            : r.acceptancePassed === true
              ? 'ok'
              : claim
                ? 'warn'
                : ''
        var icon = inProgress ? '' : r.acceptancePassed === false ? '✕' : r.acceptancePassed === true ? '✓' : ''
        var item = node('div', 'tl-item')
        item.appendChild(node('div', 'tl-dot ' + tone, icon))

        var main = node('div')
        var head = node('div', 'tl-head')
        head.appendChild(node('span', 'tl-turn', '第 ' + r.turn + ' 轮'))
        head.appendChild(node('span', 'tl-time', inProgress ? '进行中' : ago(Date.parse(r.at))))
        main.appendChild(head)

        if (inProgress) {
          main.appendChild(node('div', 'muted', '已注入' + (INJECTED[r.prompt] || '续跑') + ',等 agent 跑完这一轮'))
        } else if (INJECTED[r.prompt]) {
          main.appendChild(node('div', 'muted', '注入:' + INJECTED[r.prompt]))
        }

        // agent 这一轮实际改了什么。与它自己的叙述无关的地面真相。
        var changed = r.changed || { source: [], test: [] }
        var total = changed.source.length + changed.test.length
        if (!inProgress) {
          if (total === 0) {
            main.appendChild(node('div', 'muted', '没有产生文件改动'))
          } else {
            main.appendChild(
              node('div', 'muted', '改了 ' + total + ' 个文件' + (changed.test.length ? '(含 ' + changed.test.length + ' 个测试)' : ''))
            )
            var files = node('div', 'files')
            changed.source.concat(changed.test).slice(0, 6).forEach(function (f) {
              files.appendChild(node('span', 'file', f))
            })
            if (total > 6) {
              files.appendChild(node('span', 'file', '+' + (total - 6)))
            }
            main.appendChild(files)
          }
        }

        // 守卫这一轮的动作
        if (claim === 'complete') {
          main.appendChild(
            node('div', 'muted', r.acceptancePassed === false
              ? '声称完成 → 验收未通过,已把失败原文打回'
              : r.acceptancePassed === true
                ? '声称完成 → 验收通过'
                : '声称完成(未配验收)')
          )
        }
        if (claim === 'blocked') {
          main.appendChild(node('div', 'muted', '声称受阻:' + (r.claim.summary || '')))
        }
        ;(r.findings || [])
          .filter(function (f) { return f.challenge })
          .forEach(function (f) {
            main.appendChild(node('div', 'flag', '⚑ ' + f.label + ':' + f.detail))
          })

        item.appendChild(main)
        return item
      }

      function renderRounds(rounds, goal) {
        el.rounds.textContent = ''
        // 正在跑的那一轮日志里还没有(日志是一轮结束才写的),但用户最想看的就是它。
        var running = goal.state === 'active' && goal.driverAlive !== false
        if (running) {
          // 下一轮注入哪种提示词由上一轮的结果决定,面板据此推断,和驱动的逻辑一致。
          var last = rounds.length ? rounds[rounds.length - 1] : null
          var nextPrompt = 'continuation'
          if (last && last.claim && last.claim.kind === 'complete' && last.acceptancePassed === false) {
            nextPrompt = 'rejected-completion'
          }
          el.rounds.appendChild(roundItem({ turn: currentTurn(goal), prompt: nextPrompt }, true))
        }
        rounds
          .slice()
          .reverse()
          .forEach(function (r) {
            el.rounds.appendChild(roundItem(r, false))
          })
      }

      function renderGoal(g) {
        var b = g.budget || {}
        var mins = Math.round((Date.now() - g.startedAt) / 60000)
        // 跑着的时候顶部要显示「正在跑第几轮」,和时间线里那条进行中对齐;
        // 停了就显示「一共跑了几轮」。两处口径不一致会让人以为数字错了。
        var running = g.state === 'active' && g.driverAlive !== false
        var facts = [
          (running ? '正在跑第 ' + currentTurn(g) : '共 ' + g.turns) + ' 轮' +
            (b.maxTurns ? ' / ' + b.maxTurns : ''),
          mins + ' 分钟' + (b.maxMinutes ? ' / ' + b.maxMinutes : '')
        ]
        if (g.falseClaims) facts.push('假完成 ' + g.falseClaims + ' 次')
        if (g.tamperChallenges) facts.push('挡回 ' + g.tamperChallenges + ' 次')

        var view = viewOf(g)
        el['status-dot'].className = 'dot ' + view.tone
        el['status-text'].textContent = view.label
        el['status-facts'].textContent = facts.join(' · ')
        el['status-reason'].textContent = g.finishReason || ''
        el['status-objective'].textContent = g.objective
        el['status-sec'].hidden = false

        el.actions.textContent = ''
        view.actions.forEach(function (name) {
          var btn = node('button', 'btn', ACTION_LABEL[name])
          btn.dataset.action = name
          btn.title = ACTION_CLI[name] + (g.terminalHandle || '')
          el.actions.appendChild(btn)
        })
        // 已经有目标占着这个终端时,不该还摆着「再开一个」的表单。
        el['form-region'].hidden = !view.form

        renderGate((g.acceptance && g.acceptance.commands) || [])
        el['gate-sec'].hidden = false

        var rounds = g.rounds || []
        renderRounds(rounds, g)
        el['rounds-sec'].hidden = el.rounds.children.length === 0
      }

      function refresh() {
        // storage.get 返回 { value: <存进去的东西> },面板桥又包一层 value,要剥两层。
        call('storage.get', { key: 'goals' }).then(function (result) {
          if (!result.ok) {
            // 分开说:没人回复和被拒绝的处理方式完全不同,笼统一句「改 panel: true」会把人带偏。
            el.blocker.textContent = ''
            var b = node('b', null, '面板读不到数据。')
            el.blocker.appendChild(b)
            if (result.errorCode === 'no_response') {
              b.textContent = '面板暂时收不到宿主回复。'
              el.blocker.appendChild(
                document.createTextNode('插件可能正在重载或已被停用,恢复后会自动接上。')
              )
            } else if (result.errorCode === 'panel_forbidden') {
              el.blocker.appendChild(
                document.createTextNode(
                  '宿主不允许面板调 storage.get(panel_forbidden)—— 需要 plugin-host-api.ts 里那处 panel: true。'
                )
              )
            } else {
              el.blocker.appendChild(
                document.createTextNode('宿主拒绝了 storage.get(' + (result.errorCode || '未说明') + ')。')
              )
            }
            el['blocker-sec'].hidden = false
            return
          }
          el['blocker-sec'].hidden = true
          var payload = result.value && result.value.value ? result.value.value : result.value
          var goals = (payload && payload.goals) || []
          var shown = null
          for (var i = 0; i < goals.length; i++) {
            if (goals[i].state === 'active') { shown = goals[i]; break }
          }
          if (!shown) shown = goals[0]

          if (shown) {
            renderGoal(shown)
            // worker 每分钟至少心跳一次,面板又没有任何叫醒它的办法(能调的只有 storage.get)。
            // 连丢三次心跳基本只剩「worker 没了」一种解释 —— 但这里只陈述观察到的事实,
            // 不替用户断定原因:说错原因比不说更误导。
            var age = payload && payload.updatedAt ? Date.now() - payload.updatedAt : 0
            // 只在面板正宣称「进行中」时才提示 —— 显示「中断了」时它自己已经把话说清楚了,
            // 再叠一条陈旧警告纯属噪音。
            var stale = viewOf(shown) === VIEW.active && age > 180000
            el.stale.hidden = !stale
            if (stale) {
              el.stale.textContent =
                '⚠ 后台已经 ' + Math.round(age / 60000) + ' 分钟没有回报状态,下面显示的是那时的快照。' +
                '目标可能仍在跑 —— 用 orca-goal status 看当前进度。'
            }
            el.empty.hidden = true
          } else {
            el['status-sec'].hidden = true
            el['gate-sec'].hidden = true
            el['rounds-sec'].hidden = true
            el.empty.hidden = false
            el['form-region'].hidden = false
          }
        })
      }

      el.actions.addEventListener('click', function (event) {
        var btn = event.target.closest('button[data-action]')
        if (!btn) return
        call('notifications.show', { title: '目标模式', body: '面板还做不了这个,请跑:' + btn.title })
      })

      el.judge.addEventListener('click', function (event) {
        var btn = event.target.closest('button[data-agent]')
        if (!btn) return
        Array.prototype.forEach.call(el.judge.querySelectorAll('button'), function (b) {
          b.classList.toggle('on', b === btn)
        })
      })

      refresh()
      setInterval(refresh, 4000)
    </script>
  </body>
</html>
