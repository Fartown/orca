<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca 以任务为主 · 手机原型</title>
    <style>
      /* Orca dark-theme tokens copied from src/renderer/src/assets/main.css (fork/integration @ cd5b6fca41).
   Tailwind palette values used by Orca are inlined so the prototype needs no build step. */
      @font-face {
        font-family: 'Geist';
        src: url('assets/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
      }
      :root {
        --font-sans:
          'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        --font-mono: 'SF Mono', ui-monospace, Menlo, Monaco, monospace;
        --radius: 0.625rem;
        --background: #0a0a0a;
        --editor-surface: #1e1e1e;
        --foreground: #fafafa;
        --card: #171717;
        --card-foreground: #fafafa;
        --popover: #171717;
        --popover-foreground: #fafafa;
        --primary: #e5e5e5;
        --primary-foreground: #171717;
        --secondary: #262626;
        --secondary-foreground: #fafafa;
        --muted: #262626;
        --muted-foreground: #a1a1a1;
        --accent: #404040;
        --accent-foreground: #fafafa;
        --border: rgb(255 255 255 / 0.07);
        --input: rgb(255 255 255 / 0.15);
        --ring: #737373;
        --destructive: #ff6568;
        --status-success: #86efac;
        --status-warning: #eab308;
        --callout-note: #4493f8;
        --callout-important: #ab7df8;
        --ai-action-accent: #a78bfa; /* violet-400 */
        --agent-working: #eab308; /* yellow-500 */
        --agent-question: #f97316; /* orange-500 */
        --agent-question-text: #fdba74; /* orange-300 */
        --agent-unverifiable: #f59e0b; /* amber-500 */
        --workspace-status-done: #c7a594;
        --workspace-status-review: #16a34a;
        --workspace-status-progress: #d4a300;
        --worktree-sidebar: #2a2a2a;
        --worktree-sidebar-accent: #353535;
        --sidebar: #171717;
        --sidebar-accent: #262626;
        --git-added: #81b88b;
        --git-modified: #e2c08d;
        --git-deleted: #c74e39;
        --diff-added-ground: color-mix(in srgb, #81b88b 16%, transparent);
        --diff-removed-ground: color-mix(in srgb, #c74e39 18%, transparent);
        /* STYLEGUIDE type scale: 10 / 11 / 12 / 13 / 14 px */
        --text-3xs: 10px;
        --text-2xs: 11px;
        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 14px;
        /* STYLEGUIDE: at most three shadow tiers */
        --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 12px rgb(0 0 0 / 0.35);
        --shadow-lg: 0 16px 48px rgb(0 0 0 / 0.5);
        /* Keyboard-selected row recipe (jump palette) */
        --row-selected: color-mix(in srgb, var(--foreground) 8%, transparent);
      }
    </style>
    <style>
      /* 「以任务为主」原型 · 手机。外壳沿用 v4 mobile.css；颜色、阴影只取 assets/tokens.css；字号 10–14px，页面主标题 18–20px。 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --fg-faint: color-mix(in srgb, var(--muted-foreground) 72%, transparent);
        --hover: color-mix(in srgb, var(--accent) 45%, transparent);
      }
      html,
      body {
        background: var(--editor-surface);
        color: var(--foreground);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        letter-spacing: 0.01em;
      }
      body {
        min-height: 100vh;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        outline: 0;
        letter-spacing: inherit;
      }
      button {
        cursor: pointer;
        text-align: inherit;
      }
      textarea {
        resize: none;
      }
      a {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .ic {
        width: 16px;
        height: 16px;
        flex: none;
        display: inline-block;
        vertical-align: middle;
      }
      .ic.s10 {
        width: 10px;
        height: 10px;
      }
      .ic.s12 {
        width: 12px;
        height: 12px;
      }
      .ic.s14 {
        width: 14px;
        height: 14px;
      }
      .ic.s18 {
        width: 18px;
        height: 18px;
      }
      .ic.s20 {
        width: 20px;
        height: 20px;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .muted {
        color: var(--muted-foreground);
      }
      .faint {
        color: var(--fg-faint);
      }
      .sp {
        flex: 1;
      }
      .ell {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .nowrap {
        white-space: nowrap;
        flex: none;
      }

      /* ---------- page chrome (not part of the phone) ---------- */
      .switcher {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }
      .sw-brand {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .sw-brand span {
        font-weight: 400;
        color: var(--muted-foreground);
        margin-left: 6px;
        font-size: 12px;
      }
      .sw-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .sw-tabs a {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        color: var(--muted-foreground);
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .sw-tabs a b {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 11px;
        margin-right: 4px;
        color: var(--fg-faint);
      }
      .sw-tabs a:hover {
        background: var(--hover);
        color: var(--foreground);
      }
      .sw-tabs a.on {
        background: var(--secondary);
        color: var(--foreground);
        border-color: var(--input);
      }
      .sw-tabs a.on b {
        color: var(--muted-foreground);
      }
      .sw-desc {
        font-size: 13px;
        color: var(--muted-foreground);
        padding: 12px 24px 0;
        text-align: center;
        line-height: 1.6;
        max-width: 1240px;
        margin: 0 auto;
      }
      #stage {
        display: flex;
        justify-content: safe center;
        padding: 16px 24px 32px;
      }
      .frames {
        display: flex;
        gap: 40px;
        align-items: flex-start;
        padding: 8px;
      }
      .device {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .device figcaption {
        font-size: 12px;
        color: var(--muted-foreground);
        max-width: 400px;
        text-align: center;
        line-height: 1.5;
      }
      .overview {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 48px 64px;
        zoom: 0.42;
      }
      .ov-screen h2 {
        font-size: 26px;
        font-weight: 600;
        margin: 0 0 14px 8px;
        color: var(--foreground);
      }
      .ov-screen h2 span {
        font-family: var(--font-mono);
        color: var(--muted-foreground);
        margin-right: 10px;
        font-weight: 500;
      }
      .ov-screen .frames {
        padding: 0;
      }

      /* ---------- phone hardware ---------- */
      .phone {
        width: 414px;
        height: 868px;
        padding: 12px;
        border-radius: 62px;
        background: black;
        box-shadow:
          0 0 0 1.5px var(--accent),
          var(--shadow-lg);
        flex: none;
      }
      .screen {
        position: relative;
        width: 390px;
        height: 844px;
        border-radius: 50px;
        overflow: hidden;
        background: var(--background);
        isolation: isolate;
      }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 124px;
        height: 36px;
        margin-left: -62px;
        border-radius: 20px;
        background: black;
        z-index: 90;
      }
      .statusbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 30px 0 52px;
        z-index: 30;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.2px;
        pointer-events: none;
      }
      .statusbar.on-card {
        background: var(--card);
      }
      .sb-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .home-ind {
        position: absolute;
        bottom: 8px;
        left: 50%;
        width: 134px;
        height: 5px;
        margin-left: -67px;
        border-radius: 3px;
        background: var(--foreground);
        z-index: 90;
        pointer-events: none;
      }
      .viewport {
        position: absolute;
        top: 54px;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
      }
      .overlay > * {
        pointer-events: auto;
      }
      .scroll {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
        position: relative;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .pad-bottom {
        height: 44px;
      }

      /* ---------- navigation ---------- */
      .navbar {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 6px;
        gap: 2px;
        position: relative;
      }
      .nav-back {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 8px 0 4px;
        font-size: 14px;
        color: var(--foreground);
        gap: 2px;
      }
      .nav-back .ic {
        width: 22px;
        height: 22px;
      }
      .nav-title {
        position: absolute;
        left: 96px;
        right: 96px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        pointer-events: none;
      }
      .nav-title .mono {
        font-size: 13px;
      }
      .nav-text-btn {
        height: 44px;
        padding: 0 10px;
        font-size: 14px;
        color: var(--foreground);
        display: inline-flex;
        align-items: center;
      }
      .nav-text-btn.dim {
        color: var(--muted-foreground);
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: inline-grid;
        place-items: center;
        color: var(--muted-foreground);
        flex: none;
      }
      .icon-btn .ic {
        width: 18px;
        height: 18px;
      }
      .icon-btn:hover {
        background: var(--hover);
      }

      /* ---------- surfaces ---------- */
      .card {
        margin: 0 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 10px 14px;
        position: relative;
        width: 100%;
      }
      .row + .row {
        border-top: 1px solid var(--border);
      }
      .row-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .row-title {
        font-size: 14px;
        font-weight: 500;
      }
      .row-sub {
        font-size: 12px;
        color: var(--muted-foreground);
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .chev {
        color: var(--fg-faint);
      }
      .icon-box {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--secondary);
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
        flex: none;
      }

      /* ---------- controls ---------- */
      .btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--secondary);
        color: var(--foreground);
        border: 1px solid var(--border);
        white-space: nowrap;
        flex: none;
      }
      .btn .ic {
        width: 14px;
        height: 14px;
        color: var(--muted-foreground);
      }
      .btn.sm {
        height: 28px;
        padding: 0 11px;
        font-size: 12px;
        gap: 5px;
      }
      .btn.sm .ic {
        width: 13px;
        height: 13px;
      }
      .btn.primary {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: transparent;
        font-weight: 600;
      }
      .btn.primary .ic {
        color: var(--primary-foreground);
      }
      .btn.lg {
        height: 46px;
        font-size: 14px;
        border-radius: 12px;
        padding: 0 16px;
        font-weight: 600;
      }
      .btn.lg .ic {
        width: 16px;
        height: 16px;
      }
      .btn.flex1 {
        flex: 1;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--muted-foreground);
      }
      .btn[disabled],
      .btn.off {
        opacity: 0.4;
        pointer-events: none;
      }
      .chip {
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--secondary);
        color: var(--foreground);
        border: 1px solid var(--border);
        white-space: nowrap;
        flex: none;
        max-width: 100%;
      }
      .chip .ic {
        width: 12px;
        height: 12px;
        color: var(--muted-foreground);
      }
      .chip.sm {
        height: 20px;
        padding: 0 7px;
        font-size: 11px;
        gap: 4px;
        font-weight: 500;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tid {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--fg-faint);
        white-space: nowrap;
        letter-spacing: -0.1px;
        font-weight: 400;
      }
      .seg {
        display: flex;
        background: var(--secondary);
        border-radius: 10px;
        padding: 2px;
        flex: none;
      }
      .seg button {
        flex: 1;
        height: 32px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-foreground);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        white-space: nowrap;
        text-align: center;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--foreground);
        box-shadow: var(--shadow-sm);
      }
      .toggle {
        width: 40px;
        height: 24px;
        border-radius: 12px;
        background: var(--accent);
        position: relative;
        flex: none;
      }
      .toggle::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 10px;
        background: var(--muted-foreground);
        box-shadow: var(--shadow-sm);
      }
      .toggle.on {
        background: var(--primary);
      }
      .toggle.on::after {
        left: 18px;
        background: var(--primary-foreground);
      }
      .radio {
        width: 18px;
        height: 18px;
        border-radius: 9px;
        border: 1.5px solid var(--input);
        flex: none;
        display: grid;
        place-items: center;
      }
      .radio.on {
        border-color: var(--primary);
      }
      .radio.on::after {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--primary);
      }
      .cbox {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.5px solid var(--input);
        flex: none;
        display: grid;
        place-items: center;
        color: var(--primary-foreground);
      }
      .cbox .ic {
        width: 13px;
        height: 13px;
        opacity: 0;
      }
      .cbox.on {
        background: var(--primary);
        border-color: var(--primary);
      }
      .cbox.on .ic {
        opacity: 1;
      }
      .field {
        width: 100%;
        min-height: 44px;
        padding: 11px 14px;
        border-radius: 12px;
        background: var(--secondary);
        border: 1px solid var(--border);
        font-size: 14px;
        line-height: 1.5;
        color: var(--foreground);
        display: block;
      }
      .field::placeholder,
      textarea::placeholder,
      input::placeholder {
        color: var(--fg-faint);
      }
      .field:focus {
        border-color: var(--ring);
      }
      .link {
        font-size: 12px;
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* ---------- status / agent marks ---------- */
      .st {
        flex: none;
        display: inline-block;
        vertical-align: middle;
      }
      .ag {
        display: inline-grid;
        place-items: center;
        flex: none;
        position: relative;
      }
      .ag .ic {
        width: 100%;
        height: 100%;
      }
      .ag.spin svg {
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .ag .dot-block {
        width: 58%;
        height: 58%;
        border-radius: 50%;
        background: var(--destructive);
      }
      .ag.unread::after {
        content: '';
        position: absolute;
        top: -2px;
        right: -3px;
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--callout-note);
        box-shadow: 0 0 0 1.5px var(--card);
      }
      .c-q {
        color: var(--agent-question-text);
      }
      .c-b {
        color: var(--destructive);
      }
      .c-ok {
        color: var(--status-success);
      }
      .c-w {
        color: var(--agent-working);
      }
      .c-unv {
        color: var(--agent-unverifiable);
      }
      .host-dot {
        width: 7px;
        height: 7px;
        border-radius: 4px;
        background: var(--status-success);
        display: inline-block;
        flex: none;
      }
      .host-dot.off {
        background: var(--ring);
      }

      /* ---------- sheets, toasts ---------- */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 0.55);
        z-index: 40;
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: var(--popover);
        border-top: 1px solid var(--input);
        border-radius: 16px 16px 0 0;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        max-height: 760px;
      }
      .sheet.tall {
        height: 700px;
      }
      .grabber {
        width: 36px;
        height: 5px;
        border-radius: 3px;
        background: var(--accent);
        margin: 6px auto 0;
        flex: none;
      }
      .sheet-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 16px 12px;
        flex: none;
      }
      .sheet-head h2 {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.45;
      }
      .sheet-head .sub {
        font-size: 12px;
        color: var(--muted-foreground);
        margin-top: 3px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        line-height: 1.45;
      }
      .sheet-body {
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        scrollbar-width: none;
        min-height: 0;
        position: relative;
      }
      .sheet.tall .sheet-body {
        flex: 1;
      }
      .sheet-body > * {
        flex-shrink: 0;
      }
      .sheet-body::-webkit-scrollbar {
        display: none;
      }
      .sheet-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-foreground);
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sheet-label .aside {
        font-weight: 400;
        margin-left: auto;
        color: var(--fg-faint);
      }
      .sheet-foot {
        display: flex;
        gap: 10px;
        padding: 12px 16px 34px;
        flex: none;
      }
      .close-x {
        width: 30px;
        height: 30px;
        border-radius: 15px;
        background: var(--secondary);
        display: grid;
        place-items: center;
        color: var(--muted-foreground);
        margin-left: auto;
        flex: none;
      }
      .close-x .ic {
        width: 14px;
        height: 14px;
      }
      .note-line {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted-foreground);
      }
      .note-line .ic {
        margin-top: 2px;
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: 46px;
        transform: translateX(-50%);
        z-index: 80;
        max-width: 340px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--popover);
        border: 1px solid var(--input);
        box-shadow: var(--shadow-md);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        animation: toast-in 0.18s ease-out;
      }
      .toast .ic {
        color: var(--status-success);
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translate(-50%, 6px);
        }
      }
      .offline-band {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--agent-unverifiable) 10%, transparent);
        font-size: 12px;
        line-height: 1.5;
      }
      .offline-band > .ag {
        margin-top: 2px;
      }
      .offline-band .s {
        color: var(--muted-foreground);
      }

      /* ---------- home ---------- */
      .home-top {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 8px 0 20px;
        flex: none;
      }
      .home-top h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .home-top .host-pill {
        margin-left: 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--secondary);
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .composer {
        margin: 4px 16px 0;
        background: var(--card);
        border: 1px solid var(--input);
        border-radius: 16px;
        padding: 10px 10px 8px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .composer:focus-within {
        border-color: var(--ring);
      }
      .cb-field {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        min-height: 44px;
      }
      .cb-field textarea {
        flex: 1;
        min-width: 120px;
        font-size: 14px;
        line-height: 1.55;
        padding: 2px 0;
        height: 26px;
        min-height: 48px;
        max-height: 120px;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .cb-field.has-chip textarea {
        flex-basis: 100%;
        min-height: 26px;
      }
      .chat-dock .cb-field {
        min-height: 28px;
      }
      .chat-dock .cb-field textarea {
        min-height: 26px;
      }
      .chat-dock .composer {
        padding-top: 8px;
        gap: 2px;
      }
      .m-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 4px 0 8px;
        border-radius: 7px;
        background: color-mix(in srgb, var(--callout-note) 14%, var(--secondary));
        border: 1px solid color-mix(in srgb, var(--callout-note) 35%, transparent);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        max-width: 100%;
      }
      .m-chip .ic {
        width: 12px;
        height: 12px;
        color: var(--muted-foreground);
      }
      .m-chip .host {
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .m-chip button {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        color: var(--fg-faint);
        border-radius: 5px;
      }
      .cb-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: -6px;
      }
      .cb-btn {
        height: 30px;
        padding: 0 8px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .cb-btn .ic {
        width: 16px;
        height: 16px;
      }
      .cb-btn.at {
        width: 30px;
        padding: 0;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
      }
      .cb-send {
        width: 32px;
        height: 32px;
        border-radius: 16px;
        background: var(--secondary);
        color: var(--fg-faint);
        display: grid;
        place-items: center;
        flex: none;
      }
      .cb-send .ic {
        width: 16px;
        height: 16px;
      }
      .cb-send.on {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .cb-hint {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 20px 0;
        font-size: 12px;
        color: var(--muted-foreground);
        line-height: 1.45;
      }
      .cb-hint .ic {
        color: var(--fg-faint);
      }
      .cb-hint.warn {
        color: var(--agent-unverifiable);
      }

      .sec {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 20px;
        margin: 22px 0 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .sec .n {
        font-weight: 500;
        color: var(--fg-faint);
        font-size: 12px;
      }
      .sec .n.attn {
        color: var(--agent-question-text);
      }
      .sec .act {
        margin-left: auto;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted-foreground);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .sec .tog {
        width: 12px;
        height: 12px;
        color: var(--fg-faint);
        transition: transform 0.15s;
      }
      .sec.collapsed .tog {
        transform: rotate(-90deg);
      }
      .sec.clickable {
        cursor: pointer;
      }

      .list-card {
        margin: 0 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .ny {
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        cursor: pointer;
      }
      .ny + .ny {
        border-top: 1px solid var(--border);
      }
      .ny > .ag,
      .ny > .st {
        margin-top: 1px;
      }
      .ny-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .t-line {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .t-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .t-time {
        font-size: 11px;
        color: var(--fg-faint);
        white-space: nowrap;
        flex: none;
      }
      .t-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
        min-width: 0;
      }
      .t-meta .sep {
        color: var(--fg-faint);
      }
      .t-meta .ws {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .kind {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .ny-q {
        font-size: 13px;
        line-height: 1.5;
        color: var(--foreground);
      }
      .ny-acts {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
      }

      .tcard {
        display: flex;
        gap: 10px;
        padding: 12px 14px 11px;
        cursor: pointer;
        position: relative;
      }
      .tcard + .tcard,
      .tcard + .tchild-wrap + .tcard {
        border-top: 1px solid var(--border);
      }
      .tcard > .st {
        margin-top: 2px;
      }
      .tcard:active {
        background: var(--hover);
      }
      .prog {
        font-size: 13px;
        line-height: 1.5;
        color: color-mix(in srgb, var(--foreground) 82%, transparent);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-top: 2px;
      }
      .prog.open {
        -webkit-line-clamp: unset;
        display: block;
      }
      .prog.dim {
        color: var(--muted-foreground);
      }
      .prog .src {
        font-size: 11px;
        color: var(--fg-faint);
        margin-right: 4px;
      }
      .t-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
        margin-top: 3px;
        min-width: 0;
      }
      .t-foot .r {
        margin-left: auto;
        color: var(--fg-faint);
        font-size: 11px;
      }
      .gen {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        color: var(--ai-action-accent);
        white-space: nowrap;
      }
      .gen .ic {
        width: 11px;
        height: 11px;
      }
      .gen.pending {
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.45;
        }
      }
      .fresh {
        animation: fresh 1.6s ease-out;
        border-radius: 4px;
      }
      @keyframes fresh {
        0% {
          background: color-mix(in srgb, var(--ai-action-accent) 30%, transparent);
        }
        100% {
          background: transparent;
        }
      }
      .tchild-wrap {
        padding: 0 14px 10px 40px;
        margin-top: -4px;
      }
      .tchild {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--secondary);
        font-size: 13px;
        min-width: 0;
        cursor: pointer;
      }
      .tchild .ic.corner {
        color: var(--fg-faint);
        width: 13px;
        height: 13px;
      }
      .tchild .ttl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tchild.fresh-row {
        animation: fresh 1.6s ease-out;
      }
      .folded {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .host-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        cursor: pointer;
      }
      .host-row + .host-row {
        border-top: 1px solid var(--border);
      }
      .host-row.off .row-title {
        color: var(--muted-foreground);
      }

      /* 已派活卡 */
      .disp {
        margin: 10px 16px 0;
        background: var(--card);
        border: 1px solid var(--input);
        border-radius: 14px;
        overflow: hidden;
        position: relative;
      }
      .disp-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 10px 0 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--status-success);
      }
      .disp-h .ic {
        width: 15px;
        height: 15px;
      }
      .disp-h .muted {
        font-weight: 400;
      }
      .disp-h .undo {
        margin-left: auto;
        height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--secondary);
        border: 1px solid var(--border);
        color: var(--foreground);
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        width: 104px;
        justify-content: center;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .disp-h .undo .ic {
        width: 13px;
        height: 13px;
        color: var(--muted-foreground);
      }
      .disp-h .x {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        color: var(--fg-faint);
        margin-left: 2px;
      }
      .disp-h .x:only-of-type {
        margin-left: auto;
      }
      .disp-b {
        padding: 8px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .disp-task {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        cursor: pointer;
      }
      .disp-task .st {
        margin-top: 2px;
      }
      .disp-task .t {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }
      .disp-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        min-width: 0;
        padding-left: 24px;
      }
      .disp-row .ic {
        color: var(--fg-faint);
      }
      .disp-note {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        font-size: 12px;
        line-height: 1.5;
        color: var(--foreground);
        padding: 7px 9px;
        margin-left: 24px;
        border-radius: 8px;
        background: var(--secondary);
      }
      .disp-note .ic {
        margin-top: 2px;
        color: var(--muted-foreground);
      }
      .disp-bar {
        height: 2px;
        background: var(--secondary);
      }
      .disp-bar i {
        display: block;
        height: 100%;
        background: var(--muted-foreground);
        transition: width 1s linear;
      }
      .disp.undone .disp-h {
        color: var(--muted-foreground);
      }
      .disp.noproj {
        border-color: color-mix(in srgb, var(--callout-note) 45%, transparent);
      }
      .disp.noproj .disp-h {
        color: var(--foreground);
        font-size: 14px;
      }
      .disp.noproj .disp-h .ic {
        color: var(--muted-foreground);
      }
      .disp-row.np {
        padding-left: 0;
        color: var(--foreground);
      }
      .disp-row.np b {
        font-weight: 600;
      }
      .disp.noproj .disp-note {
        margin-left: 0;
      }
      .disp.noproj .ny-acts {
        margin-top: 4px;
        justify-content: flex-end;
      }
      .disp.undone .disp-b {
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.55;
      }

      /* long-press preview */
      .preview-scrim {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: rgb(0 0 0 / 0.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .preview {
        position: absolute;
        left: 16px;
        right: 16px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .preview .pv-card {
        background: var(--card);
        border: 1px solid var(--input);
        border-radius: 14px;
        box-shadow: var(--shadow-lg);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .pv-h {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-foreground);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pv-text {
        font-size: 14px;
        line-height: 1.6;
      }
      .pv-menu {
        background: var(--popover);
        border: 1px solid var(--input);
        border-radius: 14px;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        width: 240px;
      }
      .pv-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 0 14px;
        height: 44px;
        font-size: 14px;
      }
      .pv-menu button + button {
        border-top: 1px solid var(--border);
      }
      .pv-menu .ic {
        margin-left: auto;
        color: var(--muted-foreground);
      }

      /* @ 提及抽屉 */
      .mention-search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 12px;
        border-radius: 10px;
        background: var(--secondary);
        border: 1px solid var(--ring);
        margin: 0 16px 6px;
        flex: none;
      }
      .mention-search .at {
        font-weight: 600;
        color: var(--muted-foreground);
      }
      .mention-search input {
        flex: 1;
        font-size: 14px;
        min-width: 0;
      }
      .mention-tabs {
        display: flex;
        gap: 6px;
        padding: 0 16px 8px;
        flex: none;
      }
      .mention-tabs button {
        height: 28px;
        padding: 0 11px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted-foreground);
        background: var(--secondary);
        border: 1px solid var(--border);
      }
      .mention-tabs button.on {
        color: var(--foreground);
        border-color: var(--input);
        background: var(--accent);
      }
      .m-group {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-foreground);
        padding: 10px 4px 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .m-group .n {
        font-weight: 500;
        color: var(--fg-faint);
      }
      .mrow {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 12px;
        min-height: 48px;
        width: 100%;
        cursor: pointer;
      }
      .mrow + .mrow {
        border-top: 1px solid var(--border);
      }
      .mrow > .ic {
        color: var(--muted-foreground);
        width: 18px;
        height: 18px;
      }
      .mrow .mt {
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .mrow .ms {
        font-size: 12px;
        color: var(--muted-foreground);
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
        white-space: nowrap;
        min-width: 0;
      }
      .mrow .tag {
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        height: 20px;
        padding: 0 7px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        background: var(--secondary);
        color: var(--muted-foreground);
        border: 1px solid var(--border);
        flex: none;
      }
      .mrow .tag.own {
        color: var(--foreground);
      }
      .mrow.dis {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .mrow.dis .ms {
        color: var(--agent-unverifiable);
      }
      .mrow.dis .ms .ag {
        opacity: 1;
      }
      .mrow.hl {
        background: var(--row-selected);
      }

      /* ---------- task detail ---------- */
      .d-head {
        padding: 4px 16px 0;
      }
      .d-crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        margin-bottom: 8px;
      }
      .d-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.2px;
        line-height: 1.35;
        margin-bottom: 12px;
      }
      .d-acts {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .d-sec {
        padding: 0 16px;
        margin-top: 22px;
      }
      .d-sec-h {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-foreground);
        margin-bottom: 8px;
      }
      .d-sec-h .n {
        font-weight: 500;
        color: var(--fg-faint);
      }
      .d-sec-h .act {
        margin-left: auto;
        font-weight: 500;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--muted-foreground);
      }
      .d-desc {
        font-size: 14px;
        line-height: 1.6;
      }
      .d-sec .card {
        margin: 0;
      }
      .ws-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--secondary);
        border: 1px solid var(--border);
        font-size: 12px;
        white-space: nowrap;
        max-width: 100%;
        cursor: pointer;
      }
      .ws-chip .mono {
        font-size: 11px;
      }
      .ws-chip .ic {
        width: 12px;
        height: 12px;
        color: var(--muted-foreground);
      }
      .ws-chip.off {
        color: var(--muted-foreground);
      }

      .prog-card {
        background: var(--card);
        border: 1px solid var(--input);
        border-radius: 14px;
        overflow: hidden;
      }
      .pc-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 0;
        font-size: 12px;
        font-weight: 600;
      }
      .pc-h .t {
        color: var(--foreground);
      }
      .pc-h .time {
        margin-left: auto;
        font-weight: 400;
        color: var(--fg-faint);
        font-size: 11px;
      }
      .pc-src {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px 0;
        font-size: 12px;
        color: var(--muted-foreground);
        min-width: 0;
        white-space: nowrap;
      }
      .pc-src .badge {
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: var(--secondary);
        color: var(--muted-foreground);
        border: 1px solid var(--border);
        flex: none;
      }
      .pc-src .badge.gen {
        color: var(--ai-action-accent);
        border-color: color-mix(in srgb, var(--ai-action-accent) 35%, transparent);
      }
      .pc-text {
        padding: 8px 14px 12px;
        font-size: 14px;
        line-height: 1.6;
      }
      .pc-text.dim {
        color: var(--muted-foreground);
      }
      .pc-kv {
        display: flex;
        gap: 10px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        align-items: baseline;
      }
      .pc-kv .k {
        color: var(--muted-foreground);
        width: 64px;
        flex: none;
      }
      .pc-kv .v {
        flex: 1;
        min-width: 0;
        line-height: 1.5;
      }
      .pc-kv .v.none {
        color: var(--fg-faint);
      }
      .pc-acts {
        display: flex;
        border-top: 1px solid var(--border);
      }
      .pc-acts button {
        flex: 1;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--foreground);
      }
      .pc-acts button + button {
        border-left: 1px solid var(--border);
      }
      .pc-acts .ic {
        width: 14px;
        height: 14px;
        color: var(--muted-foreground);
      }
      .pc-acts button.gen-btn .ic {
        color: var(--ai-action-accent);
      }
      .pc-acts button[disabled] {
        color: var(--fg-faint);
        pointer-events: none;
      }
      .pc-all {
        border-top: 1px solid var(--border);
      }
      .pc-item {
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pc-item + .pc-item {
        border-top: 1px solid var(--border);
      }
      .pc-item .h {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .pc-item .h .time {
        margin-left: auto;
        color: var(--fg-faint);
      }
      .pc-item .b {
        font-size: 13px;
        line-height: 1.55;
      }

      .ses-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 11px 12px;
        cursor: pointer;
        width: 100%;
      }
      .ses-row + .ses-row {
        border-top: 1px solid var(--border);
      }
      .ses-row > .ag {
        margin-top: 2px;
      }
      .ses-row .l1 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
        min-width: 0;
        white-space: nowrap;
      }
      .ses-row .stt {
        font-size: 12px;
        font-weight: 500;
      }
      .ses-row .l2 {
        font-size: 13px;
        line-height: 1.5;
        margin-top: 3px;
        color: color-mix(in srgb, var(--foreground) 82%, transparent);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .ses-row .l3 {
        font-size: 11px;
        color: var(--fg-faint);
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .ses-row .chev {
        margin-top: 2px;
      }
      .ses-empty {
        padding: 12px;
        font-size: 13px;
        color: var(--muted-foreground);
      }

      .pc-older {
        padding: 10px 14px 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--fg-faint);
      }
      .pc-older + .pc-item {
        padding-top: 6px;
      }
      .msg-tool {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        padding: 2px 4px;
      }
      .ro-list .li .out {
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .ro-list .li .mono {
        font-size: 11px;
      }
      .ro-list .li.skip {
        color: var(--agent-unverifiable);
      }
      .ro-list .li.skip::before {
        display: none;
      }
      .peek-h .s.task {
        color: var(--foreground);
        cursor: pointer;
      }
      .peek-h .s .ic {
        color: var(--muted-foreground);
      }

      .tl {
        position: relative;
        padding-left: 22px;
      }
      .tl::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 1px;
        background: var(--input);
      }
      .tl-item {
        position: relative;
        padding: 6px 0;
        font-size: 13px;
        color: var(--muted-foreground);
        line-height: 1.55;
      }
      .tl-item b {
        color: var(--foreground);
        font-weight: 600;
      }
      .tl-item .who {
        color: var(--foreground);
        font-weight: 600;
      }
      .tl-item .mono {
        font-size: 12px;
        color: var(--foreground);
      }
      .tl-dot {
        position: absolute;
        left: -19px;
        top: 12px;
        width: 9px;
        height: 9px;
        border-radius: 5px;
        background: var(--background);
        border: 1.5px solid var(--ring);
      }
      .tl-dot.agent {
        border-color: var(--agent-working);
      }
      .tl-dot.you {
        border-color: var(--foreground);
      }
      .tl-dot.chat {
        border-color: var(--callout-note);
      }
      .tl-dot.rule {
        border-color: var(--ring);
        border-style: dashed;
      }
      .tl-time {
        color: var(--fg-faint);
        margin-left: 4px;
        white-space: nowrap;
        font-size: 12px;
      }
      .tl-rule {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        border: 1px solid var(--input);
        font-size: 10px;
        color: var(--muted-foreground);
        vertical-align: 1px;
        white-space: nowrap;
      }
      .tl-rule .ic {
        width: 10px;
        height: 10px;
      }
      .tl-quote {
        margin-top: 6px;
        padding: 8px 11px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--foreground);
        line-height: 1.55;
      }
      .tl-link {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-left: 6px;
        font-size: 12px;
        color: var(--foreground);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .cmt {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .cmt textarea {
        flex: 1;
        min-height: 42px;
        max-height: 120px;
        padding: 10px 14px;
        border-radius: 21px;
        background: var(--card);
        border: 1px solid var(--input);
        font-size: 14px;
        line-height: 1.5;
      }
      .send-btn {
        width: 42px;
        height: 42px;
        border-radius: 21px;
        background: var(--secondary);
        color: var(--fg-faint);
        display: grid;
        place-items: center;
        flex: none;
      }
      .send-btn .ic {
        width: 18px;
        height: 18px;
      }
      .send-btn.on {
        background: var(--primary);
        color: var(--primary-foreground);
      }

      /* 验收条 */
      .accept {
        margin: 14px 16px 0;
        border-radius: 14px;
        border: 1px solid color-mix(in srgb, var(--workspace-status-review) 55%, transparent);
        background: color-mix(in srgb, var(--workspace-status-review) 7%, var(--card));
        overflow: hidden;
      }
      .acc-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .acc-h .time {
        margin-left: auto;
        font-size: 11px;
        font-weight: 400;
        color: var(--fg-faint);
      }
      .acc-sub {
        padding: 0 14px 8px;
        font-size: 12px;
        color: var(--muted-foreground);
        line-height: 1.5;
      }
      .acc-kv {
        display: flex;
        gap: 10px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        align-items: flex-start;
      }
      .acc-kv .k {
        width: 60px;
        flex: none;
        color: var(--muted-foreground);
        font-size: 12px;
        padding-top: 1px;
      }
      .acc-kv .v {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        line-height: 1.5;
      }
      .acc-kv .v .line {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .acc-kv .v .line > .ic {
        color: var(--muted-foreground);
      }
      .acc-lnk {
        font-size: 12px;
        color: var(--muted-foreground);
        text-decoration: underline;
        text-decoration-color: var(--input);
        text-underline-offset: 3px;
      }
      .acc-acts {
        display: flex;
        gap: 10px;
        padding: 12px 14px 14px;
        border-top: 1px solid var(--border);
      }
      .acc-ask {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px 0;
        font-size: 11px;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      .result-band {
        margin: 14px 16px 0;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--input);
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13px;
        line-height: 1.55;
      }
      .result-band > .ic {
        margin-top: 2px;
        color: var(--status-success);
      }
      .result-band .s {
        color: var(--muted-foreground);
        font-size: 12px;
        margin-top: 2px;
      }
      .dlv {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--status-success);
      }
      .dlv .ic {
        width: 12px;
        height: 12px;
      }

      /* ---------- peek (会话速览) ---------- */
      .peek-h {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 16px 10px;
        flex: none;
      }
      .peek-h > .ag {
        margin-top: 3px;
      }
      .peek-h .t {
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .peek-h .stt {
        font-size: 12px;
        font-weight: 500;
      }
      .peek-h .s {
        font-size: 12px;
        color: var(--muted-foreground);
        margin-top: 3px;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        min-width: 0;
      }
      /* 会话名下拉：任务和子任务的会话之间切换 */
      .ses-sw {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 24px;
        margin: -3px -2px -3px -6px;
        padding: 0 6px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
        white-space: nowrap;
      }
      .ses-sw .ic {
        color: var(--muted-foreground);
      }
      .ses-sw.on {
        background: var(--hover);
      }
      .sw-pop {
        position: absolute;
        left: 36px;
        top: 54px;
        z-index: 5;
        width: 300px;
        padding: 4px;
        border-radius: 12px;
        background: var(--popover);
        border: 1px solid var(--input);
        box-shadow: var(--shadow-lg);
      }
      .sw-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 40px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 13px;
        color: var(--foreground);
        text-align: left;
      }
      .sw-row.on {
        background: var(--row-selected);
      }
      .sw-row .n {
        font-weight: 600;
        white-space: nowrap;
      }
      .sw-row .k {
        font-size: 11px;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .sw-row .stt {
        margin-left: auto;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .sw-row .ck {
        width: 14px;
        height: 14px;
        flex: none;
      }
      /* 速览 = 会话的小边框模式：顶部可上拉到全屏，底部是会话自己的输入 */
      .pull {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding-bottom: 2px;
        cursor: pointer;
      }
      .pull span {
        font-size: 10px;
        color: var(--fg-faint);
        line-height: 1;
        min-height: 10px;
      }
      .peek-in {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 16px 0;
      }
      .peek-opts {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .term-in {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        padding: 0 6px 0 12px;
        border-radius: 12px;
        background: var(--editor-surface);
        border: 1px solid var(--ring);
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .term-in .d {
        color: var(--muted-foreground);
      }
      .term-in input {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--foreground);
      }
      .term-in input::placeholder {
        color: var(--fg-faint);
      }
      .send-btn.sm {
        width: 32px;
        height: 32px;
        border-radius: 16px;
      }
      .send-btn.sm .ic {
        width: 15px;
        height: 15px;
      }
      .msg.typing .bub {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .term {
        background: var(--editor-surface);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.6;
        padding: 10px 12px;
        color: var(--foreground);
        white-space: pre;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .term .d {
        color: var(--muted-foreground);
      }
      .term .g {
        color: var(--git-added);
      }
      .term .r {
        color: var(--git-deleted);
      }
      .term .y {
        color: var(--agent-working);
      }
      .term.stale {
        opacity: 0.55;
      }
      .msgs {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 4px 0;
      }
      .msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 86%;
      }
      .msg .who {
        font-size: 11px;
        color: var(--fg-faint);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .msg .bub {
        padding: 9px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.55;
        background: var(--secondary);
        border: 1px solid var(--border);
      }
      .msg.me {
        align-self: flex-end;
        align-items: flex-end;
      }
      .msg.me .bub {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: transparent;
        border-radius: 14px 14px 4px 14px;
      }
      .msg.agent .bub {
        border-radius: 14px 14px 14px 4px;
      }
      .msg.ask .bub {
        border-color: color-mix(in srgb, var(--agent-question) 50%, transparent);
      }
      .reply-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .reply-row textarea {
        flex: 1;
        min-height: 44px;
        max-height: 96px;
        padding: 11px 14px;
        border-radius: 22px;
        background: var(--secondary);
        border: 1px solid var(--input);
        font-size: 14px;
        line-height: 1.5;
      }
      .reply-row textarea:focus {
        border-color: var(--ring);
      }
      .reply-row textarea[disabled] {
        opacity: 0.5;
      }

      /* ---------- session page ---------- */
      .s-top {
        display: flex;
        align-items: center;
        min-height: 52px;
        padding: 2px 4px;
        background: var(--card);
        flex: none;
      }
      .s-title {
        flex: 1;
        min-width: 0;
      }
      .s-title .t {
        font-size: 14px;
        font-weight: 600;
      }
      .s-title .m {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-foreground);
        margin-top: 2px;
        white-space: nowrap;
      }
      .s-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 14px;
        background: var(--card);
        border-top: 1px solid var(--border);
        font-size: 12px;
        flex: none;
        cursor: pointer;
      }
      .s-strip .ttl {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .s-tabs {
        display: flex;
        align-items: stretch;
        height: 42px;
        background: var(--card);
        border-top: 1px solid var(--border);
        flex: none;
      }
      .s-tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        font-size: 13px;
        color: var(--foreground);
        background: var(--secondary);
        border-right: 1px solid var(--border);
        border-bottom: 2px solid var(--muted-foreground);
        white-space: nowrap;
        margin-left: 8px;
        border-left: 1px solid var(--border);
      }
      .s-tabs .icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 0;
        margin-left: auto;
      }
      .s-term {
        flex: 1;
        border-radius: 0;
        border: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: 14px;
      }
      .s-keys {
        display: flex;
        gap: 6px;
        padding: 8px 10px;
        background: var(--card);
        border-top: 1px solid var(--border);
        flex: none;
      }
      .s-keys span {
        height: 30px;
        padding: 0 10px;
        border-radius: 7px;
        background: var(--secondary);
        font-family: var(--font-mono);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        color: var(--muted-foreground);
      }
      .s-input {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px 34px;
        background: var(--card);
        flex: none;
      }
      .s-input .box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        border-radius: 12px;
        background: var(--secondary);
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .s-input .box b {
        color: var(--foreground);
        font-size: 13px;
        font-weight: 600;
        display: block;
      }

      /* ---------- chat (通用对话) ---------- */
      .chat-body {
        padding: 4px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .day-sep {
        align-self: center;
        font-size: 11px;
        color: var(--fg-faint);
        padding: 4px 0;
      }
      .bot {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .bot-av {
        width: 28px;
        height: 28px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--ai-action-accent) 16%, var(--secondary));
        color: var(--ai-action-accent);
        display: grid;
        place-items: center;
        flex: none;
      }
      .bot-av .ic {
        width: 15px;
        height: 15px;
      }
      .bot-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bot-who {
        font-size: 12px;
        color: var(--muted-foreground);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .bot-who b {
        color: var(--foreground);
        font-weight: 600;
      }
      .bot-text {
        font-size: 14px;
        line-height: 1.6;
      }
      .ro-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 9px 11px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--border);
      }
      .ro-list .h {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted-foreground);
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 2px;
      }
      .ro-list .li {
        font-size: 12px;
        line-height: 1.5;
        color: var(--foreground);
        display: flex;
        gap: 6px;
      }
      .ro-list .li::before {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 2px;
        background: var(--fg-faint);
        margin-top: 8px;
        flex: none;
      }
      .thinking {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted-foreground);

          const S = (inner) =>
            `<svg class="st" width="${size}" height="${size}" viewBox="0 0 16 16" role="img" aria-label="${STATUS_NAME[status]}">${inner}</svg>`
          const ring = (color) =>
            `<circle cx="8" cy="8" r="6.25" style="fill:none;stroke:${color};stroke-width:1.5"/>`

            const r = 3.25
            const a = 2 * Math.PI * f
            return `<path d="M8 8 L8 ${8 - r} A${r} ${r} 0 ${f > 0.5 ? 1 : 0} 1 ${(8 + r * Math.sin(a)).toFixed(2)} ${(8 - r * Math.cos(a)).toFixed(2)} Z" style="fill:${color}"/>`
          }
          switch (status) {
            case 'todo':
              return S(ring('var(--muted-foreground)'))
            case 'doing':
              return S(
                ring('var(--workspace-status-progress)') +
                  pie(0.5, 'var(--workspace-status-progress)')

            case 'review':

          `<button class="icon-btn" data-act="soon" aria-label="${label}">${ic(icon)}</button>`

        // ======================================================================
        class Phone {
          constructor() {
            this.d = clone(D)
            this.seq = 0
            this.cards = {}
            this.convs = {}
            this.used = {}
            this.scrollMem = {}
            this.s = {
              route: { name: 'home' },
              stack: [],
              sheet: null,
              preview: null,
              toast: null,
              comp: { home: { chips: [], text: '' }, chat: { chips: [], text: '' } },
              dispatched: [],
              convId: 'c-now',
              foldDone: true,
              form: null,
              focus: null,
              ui: { allProgress: {}, genRunning: {}, comment: {}, sysOpen: {} }
            }
          }

          // ---------- data access ----------
          task(id) {
            return this.d.tasks.find((t) => t.id === id)
          }
          ws(id) {
            return this.d.workspaces.find((w) => w.id === id)
          }
          host(id) {
            return this.d.hosts.find((h) => h.id === id)
          }
          repo(id) {
            return this.d.repos.find((r) => r.id === id)
          }
          proj(key) {
            return this.d.projects.find((p) => p.key === key)
          }
          ses(id) {
            return this.d.sessions.find((s) => s.id === id)
          }
          wsHost(w) {
            return this.host(this.repo(w.repo).host)
          }
          taskWs(t) {
            if (t.ws) return this.ws(t.ws)
            if (t.parent) return this.taskWs(this.task(t.parent))
            return null
          }
          taskHost(t) {
            const w = this.taskWs(t)
            return w ? this.wsHost(w) : null
          }
          offline(t) {
            const h = this.taskHost(t)
            return !!(h && !h.online)
          }
          sessionsOf(tid) {
            return this.d.sessions.filter((s) => s.task === tid)
          }
          treeSessions(t) {
            return [
              ...this.sessionsOf(t.id),
              ...(t.children || []).flatMap((c) => this.sessionsOf(c))
            ]
          }
          // 父任务自己的会话；没有时退到子任务的（SHOP-12 的两个会话都挂在子任务上）。
          leadSession(t) {
            return this.sessionsOf(t.id)[0] || this.treeSessions(t)[0] || null
          }
          // 写了最新进展的那个会话（SHOP-12 是 Claude · 后端）；没有回写时退到 leadSession。
          latestSession(t) {
            const p = t.progress.find((x) => x.session && this.ses(x.session))
            return p ? this.ses(p.session) : this.leadSession(t)
          }
          rootOf(t) {
            return t.parent && this.task(t.parent) ? this.rootOf(this.task(t.parent)) : t
          }
          // 子任务汇总一行（S9）：数量、会话状态、最新的那条。
          kidsLine(t) {
            const kids = (t.children || []).map((c) => this.task(c)).filter(Boolean)
            if (!kids.length) return ''
            const ss = kids.flatMap((k) => this.sessionsOf(k.id))
            const st = !ss.length
              ? '还没有会话'
              : ss.every((s) => s.state === 'done')
                ? '都做完一轮'
                : ss.some((s) => s.state === 'waiting')
                  ? `${ss.filter((s) => s.state === 'waiting').length} 个等你回答`
                  : `${ss.filter((s) => s.state === 'working').length} 个工作中`
            const last = [...kids].sort((a, b) => (b.created || 0) - (a.created || 0))[0]
            const lk = last.created ? last : kids[kids.length - 1]
            const lt = this.latest(lk)
            return `<div class="t-kids">${ic('corner-down-right')}<span>子任务 ${kids.length} · ${st} · 最新：</span><span class="tid">${lk.id}</span><span class="ell">${esc(lt ? lt.text : '')}</span></div>`
          }
          // 仓库还没有项目时按仓库建一个（桌面上是派活里的一步，手机直接建并记在时间线上）。
          ensureProject(repo) {
            if (repo.project) return repo.project
            const key = repo.id.slice(0, 4).toUpperCase()
            this.d.projects.push({ key, name: repo.id, repo: repo.id })
            repo.project = key
            return key
          }
          nextId(key) {
            const nums = [
              ...this.d.tasks.filter((t) => t.project === key).map((t) => +t.id.split('-')[1]),
              ...(this.used[key] || [])
            ]
            return `${key}-${Math.max(0, ...nums) + 1}`
          }
          sesInfo(s) {
            const t = this.task(s.task)
            if (t && this.offline(t)) return { dot: 'unverifiable', text: '无法确认', cls: 'c-unv' }
            if (s.state === 'working')
              return {
                dot: 'working',
                text:
                  s.since === '刚刚'
                    ? s.last || s.replied
                      ? '工作中 · 刚刚'
                      : '工作中 · 刚启动'
                    : `工作中 · ${s.since}`,
                cls: 'c-w'
              }
            if (s.state === 'waiting')
              return {
                dot: 'waiting',
                text: s.reason === 'permission' ? '等你批准' : '等你回答',
                cls: 'c-q'

            if (s.state === 'done') return { dot: 'done', text: '做完一轮', cls: 'muted' }

          // 方案 §7.2：回写 → 最后一句话 → 只有会话状态。
          latest(t) {
            const p = t.progress[0]
            const s = this.leadSession(t)
            if (p)
              return {
                text: p.text + (this.needsOf(t, p) || ''),
                src: p.source === 'orca' ? 'Orca 生成' : '回写',
                time: p.time
              }
            // 刚回复过、智能体还没说话：卡片写明收到了你的话，不冒充回写。
            if (s && s.replied && !s.last)
              return { text: `${s.agent} 收到你的话，工作中`, src: '', time: '刚刚' }
            if (s && s.last)

                text: s.last,
                src: '最后一句话',
                time: s.state === 'waiting' ? s.since : '刚刚'
              }
            if (s) return { text: '会话已启动 · 等第一条回写', src: '', time: s.since, dim: true }

          needsOf(t, p) {

          }
          needsYou() {
            const out = []
            for (const t of this.d.tasks) {
              if (t.parent || t.snoozed || t.status === 'done' || this.offline(t)) continue
              const s = this.treeSessions(t).find((x) => x.state === 'waiting')
              if (s) out.push({ t, s, kind: 'answer' })
            }

              if (!t.parent && !t.snoozed && t.status === 'review') out.push({ t, kind: 'review' })
            return out
          }

          // ---------- navigation ----------
          routeKey(r) {

          }
          go(route) {
            this.s.stack.push(this.s.route)
            this.s.route = route
            this.scrollMem[this.routeKey(route)] = 0
            this.s.sheet = null
            this.s.preview = null
          }

            if (this.s.stack.length) this.s.route = this.s.stack.pop()
            else this.s.route = { name: 'home' }
            this.s.sheet = null
          }
          toast(text, icon = 'check') {
            this.s.toast = { text, icon }
            clearTimeout(this.toastTimer)
            if (!SHOT)
              this.toastTimer = setTimeout(() => {
                this.s.toast = null
                this.render()
              }, 2600)
          }

          // ---------- conversations ----------
          conv(id) {
            if (!this.convs[id]) this.convs[id] = this.buildConv(id)
            return this.convs[id]
          }
          buildConv(id) {
            const meta = D.conversations.find((c) => c.id === id)
            if (id === 'c-today') {
              return {
                id,
                msgs: [{ type: 'me', text: D.proposal.request, time: '9:38' }, this.proposalMsg()]
              }
            }
            if (meta && meta.dispatched) {
              const keys = meta.dispatched.map((tid) => {
                const t = this.task(tid)
                const s = this.sessionsOf(tid)[0]
                const key = `h-${tid}`
                this.cards[key] = {
                  key,
                  task: tid,
                  session: s && s.id,
                  ws: t.ws,
                  historical: true,
                  when: `${meta.day} ${meta.time}`,
                  undoLeft: 0
                }
                return key
              })
              return {
                id,
                msgs: [
                  {
                    type: 'me',
                    text: meta.request,
                    chips: meta.chips.map((w) => ({ type: 'ws', id: w })),
                    time: `${meta.day} ${meta.time}`
                  },
                  { type: 'cards', keys }
                ]
              }
            }
            if (meta && meta.reply) {
              return {
                id,
                msgs: [
                  { type: 'me', text: meta.request, time: `${meta.day} ${meta.time}` },
                  { type: 'bot', text: meta.reply }
                ]
              }
            }
            return { id, msgs: [] }
          }
          proposalMsg() {
            return {
              type: 'bot',
              ro: D.proposal.readOnly,
              skipped: D.proposal.skipped,
              text: '有 2 个工作区的 PR 还没合，各建一个任务跟进：',
              proposal: {
                items: clone(D.proposal.items).map((i) => ({ ...i, on: true })),
                editing: null,
                done: false
              }
            }
          }
          convTitle(m) {
            const chips = (m.chips || [])
              .map((ch) => {
                if (ch.type === 'ws') {
                  const w = this.ws(ch.id)
                  return `@${w.repo}/${w.name}`
                }
                return `@${ch.id}`
              })
              .join(' ')
            return `${chips ? `${chips} ` : ''}${m.text}`
          }
          histList() {
            const list = []
            // 这台手机上现场发生的对话（派活输入框、展开对话），排在今天最前面。
            Object.values(this.convs)
              .filter((c) => !D.conversations.some((x) => x.id === c.id) && c.msgs.length)
              .reverse()
              .forEach((c) => {
                const first = c.msgs.find((m) => m.type === 'me')
                const ids = c.msgs
                  .filter((m) => m.type === 'cards')
                  .flatMap((m) => m.keys)
                  .filter((k) => this.cards[k] && !this.cards[k].undone && this.cards[k].task)
                  .map((k) => this.cards[k].task)
                list.push({
                  id: c.id,
                  day: '今天',
                  time: c.time || '9:41',
                  title: first ? this.convTitle(first) : '新对话',
                  result: ids.length
                    ? `派出 ${ids.join('、')}`
                    : c.msgs.some((m) => m.type === 'cards')
                      ? '派活已撤销'
                      : '只聊天，没有派活'
                })
              })
            for (const c of D.conversations) {
              let result = c.result
              if (c.id === 'c-today' && this.convs['c-today']) {
                const p = this.convs['c-today'].msgs.find((m) => m.proposal)
                const keys = this.convs['c-today'].msgs.filter((m) => m.keys).flatMap((m) => m.keys)
                if (p && p.proposal.done)
                  result = p.proposal.cancelled
                    ? '提案已取消'
                    : `派出 ${keys.map((k) => this.cards[k].task).join('、')}`
              }
              list.push({ ...c, result })
            }
            const order = ['今天', '昨天']
            const mins = (c) => {
              const [h, m] = c.time.split(':').map(Number)
              return h * 60 + m
            }
            return list.sort(
              (a, b) =>
                (order.indexOf(a.day) + 1 || 9) - (order.indexOf(b.day) + 1 || 9) ||
                mins(b) - mins(a)
            )
          }

          // ---------- 派活 ----------
          createDispatch({
            target,
            text,
            title,
            agent = 'Claude',
            chips = [],
            origin,
            newProj = null
          }) {
            let w = null
            let parent = null
            let newWs = false
            if (target.type === 'ws') {
              w = this.ws(target.id)
              if (w.task) parent = w.task
            }
            if (target.type === 'task') {
              const pt = this.task(target.id)
              w = this.taskWs(pt)
              parent = pt.id
            }
            const repo = w ? this.repo(w.repo) : this.repo(target.id)
            if (target.type === 'repo') newWs = true
            const key = parent ? this.task(parent).project : repo.project
            const id = this.nextId(key)
            ;(this.used[key] = this.used[key] || []).push(+id.split('-')[1])
            if (newWs) {
              w = {
                id: `${repo.id}/${id.toLowerCase()}`,
                repo: repo.id,
                name: id.toLowerCase(),
                created: true
              }
              this.d.workspaces.push(w)
            }
            const h = this.wsHost(w)
            const src = origin === 'proposal' ? '调度会话' : '对话'
            // 标题就是第一句（截 60 字），路径 A 不起名；智能体开工后可以改。
            const t = {
              id,
              project: key,
