<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 宿主把 Orca 的设计 token 注进 :root,并给 <html> 挂 light/dark class
         (src/shared/plugins/plugin-panel-shell.ts)。只用白名单里那 20 个,并且都带兜底值 ——
         照 examples/plugins/hello-orca 的写法。自己定义同名变量会覆盖宿主的值,
         浅色宿主里就显示成暗色。

         版式照 Orca 内置右侧栏面板(checks-panel-content):12px 分区、border 分隔、
         11px 次要文字、bg-accent/20 信息块、到处 min-width:0。 */
      :root {
        --ok: #16a34a;
        --warn: #b45309;
        --r: calc(var(--radius, 0.625rem) * 0.6);
        --block: color-mix(in srgb, var(--accent, #eee) 20%, transparent);
      }
      html.dark {
        --ok: #4ade80;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
        min-width: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--background, transparent);
        color: var(--foreground, #ddd);
        font: 12px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-y: auto; /* iframe 是 h-full,面板文档自己滚 */
        overflow-x: hidden; /* 面板很窄,横向一律折行适配,不给滚动条 */
        overscroll-behavior: contain;
      }

      .sec {
        padding: 12px;
        border-bottom: 1px solid var(--border, #333);
      }
      .sec:last-child {
        border-bottom: 0;
      }
      .sec[hidden] {
        display: none;
      }
      .sec-label {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-bottom: 8px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .block {
        border-radius: var(--r);
        border: 1px solid var(--border, #333);
        background: var(--block);
        padding: 6px 10px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.45;
        word-break: break-all;
      }

      .title {
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .muted {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        word-break: break-word;
      }
      .clamp {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--muted-foreground, #999);
        flex: none;
      }
      .dot.run {
        background: var(--ok);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .dot.bad {
        background: var(--destructive, #e5484d);
      }
      .dot.warn {
        background: var(--warn);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      button.btn {
        font: inherit;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: var(--r);
        border: 1px solid var(--border, #555);
        background: transparent;
        color: var(--foreground, #ddd);
        cursor: pointer;
        flex: none;
      }
      button.btn:hover:not([disabled]) {
        background: var(--accent, #333);
        color: var(--accent-foreground, #fff);
      }
      button.btn.primary {
        background: var(--primary, #ddd);
        color: var(--primary-foreground, #111);
        border-color: transparent;
        font-weight: 500;
      }
      button.btn.wide {
        width: 100%;
        padding: 6px 9px;
        font-size: 12px;
      }
      button.btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      label.f {
        display: block;
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-bottom: 5px;
      }
      textarea,
      input.f {
        display: block;
        width: 100%;
        max-width: 100%;
        font: inherit;
        font-size: 11px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
        border: 1px solid var(--input, var(--border, #555));
        border-radius: var(--r);
        padding: 6px 8px;
        resize: vertical;
      }
      textarea:focus,
      input.f:focus {
        outline: none;
        border-color: var(--ring, var(--border, #777));
      }
      .hint {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-top: 5px;
        line-height: 1.45;
        word-break: break-word;
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--border, #555);
        border-radius: var(--r);
        padding: 2px;
        gap: 2px;
        flex: none;
      }
      .seg button {
        font: inherit;
        font-size: 11px;
        padding: 2px 10px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted-foreground, #999);
        cursor: pointer;
      }
      .seg button.on {
        background: var(--primary, #ddd);
        color: var(--primary-foreground, #111);
        font-weight: 500;
      }

      details > summary {
        cursor: pointer;
        font-size: 11px;
        color: var(--muted-foreground, #999);
        list-style: none;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      details > summary::before {
        content: "▸";
        font-size: 9px;
      }
      details[open] > summary::before {
        content: "▾";
      }

      .tl-item {
        display: grid;
        grid-template-columns: 15px minmax(0, 1fr);
        gap: 8px;
        padding-bottom: 10px;
        position: relative;
      }
      .tl-item:last-child {
        padding-bottom: 0;
      }
      .tl-item:not(:last-child)::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 15px;
        bottom: 0;
        width: 1px;
        background: var(--border, #333);
      }
      .tl-dot {
        width: 15px;
        height: 15px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border, #333);
        background: var(--background, transparent);
        font-size: 8px;
        color: var(--muted-foreground, #999);
        z-index: 1;
      }
      .tl-dot.ok {
        border-color: color-mix(in srgb, var(--ok) 55%, transparent);
        color: var(--ok);
      }
      .tl-dot.bad {
        border-color: color-mix(in srgb, var(--destructive, #e5484d) 55%, transparent);
        color: var(--destructive, #e5484d);
      }
      .tl-dot.warn {
        border-color: color-mix(in srgb, var(--warn) 55%, transparent);
        color: var(--warn);
      }
      .tl-head {
        display: flex;
        align-items: baseline;
        gap: 7px;
      }
      .tl-turn {
        font-size: 11px;
        font-weight: 500;
      }
      .tl-time {
        font-size: 11px;
        color: var(--muted-foreground, #999);
        margin-left: auto;
        flex: none;
      }

      .flag {
        margin-top: 5px;
        padding: 5px 8px;
        border-radius: var(--r);
        font-size: 11px;
        line-height: 1.45;
        border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
        background: color-mix(in srgb, var(--warn) 8%, transparent);
        color: var(--warn);
        word-break: break-word;
      }
      .blocker {
        padding: 6px 10px;
        border-radius: var(--r);
        font-size: 11px;
        line-height: 1.5;
        border: 1px solid color-mix(in srgb, var(--destructive, #e5484d) 40%, transparent);
        background: color-mix(in srgb, var(--destructive, #e5484d) 8%, transparent);
        color: var(--destructive, #e5484d);
        word-break: break-word;
      }
      .blocker code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        word-break: break-all;
      }

      .empty {
        padding: 24px 12px;
        text-align: center;
        font-size: 11px;
        color: var(--muted-foreground, #999);
      }
    </style>
  </head>
  <body>
    <!-- 骨架是静态的。刷新只改下面这几个具名区域的内容,绝不重建整页 ——
         整页重建会把用户正在输入的目标和验收标准一起冲掉。 -->
    <div class="sec" id="blocker-sec" hidden>
      <p class="blocker" id="blocker"></p>
    </div>

    <div class="sec" id="status-sec" hidden>
      <div class="row">
        <div class="title"><span class="dot" id="status-dot"></span><span id="status-text"></span></div>
        <div class="grow"></div>
        <button class="btn" id="stop" hidden>停止</button>
      </div>
      <div class="muted" id="status-facts" style="margin-top: 6px"></div>
      <div class="muted" id="status-reason"></div>
      <div class="muted clamp" id="status-objective" style="margin-top: 8px"></div>
    </div>

    <div class="sec" id="gate-sec" hidden>
      <div class="sec-label">验收</div>
      <div class="stack" id="gate-list"></div>
    </div>

    <div class="sec" id="rounds-sec" hidden>
      <div class="sec-label">逐轮记录</div>
      <div id="rounds"></div>
    </div>

    <p class="empty" id="empty" hidden>这个工作区还没有目标</p>

    <div class="sec">
      <div class="sec-label">新目标</div>
      <label class="f" for="objective">目标</label>
      <textarea id="objective" rows="4" placeholder="想让 agent 完成什么?写清楚「做完」是什么样子。"></textarea>
      <p class="hint">这段话每一轮都会原样重发,防止它把目标悄悄缩小。</p>
    </div>

    <div class="sec">
      <div class="row" style="margin-bottom: 6px">
        <label class="f" for="criteria" style="margin: 0">验收标准</label>
        <div class="grow"></div>
        <button class="btn" id="draft" disabled>✨ 从目标生成</button>
      </div>
      <textarea id="criteria" class="mono" rows="5" placeholder="什么算「做到了」?写具体到文件和行为。"></textarea>
      <div class="row" style="margin-top: 8px">
        <label class="f" style="margin: 0">裁判</label>
        <div class="grow"></div>
        <div class="seg" id="judge">
          <button data-agent="claude">claude</button>
          <button data-agent="codex" class="on">codex</button>
        </div>
      </div>
      <p class="hint">选一个和干活那个不同家族的模型 —— 同门的盲点是相关的。</p>
    </div>

    <div class="sec">
      <details>
        <summary>另外还要跑的命令</summary>
        <p class="hint">这些只证明「没弄坏」,证明不了「做到了」。</p>
        <input class="f mono" id="checks" placeholder="pnpm test" />
      </details>
    </div>

    <div class="sec">
      <button class="btn primary wide" id="start" disabled>在当前终端上开始</button>
      <p class="hint">面板起不了后台循环,命令又不能带参数 —— 现在请用 <span class="mono">orca-goal start</span>。</p>
    </div>

    <script>
      'use strict'
      // —— 面板 ↔ 宿主的桥。协议见 src/shared/plugins/plugin-panel-bridge.ts ——
      // 照 hello-orca 的契约:永远 resolve,返回 { ok, value, errorCode, error },
      // 调用方查 ok。这样不会产生未处理的 rejection。
      var seq = 0
      var pending = {}

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          // 面板是 opaque origin,targetOrigin 只能用 '*';宿主改为校验发送方窗口。
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        var data = event.data
        if (!data || data.type !== 'orca-panel-action-result') return
        var resolve = pending[data.requestId]
        if (!resolve) return
        delete pending[data.requestId]
        resolve(data)
      })

      var el = {}
      ;[
        'blocker-sec', 'blocker', 'status-sec', 'status-dot', 'status-text', 'status-facts',
        'status-reason', 'status-objective', 'stop', 'gate-sec', 'gate-list', 'rounds-sec',
        'rounds', 'empty', 'judge'
      ].forEach(function (id) {
        el[id] = document.getElementById(id)
      })

      var LABEL = {
        active: '进行中', complete: '目标达成', blocked: '受阻',
        budget_exhausted: '预算耗尽', stalled: '空转', aborted: '人为中断'
      }
      var TONE = {
        active: 'run', complete: 'ok', blocked: 'bad',
        budget_exhausted: 'warn', stalled: 'warn', aborted: ''
      }

      function ago(ts) {
        if (!ts) return ''
        var m = Math.round((Date.now() - ts) / 60000)
        if (m < 1) return '刚刚'
        return m < 60 ? m + ' 分钟前' : Math.round(m / 60) + ' 小时前'
      }

      function node(tag, cls, text) {
        var n = document.createElement(tag)
        if (cls) n.className = cls
        if (text != null) n.textContent = text
        return n
      }

      function renderGate(commands) {
        el['gate-list'].textContent = ''
        if (!commands.length) {
          el['gate-list'].appendChild(node('div', 'muted', '没有配验收 —— 它说做完了就是做完了'))
          return
        }
        commands.forEach(function (c) {
          el['gate-list'].appendChild(node('div', 'block mono', c))
        })
      }

      function renderRounds(rounds) {
        el.rounds.textContent = ''
        rounds
          .slice()
          .reverse()
          .forEach(function (r) {
            var claim = r.claim && r.claim.kind
            var tone =
              r.acceptancePassed === false ? 'bad' : r.acceptancePassed === true ? 'ok' : claim ? 'warn' : ''
            var item = node('div', 'tl-item')
            item.appendChild(
              node('div', 'tl-dot ' + tone, r.acceptancePassed === false ? '✕' : r.acceptancePassed === true ? '✓' : '')
            )
            var main = node('div')
            var head = node('div', 'tl-head')
            head.appendChild(node('span', 'tl-turn', '第 ' + r.turn + ' 轮'))
            head.appendChild(node('span', 'tl-time', ago(Date.parse(r.at))))
            main.appendChild(head)

            var notes = []
            if (claim === 'complete') notes.push(r.acceptancePassed === false ? '声称完成 → 验收未通过' : '声称完成')
            if (claim === 'blocked') notes.push('声称受阻')
            if (r.prompt === 'tamper-challenge') notes.push('收到篡改质证')
            if (r.prompt === 'rejected-completion') notes.push('收到验收驳回')
            if (notes.length) main.appendChild(node('div', 'muted', notes.join(' · ')))
            ;(r.findings || [])
              .filter(function (f) { return f.challenge })
              .forEach(function (f) {
                main.appendChild(node('div', 'flag', '⚑ ' + f.label + ':' + f.detail))
              })

            item.appendChild(main)
            el.rounds.appendChild(item)
          })
      }

      function renderGoal(g) {
        var b = g.budget || {}
        var mins = Math.round((Date.now() - g.startedAt) / 60000)
        var facts = [
          '第 ' + g.turns + ' 轮' + (b.maxTurns ? ' / ' + b.maxTurns : ''),
          mins + ' 分钟' + (b.maxMinutes ? ' / ' + b.maxMinutes : '')
        ]
        if (g.falseClaims) facts.push('假完成 ' + g.falseClaims + ' 次')
        if (g.tamperChallenges) facts.push('挡回 ' + g.tamperChallenges + ' 次')

        el['status-dot'].className = 'dot ' + (TONE[g.state] || '')
        el['status-text'].textContent = LABEL[g.state] || g.state
        el['status-facts'].textContent = facts.join(' · ')
        el['status-reason'].textContent = g.finishReason || ''
        el['status-objective'].textContent = g.objective
        el.stop.hidden = g.state !== 'active'
        el['status-sec'].hidden = false

        renderGate((g.acceptance && g.acceptance.commands) || [])
        el['gate-sec'].hidden = false

        var rounds = g.rounds || []
        renderRounds(rounds)
        el['rounds-sec'].hidden = rounds.length === 0
      }

      function refresh() {
        // storage.get 返回 { value: <存进去的东西> },面板桥又包一层 value,要剥两层。
        call('storage.get', { key: 'goals' }).then(function (result) {
          if (!result.ok) {
            el.blocker.innerHTML =
              '<b>面板读不到数据。</b>宿主拒绝了 <code>storage.get</code>(<code>' +
              (result.errorCode || '?') +
              '</code>)。把 <code>plugin-host-api.ts</code> 里 <code>storage.get</code> 的 ' +
              '<code>panel</code> 改成 <code>true</code>。'
            el['blocker-sec'].hidden = false
            return
          }
          el['blocker-sec'].hidden = true
          var payload = result.value && result.value.value ? result.value.value : result.value
          var goals = (payload && payload.goals) || []
          var shown = null
          for (var i = 0; i < goals.length; i++) {
            if (goals[i].state === 'active') { shown = goals[i]; break }
          }
          if (!shown) shown = goals[0]

          if (shown) {
            renderGoal(shown)
            el.empty.hidden = true
          } else {
            el['status-sec'].hidden = true
            el['gate-sec'].hidden = true
            el['rounds-sec'].hidden = true
            el.empty.hidden = false
          }
        })
      }

      el.stop.addEventListener('click', function () {
        call('notifications.show', {
          title: '目标模式',
          body: '面板还不能停止目标,请用 orca-goal stop'
        })
      })

      el.judge.addEventListener('click', function (event) {
        var btn = event.target.closest('button[data-agent]')
        if (!btn) return
        Array.prototype.forEach.call(el.judge.querySelectorAll('button'), function (b) {
          b.classList.toggle('on', b === btn)
        })
      })

      refresh()
      setInterval(refresh, 4000)
    </script>
  </body>
</html>
